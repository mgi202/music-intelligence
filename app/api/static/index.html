<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0d0d11">
<title>Music Intelligence</title>
<style>
  :root {
    --bg: #0d0d11; --panel: #16161d; --panel2: #1e1e28;
    --text: #e8e8ee; --dim: #8a8a99; --accent: #c8ff00;
    --accent-dim: #87ab00; --danger: #ff5470; --radius: 10px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, "Segoe UI", Roboto, sans-serif; padding-bottom: 140px; }

  header { position: sticky; top: 0; z-index: 20; background: rgba(13,13,17,.96); backdrop-filter: blur(8px); padding: 12px 14px 8px; border-bottom: 1px solid #23232e; }
  header h1 { font-size: 15px; letter-spacing: 2px; text-transform: uppercase; color: var(--accent); margin-bottom: 8px; }
  header h1 span { color: var(--dim); font-weight: 400; }
  .searchrow { display: flex; gap: 8px; }
  .searchrow input { flex: 1; background: var(--panel2); border: 1px solid #2b2b38; color: var(--text); padding: 9px 12px; border-radius: var(--radius); font-size: 15px; outline: none; }
  .searchrow input:focus { border-color: var(--accent-dim); }

  .chips { display: flex; gap: 6px; overflow-x: auto; padding: 8px 0 2px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex-shrink: 0; background: var(--panel2); border: 1px solid #2b2b38; color: var(--dim); padding: 5px 12px; border-radius: 999px; font-size: 12.5px; cursor: pointer; user-select: none; }
  .chip.active { background: var(--accent); color: #111; border-color: var(--accent); font-weight: 600; }

  nav.tabs { display: flex; gap: 4px; margin-top: 8px; }
  nav.tabs button { flex: 1; background: none; border: none; color: var(--dim); padding: 8px; font-size: 13px; cursor: pointer; border-bottom: 2px solid transparent; }
  nav.tabs button.active { color: var(--text); border-bottom-color: var(--accent); }

  main { padding: 10px 14px; }
  .stats { font-size: 12px; color: var(--dim); padding: 4px 0 10px; }

  .track { background: var(--panel); border-radius: var(--radius); padding: 10px 12px; margin-bottom: 8px; }
  .track .row1 { display: flex; align-items: center; gap: 10px; }
  .track .meta { flex: 1; min-width: 0; cursor: pointer; }
  .track .title { font-size: 14.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .track .artist { font-size: 12.5px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .playbtn { width: 38px; height: 38px; flex-shrink: 0; border-radius: 50%; border: 1px solid #2b2b38; background: var(--panel2); color: var(--accent); font-size: 15px; cursor: pointer; }
  .playbtn:disabled { opacity: .25; }

  .stars { display: flex; gap: 2px; flex-shrink: 0; }
  .stars button { background: none; border: none; font-size: 19px; color: #3a3a48; cursor: pointer; padding: 2px; line-height: 1; }
  .stars button.lit { color: var(--accent); }

  .tagrow { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 7px; }
  .tagrow .tag { font-size: 10.5px; padding: 2px 8px; border-radius: 999px; background: var(--panel2); color: var(--dim); }
  .tagrow .tag.manual { background: #2a2a14; color: var(--accent); }
  .tagrow .addtag { font-size: 10.5px; padding: 2px 8px; border-radius: 999px; background: none; border: 1px dashed #3a3a48; color: var(--dim); cursor: pointer; }

  .loadmore { width: 100%; padding: 12px; background: var(--panel); border: 1px solid #2b2b38; color: var(--dim); border-radius: var(--radius); cursor: pointer; margin: 6px 0 20px; }
  .empty { text-align: center; color: var(--dim); padding: 40px 0; font-size: 14px; }

  /* Playlists */
  .pl { background: var(--panel); border-radius: var(--radius); padding: 12px; margin-bottom: 10px; }
  .pl .name { font-weight: 600; font-size: 15px; }
  .pl .sub { font-size: 12px; color: var(--dim); margin: 3px 0 8px; }
  .pl .actions { display: flex; gap: 8px; }
  .pl .actions button { background: var(--panel2); border: 1px solid #2b2b38; color: var(--text); padding: 6px 12px; border-radius: 8px; font-size: 12.5px; cursor: pointer; }
  .pl .actions button.primary { background: var(--accent); color: #111; border-color: var(--accent); font-weight: 600; }
  .pl .actions button.danger { color: var(--danger); }
  .newpl { width: 100%; padding: 12px; border: 1px dashed #3a3a48; background: none; color: var(--dim); border-radius: var(--radius); cursor: pointer; font-size: 14px; margin-bottom: 10px; }

  /* Player bar (desktop embed) */
  #playerbar { position: fixed; bottom: 0; left: 0; right: 0; background: var(--panel); border-top: 1px solid #23232e; padding: 8px 14px; display: none; z-index: 30; }
  #playerbar.visible { display: block; }
  #playerbar .nowplaying { font-size: 12px; color: var(--dim); margin-bottom: 6px; display: flex; justify-content: space-between; }
  #playerbar .nowplaying b { color: var(--text); }
  #playerbar .closebtn { background: none; border: none; color: var(--dim); cursor: pointer; font-size: 14px; }
  #ytplayer { width: 100%; height: 80px; border: none; border-radius: 8px; }

  /* Modal */
  .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.7); z-index: 40; display: flex; align-items: flex-end; justify-content: center; }
  @media (min-width: 700px) { .modal-bg { align-items: center; } }
  .modal { background: var(--panel); border-radius: 14px 14px 0 0; width: 100%; max-width: 560px; max-height: 85vh; overflow-y: auto; padding: 18px; }
  @media (min-width: 700px) { .modal { border-radius: 14px; } }
  .modal h2 { font-size: 16px; margin-bottom: 14px; }
  .modal label { display: block; font-size: 12px; color: var(--dim); margin: 12px 0 4px; }
  .modal input, .modal select { width: 100%; background: var(--panel2); border: 1px solid #2b2b38; color: var(--text); padding: 9px 12px; border-radius: 8px; font-size: 14px; outline: none; }
  .modal .btnrow { display: flex; gap: 8px; margin-top: 18px; }
  .modal .btnrow button { flex: 1; padding: 11px; border-radius: 8px; border: 1px solid #2b2b38; background: var(--panel2); color: var(--text); font-size: 14px; cursor: pointer; }
  .modal .btnrow button.primary { background: var(--accent); color: #111; border-color: var(--accent); font-weight: 600; }
  .hint { font-size: 11px; color: var(--dim); margin-top: 3px; }

  .toast { position: fixed; bottom: 110px; left: 50%; transform: translateX(-50%); background: var(--accent); color: #111; padding: 9px 18px; border-radius: 999px; font-size: 13px; font-weight: 600; z-index: 50; opacity: 0; transition: opacity .25s; pointer-events: none; }
  .toast.show { opacity: 1; }

  /* Badges + section labels */
  .badge { display: inline-block; min-width: 16px; padding: 0 5px; border-radius: 999px; background: var(--accent); color: #111; font-size: 10px; font-weight: 700; line-height: 16px; text-align: center; }
  .sectionlbl { font-size: 11px; letter-spacing: 1px; text-transform: uppercase; color: var(--dim); margin: 14px 0 8px; }

  /* Now-playing card */
  .npcard { background: linear-gradient(135deg, #1a1a24, #15151c); border: 1px solid #2b2b38; border-left: 3px solid var(--accent); border-radius: var(--radius); padding: 14px; margin-bottom: 12px; }
  .npcard .lbl { font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--accent); }
  .npcard .t { font-size: 16px; font-weight: 600; margin-top: 4px; }
  .npcard .a { font-size: 13px; color: var(--dim); }
  .npcard .unmatched { font-size: 11px; color: var(--dim); margin-top: 6px; font-style: italic; }

  /* ⋯ menu */
  .track .more { width: 30px; height: 30px; flex-shrink: 0; border-radius: 8px; border: 1px solid #2b2b38; background: var(--panel2); color: var(--dim); font-size: 16px; cursor: pointer; line-height: 1; }
  .track .flagrow { display: flex; gap: 6px; margin-top: 6px; }
  .track .flag { font-size: 10px; padding: 2px 7px; border-radius: 999px; background: #2a1414; color: var(--danger); }
  .menu { position: fixed; inset: 0; z-index: 45; background: rgba(0,0,0,.5); display: flex; align-items: flex-end; }
  .menu .sheet { background: var(--panel); width: 100%; border-radius: 14px 14px 0 0; padding: 8px; }
  .menu .sheet button { display: block; width: 100%; text-align: left; background: none; border: none; color: var(--text); padding: 13px 14px; font-size: 14px; cursor: pointer; border-radius: 8px; }
  .menu .sheet button:hover { background: var(--panel2); }
  .menu .sheet button.danger { color: var(--danger); }

  /* Evidence + health */
  .evidence { background: var(--panel2); border-radius: 8px; padding: 10px; margin-top: 8px; font-size: 12px; }
  .evidence .bar { height: 6px; background: #2b2b38; border-radius: 3px; overflow: hidden; margin: 3px 0 7px; }
  .evidence .bar > span { display: block; height: 100%; background: var(--accent); }
  .health { font-size: 11.5px; color: var(--dim); margin-top: 6px; line-height: 1.5; }
  .health.held { color: var(--amber, #ffc14d); }

  /* Filter bar: source-playlist select + AND/OR toggle */
  .filterbar { display: flex; gap: 8px; align-items: center; padding: 6px 0 2px; }
  .filterbar select { flex: 1; min-width: 0; background: var(--panel2); border: 1px solid #2b2b38; color: var(--text); padding: 6px 10px; border-radius: 999px; font-size: 12.5px; outline: none; }
  .modebtn { flex-shrink: 0; background: var(--panel2); border: 1px solid var(--accent-dim); color: var(--accent); padding: 5px 12px; border-radius: 999px; font-size: 12px; font-weight: 700; cursor: pointer; letter-spacing: 1px; }

  /* Source-playlist chips on a track card */
  .plrow { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
  .plrow .plchip { display: inline-flex; align-items: center; font-size: 10px; border-radius: 6px; background: #14202a; color: #6fb6d6; border: 1px solid #1d3340; overflow: hidden; }
  .plrow .plname { padding: 2px 4px 2px 8px; cursor: pointer; }
  .plrow .plx { background: none; border: none; color: #6fb6d6; padding: 2px 7px; cursor: pointer; font-size: 12px; line-height: 1; opacity: .65; }
  .plrow .plx:hover { opacity: 1; color: var(--danger); background: #2a1414; }
  #toast .undobtn { margin-left: 12px; background: #111; color: var(--accent); border: none; border-radius: 6px; padding: 3px 11px; font-weight: 700; cursor: pointer; pointer-events: auto; }
  .filterbar.inboxfilter { padding: 2px 0 10px; }

  /* Review sub-tabs */
  nav.subtabs { display: flex; gap: 4px; margin-bottom: 10px; border-bottom: 1px solid #23232e; }
  nav.subtabs button { background: none; border: none; color: var(--dim); padding: 8px 14px; font-size: 13px; cursor: pointer; border-bottom: 2px solid transparent; }
  nav.subtabs button.active { color: var(--text); border-bottom-color: var(--accent); }

  /* Auto-tag reject affordance: auto tags carry a faint × on the right */
  .tagrow .tag.auto { cursor: pointer; }
  .tagrow .tag.auto::after { content: " ×"; opacity: .4; }

  /* Tag entry modal datalist input reuses .modal styles */

  /* Tags admin screen */
  .vocab { background: var(--panel); border-radius: var(--radius); padding: 8px 12px; margin-bottom: 6px; display: flex; align-items: center; gap: 10px; }
  .vocab.hidden-tag { opacity: .5; }
  .vocab .vname { flex: 1; min-width: 0; font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .vocab .vname .vn { color: var(--dim); font-size: 11px; }
  .vocab .vname .alias { color: #6fb6d6; font-size: 11px; }
  .vocab .vbtn { flex-shrink: 0; background: var(--panel2); border: 1px solid #2b2b38; color: var(--text); padding: 5px 10px; border-radius: 8px; font-size: 12px; cursor: pointer; }
  .vocab .vbtn.on { background: var(--danger); color: #111; border-color: var(--danger); font-weight: 600; }
  .vocabsearch { width: 100%; background: var(--panel2); border: 1px solid #2b2b38; color: var(--text); padding: 9px 12px; border-radius: var(--radius); font-size: 14px; outline: none; margin-bottom: 10px; }
</style>
</head>
<body>

<header>
  <h1>Music Intelligence <span id="trackcount"></span></h1>
  <div class="searchrow">
    <input id="search" type="search" placeholder="Search title, artist, album…" autocomplete="off">
  </div>
  <div class="chips" id="ratingchips">
    <div class="chip" data-rating="">All</div>
    <div class="chip" data-rating="4">★★★★ Perfect</div>
    <div class="chip" data-rating="3">★★★ Love</div>
    <div class="chip" data-rating="2">★★ Really like</div>
    <div class="chip" data-rating="1">★ Like</div>
    <div class="chip" data-rating="0">Unrated</div>
  </div>
  <div class="chips" id="tagchips"></div>
  <div class="filterbar" id="filterbar" style="display:none">
    <select id="srcplaylist"><option value="">All playlists</option></select>
    <button id="tagmode" class="modebtn" style="display:none">AND</button>
  </div>
  <nav class="tabs">
    <button id="tab-home" class="active">Home</button>
    <button id="tab-library">Library</button>
    <button id="tab-inbox">Inbox <span id="inboxbadge" class="badge" style="display:none"></span></button>
    <button id="tab-playlists">Playlists</button>
    <button id="tab-review">Review <span id="reviewbadge" class="badge" style="display:none"></span></button>
    <button id="tab-tags">Tags</button>
  </nav>
</header>

<main>
  <div id="home">
    <div id="npcard"></div>
    <div class="sectionlbl" id="recentlbl" style="display:none">Recent listens</div>
    <div id="recent"></div>
  </div>
  <div class="stats" id="stats" style="display:none"></div>
  <div id="library" style="display:none"></div>
  <div id="inbox" style="display:none"></div>
  <div id="playlists" style="display:none"></div>
  <div id="review" style="display:none"></div>
  <div id="tags" style="display:none"></div>
</main>

<div id="playerbar">
  <div class="nowplaying">
    <span id="np"></span>
    <span>
      <a id="np-ytm" href="#" target="_blank" style="color:var(--accent);font-size:12px;text-decoration:none;margin-right:12px">Open in YTM ↗</a>
      <button class="closebtn" onclick="closePlayer()">✕</button>
    </span>
  </div>
  <iframe id="ytplayer" allow="autoplay; encrypted-media"></iframe>
</div>

<div class="toast" id="toast"></div>

<script>
const state = {
  q: "", rating: "", tags: [], tagMode: "and", sourcePlaylist: "", inboxPlaylist: "",
  offset: 0, limit: 100, total: 0,
  tracks: [], allTags: [], vocab: [], sourcePlaylists: [],
  reviewSub: "duplicates", reviewPairs: [], view: "library",
  isMobile: /Android|iPhone|iPad/i.test(navigator.userAgent),
};

const $ = (id) => document.getElementById(id);
const esc = (s) => (s || "").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// One shared timer so a quick toast (e.g. "Removing…") can't auto-hide a later
// toast/undo that replaced it. Both toast() and undoToast() clear it first.
let toastTimer;
function toast(msg) {
  const t = $("toast"); clearTimeout(toastTimer);
  t.style.pointerEvents = "";   // plain toasts stay click-through
  t.textContent = msg; t.classList.add("show");
  toastTimer = setTimeout(() => t.classList.remove("show"), 1600);
}

async function api(path, opts) {
  const r = await fetch(path, opts ? { headers: {"Content-Type":"application/json"}, ...opts } : undefined);
  if (!r.ok) { const e = await r.json().catch(() => ({})); throw new Error(e.detail || r.statusText); }
  return r.json();
}

// ── Library ──────────────────────────────

async function loadTracks(append = false) {
  if (!append) state.offset = 0;
  const p = new URLSearchParams({ limit: state.limit, offset: state.offset, sort: "added_desc" });
  if (state.q) p.set("q", state.q);
  if (state.rating !== "") p.set("rating", state.rating);
  if (state.tags.length) { p.set("tags", state.tags.join(",")); p.set("tag_mode", state.tagMode); }
  if (state.sourcePlaylist) p.set("source_playlist", state.sourcePlaylist);
  const data = await api(`/api/tracks?${p}`);
  state.total = data.total;
  state.tracks = append ? state.tracks.concat(data.tracks) : data.tracks;
  renderLibrary();
}

function starButtons(t) {
  const r = t.personal_rating || 0;
  let html = '<div class="stars">';
  for (let i = 1; i <= 4; i++) {
    html += `<button class="${i <= r ? "lit" : ""}" onclick="rate('${t.track_pk}', ${i})">★</button>`;
  }
  return html + "</div>";
}

function trackCard(t, opts = {}) {
  const flags = [];
  if (t.blocked_from_playlists) flags.push('<span class="flag">⛔ blocked</span>');
  if (t.do_not_recommend) flags.push('<span class="flag">🚫 no rec</span>');
  const tags = (t.tags || []).map(g => {
    const manual = g.tag_type === "private_manual";
    const click = manual
      ? `onclick="removeTag('${t.track_pk}','${esc(g.tag)}')" title="manual tag — tap to remove"`
      : `onclick="rejectTag('${t.track_pk}','${esc(g.tag)}')" title="auto tag — tap to reject for this track"`;
    return `<span class="tag ${manual ? "manual" : "auto"}" ${click}>${esc(g.tag)}</span>`;
  }).join("");
  const plchips = (t.playlists || []).map(p =>
    `<span class="plchip">
       <span class="plname" title="filter to this playlist" onclick="filterPlaylist('${esc(p.playlist_id)}')">${esc(p.playlist_name)}</span>
       <button class="plx" title="remove from this playlist on YTM" onclick="removeFromPlaylist('${t.track_pk}','${esc(p.playlist_id)}')">×</button>
     </span>`).join("");
  return `
    <div class="track" id="tr-${t.track_pk}">
      <div class="row1">
        <button class="playbtn" ${t.ytm_track_id ? "" : "disabled"} onclick="play('${t.ytm_track_id}', '${esc(t.canonical_artist)} — ${esc(t.canonical_title)}')">▶</button>
        <div class="meta">
          <div class="title">${esc(t.canonical_title)}</div>
          <div class="artist">${esc(t.canonical_artist)}${t.album_title ? " · " + esc(t.album_title) : ""}</div>
        </div>
        ${starButtons(t)}
        <button class="more" onclick="trackMenu('${t.track_pk}')" title="more">⋯</button>
      </div>
      ${flags.length ? `<div class="flagrow">${flags.join("")}</div>` : ""}
      <div class="tagrow">
        ${tags}
        <button class="addtag" onclick="addTag('${t.track_pk}')">+ tag</button>
        ${opts.dismiss ? `<button class="addtag" onclick="dismissTrack('${t.track_pk}')">✓ dismiss</button>` : ""}
      </div>
      ${plchips ? `<div class="plrow">${plchips}</div>` : ""}
    </div>`;
}

function renderLibrary() {
  $("trackcount").textContent = state.total ? `· ${state.total}` : "";
  const el = $("library");
  if (!state.tracks.length) { el.innerHTML = '<div class="empty">No tracks match.</div>'; return; }
  el.innerHTML = state.tracks.map(t => trackCard(t)).join("")
    + (state.tracks.length < state.total
        ? `<button class="loadmore" onclick="more()">Load more (${state.total - state.tracks.length} remaining)</button>` : "");
}

// ── ⋯ menu: block / don't-recommend / wrong-match ──
async function trackMenu(pk) {
  const t = (state.tracks.concat(state.inbox || [])).find(x => x.track_pk === pk) || {};
  const bg = document.createElement("div");
  bg.className = "menu";
  bg.onclick = (ev) => { if (ev.target === bg) bg.remove(); };
  bg.innerHTML = `<div class="sheet">
    <button onclick="setFlag('${pk}','blocked_from_playlists',${t.blocked_from_playlists ? 0 : 1});this.closest('.menu').remove()">
      ${t.blocked_from_playlists ? "Unblock" : "Block from playlists"}</button>
    <button onclick="setFlag('${pk}','do_not_recommend',${t.do_not_recommend ? 0 : 1});this.closest('.menu').remove()">
      ${t.do_not_recommend ? "Allow recommending" : "Don't recommend"}</button>
    <button onclick="removeFromAllPlaylists('${pk}');this.closest('.menu').remove()">Remove from all my YTM playlists</button>
    <button class="danger" onclick="wrongMatch('${pk}');this.closest('.menu').remove()">Wrong match (quarantine)</button>
    <button onclick="this.closest('.menu').remove()">Cancel</button>
  </div>`;
  document.body.appendChild(bg);
}

async function setFlag(pk, flag, value) {
  await api(`/api/tracks/${pk}/flags`, { method: "PUT", body: JSON.stringify({ [flag]: !!value }) });
  toast(flag === "blocked_from_playlists" ? (value ? "Blocked" : "Unblocked") : (value ? "Won't recommend" : "Recommending"));
  if (state.view === "library") loadTracks(); else if (state.view === "inbox") loadInbox();
}

async function wrongMatch(pk) {
  if (!confirm("Mark as wrong match? It will be quarantined and removed from playlists.")) return;
  await api(`/api/tracks/${pk}/wrong-match`, { method: "POST", body: "{}" });
  toast("Quarantined → Needs Review");
  if (state.view === "library") loadTracks(); else if (state.view === "inbox") loadInbox();
}

async function dismissTrack(pk) {
  await api(`/api/tracks/${pk}/dismiss`, { method: "POST", body: "{}" });
  toast("Dismissed from inbox");
  loadInbox();
}

function more() { state.offset += state.limit; loadTracks(true); }

async function rate(pk, rating) {
  // The track may live in any pool (library, inbox, recent listens, now-playing).
  const pools = [state.tracks || [], state.inbox || []];
  let t = null;
  for (const p of pools) { const f = p.find(x => x.track_pk === pk); if (f) { t = f; break; } }
  const cur = t ? (t.personal_rating || 0) : 0;
  const newRating = (cur === rating) ? null : rating;  // tap same star = clear
  await api(`/api/tracks/${pk}/rating`, { method: "PUT", body: JSON.stringify({ rating: newRating }) });
  if (t) t.personal_rating = newRating;
  toast(newRating ? ["", "Like", "Really like", "Love", "Perfect ✦"][newRating] : "Rating cleared");
  // Refresh the active view; reload the inbox badge (rating clears inbox membership).
  if (state.view === "library") renderLibrary();
  else if (state.view === "inbox") loadInbox();
  else if (state.view === "home") loadHome();
  if (state.view !== "inbox") loadInbox();
}

async function addTag(pk) {
  if (!state.allTags.length) { try { state.allTags = await api("/api/tags"); } catch (e) {} }
  const opts = state.allTags.map(t => `<option value="${esc(t.tag)}">`).join("");
  const bg = document.createElement("div");
  bg.className = "modal-bg";
  bg.onclick = (ev) => { if (ev.target === bg) bg.remove(); };
  bg.innerHTML = `<div class="modal">
    <h2>Add tag</h2>
    <input id="tag-input" list="tag-suggest" placeholder="start typing… e.g. dub-techno" autocomplete="off" autocapitalize="none">
    <datalist id="tag-suggest">${opts}</datalist>
    <div class="hint">Pick an existing tag (autocompletes) or type a new one.</div>
    <div class="btnrow">
      <button onclick="this.closest('.modal-bg').remove()">Cancel</button>
      <button class="primary" id="tag-save">Add</button>
    </div>
  </div>`;
  document.body.appendChild(bg);
  const input = bg.querySelector("#tag-input");
  input.focus();
  const submit = async () => {
    const tag = input.value.trim();
    if (!tag) return;
    await api(`/api/tracks/${pk}/tags`, { method: "POST", body: JSON.stringify({ tag }) });
    bg.remove();
    await loadTracks(); loadTagChips();
    toast(`Tagged: ${tag.toLowerCase()}`);
  };
  bg.querySelector("#tag-save").onclick = submit;
  input.addEventListener("keydown", (e) => { if (e.key === "Enter") submit(); });
}

async function removeTag(pk, tag) {
  if (!confirm(`Remove your manual tag "${tag}"?`)) return;
  await api(`/api/tracks/${pk}/tags/${encodeURIComponent(tag)}`, { method: "DELETE" });
  await loadTracks(); loadTagChips();
}

// Reject an auto-pulled tag for THIS track only. Survives re-enrichment.
async function rejectTag(pk, tag) {
  if (!confirm(`Reject "${tag}" on this track?\n\nIt won't show here or count toward playlists, and won't return on re-enrichment. To hide a tag across your whole library, use the Tags tab instead.`)) return;
  await api(`/api/tracks/${pk}/tags/${encodeURIComponent(tag)}/reject`, { method: "POST", body: "{}" });
  await loadTracks(); loadTagChips();
  toast(`Rejected: ${tag}`);
}

// Phone:   deep-link opens the YouTube Music app (audio engine).

function play(videoId, label) {

    $("ytplayer").src = `https://www.youtube.com/embed/${videoId}?autoplay=1`;
    $("playerbar").classList.add("visible");

}

function closePlayer() {
  $("ytplayer").src = "";
  $("playerbar").classList.remove("visible");
}

// ── Source-playlist editing: cull tracks from your own YTM playlists ──
function refreshActiveView() {
  if (state.view === "library") loadTracks();
  else if (state.view === "inbox") loadInbox();
  else if (state.view === "home") loadHome();
}

function undoToast(msg, onUndo) {
  const t = $("toast");
  clearTimeout(toastTimer);   // cancel any pending auto-hide from an earlier toast
  t.innerHTML = `${esc(msg)} <button class="undobtn" id="undobtn">Undo</button>`;
  t.style.pointerEvents = "auto";   // the toast normally ignores taps — let this one catch them
  t.classList.add("show");
  const hide = () => { t.classList.remove("show"); t.style.pointerEvents = ""; clearTimeout(toastTimer); };
  $("undobtn").onclick = async () => {
    hide();
    try { await onUndo(); } catch (e) { alert("Undo failed: " + e.message); }
  };
  toastTimer = setTimeout(hide, 6000);
}

// Tap a playlist chip's name → filter the current view to that playlist.
function filterPlaylist(playlistId) {
  if (state.view === "inbox") { state.inboxPlaylist = playlistId; loadInbox(); return; }
  state.sourcePlaylist = playlistId;
  if (state.view !== "library") switchView("library");   // switchView reloads + syncs dropdown
  else { loadSourcePlaylists(); loadTracks(); }
}

// Tap a chip's × → remove the track from that YTM playlist, with one-tap Undo.
async function removeFromPlaylist(pk, playlistId) {
  toast("Removing…");
  try {
    const r = await api(`/api/tracks/${pk}/playlists/${encodeURIComponent(playlistId)}/remove`,
                        { method: "POST", body: "{}" });
    refreshActiveView();
    undoToast(`Removed from ${r.playlist_name}`, async () => {
      await api(`/api/removals/${r.removal_id}/undo`, { method: "POST", body: "{}" });
      refreshActiveView(); toast("Re-added");
    });
  } catch (e) { alert("Remove failed: " + e.message); }
}

async function removeFromAllPlaylists(pk) {
  if (!confirm("Remove this track from ALL your YTM playlists?\n\nIt's also blocked from auto-generated playlists so your rules won't re-add it.")) return;
  toast("Removing from all…");
  try {
    const r = await api(`/api/tracks/${pk}/playlists/remove-all`, { method: "POST", body: "{}" });
    refreshActiveView();
    const n = (r.removed || []).length, f = (r.failed || []).length;
    toast(`Removed from ${n} playlist${n !== 1 ? "s" : ""}${f ? ` · ${f} read-only skipped` : ""}`);
  } catch (e) { alert("Failed: " + e.message); }
}

// ── Playlists ────────────────────────────

async function loadPlaylists() {
  const rules = await api("/api/playlists");
  $("playlists").innerHTML =
    `<button class="newpl" onclick="editRule(null)">+ New playlist rule</button>` +
    (rules.length ? rules.map(r => {
      const e = r.rule_json.eligibility || {};
      const desc = [
        e.tags_any?.length ? "any of: " + e.tags_any.join(", ") : "",
        e.tags_all?.length ? "all of: " + e.tags_all.join(", ") : "",
        e.tags_none?.length ? "none of: " + e.tags_none.join(", ") : "",
      ].filter(Boolean).join(" · ") || "all tracks";
      return `
      <div class="pl">
        <div class="name">${esc(r.playlist_name)} ${r.enabled ? "" : "· <span style='color:var(--dim)'>disabled</span>"}</div>
        <div class="sub">${r.ranking_mode} · ${desc}${r.max_tracks ? " · max " + r.max_tracks : ""}
          ${r.last_synced_at ? "<br>last synced " + r.last_synced_at.slice(0, 16).replace("T", " ") : "<br>never synced"}</div>
        <div class="health" id="health-${r.rule_id}">…</div>
        <div class="actions">
          <button onclick="previewRule('${r.rule_id}', '${esc(r.playlist_name)}')">Preview · Why?</button>
          <button class="primary" onclick="syncRule('${r.rule_id}')">Sync to YTM</button>
          <button onclick="showSnapshots('${r.rule_id}', '${esc(r.playlist_name)}')">Undo…</button>
          <button onclick='editRule(${JSON.stringify(r).replace(/'/g, "&#39;")})'>Edit</button>
          <button class="danger" onclick="deleteRule('${r.rule_id}')">Delete</button>
        </div>
      </div>`;
    }).join("") : '<div class="empty">No playlist rules yet.</div>');
  rules.forEach(r => loadHealth(r.rule_id));
}

async function loadHealth(ruleId) {
  const el = $(`health-${ruleId}`);
  if (!el) return;
  try {
    const h = await api(`/api/playlists/${ruleId}/health`);
    const bits = [`${h.compiled_count} tracks`];
    if (h.average_rating != null) bits.push(`avg ★${h.average_rating}`);
    if (h.unrated_count) bits.push(`${h.unrated_count} unrated`);
    if (h.weak_metadata_count) bits.push(`${h.weak_metadata_count} weak meta`);
    if (h.missing_from_ytm_count) bits.push(`${h.missing_from_ytm_count} missing`);
    if (h.pending_dedup_count) bits.push(`${h.pending_dedup_count} dup?`);
    if (h.held) { el.classList.add("held"); el.textContent = "⚠ HELD — " + h.sync_held_reason + " · " + bits.join(" · "); }
    else el.textContent = bits.join(" · ");
  } catch (e) { el.textContent = ""; }
}

async function showSnapshots(ruleId, name) {
  const snaps = await api(`/api/playlists/${ruleId}/snapshots`);
  const bg = document.createElement("div");
  bg.className = "modal-bg";
  bg.onclick = (ev) => { if (ev.target === bg) bg.remove(); };
  bg.innerHTML = `<div class="modal"><h2>${esc(name)} — snapshots</h2>
    ${snaps.length ? snaps.map(s => `<div class="pl">
        <div class="sub">${s.taken_at.slice(0,16).replace("T"," ")} · ${s.reason} · ${s.track_count} tracks</div>
        <div class="actions"><button class="primary" onclick="restoreSnap(${s.snapshot_id})">Restore this</button></div>
      </div>`).join("") : '<div class="empty">No snapshots yet.</div>'}
    <div class="btnrow"><button onclick="this.closest('.modal-bg').remove()">Close</button></div>
  </div>`;
  document.body.appendChild(bg);
}
async function restoreSnap(id) {
  if (!confirm("Restore this snapshot? Current state is snapshotted first so this is undoable.")) return;
  try { await api(`/api/snapshots/${id}/restore`, { method: "POST", body: "{}" }); toast("Restored ✓"); document.querySelector(".modal-bg")?.remove(); loadPlaylists(); }
  catch (e) { alert("Restore failed: " + e.message); }
}

function editRule(rule) {
  const e = rule?.rule_json?.eligibility || {};
  const bg = document.createElement("div");
  bg.className = "modal-bg";
  bg.onclick = (ev) => { if (ev.target === bg) bg.remove(); };
  bg.innerHTML = `
    <div class="modal">
      <h2>${rule ? "Edit" : "New"} playlist rule</h2>
      <label>Playlist name</label>
      <input id="m-name" value="${esc(rule?.playlist_name || "")}" placeholder="Late Night Drive">
      <label>Ranking mode</label>
      <select id="m-mode">
        ${["mood","dj_mix","discovery","utility"].map(m =>
          `<option ${rule?.ranking_mode === m ? "selected" : ""}>${m}</option>`).join("")}
      </select>
      <label>Must have ANY of these tags</label>
      <input id="m-any" value="${esc((e.tags_any || []).join(", "))}" placeholder="dub-techno, deep-techno">
      <div class="hint">comma-separated</div>
      <label>Must have ALL of these tags</label>
      <input id="m-all" value="${esc((e.tags_all || []).join(", "))}">
      <label>Must have NONE of these tags</label>
      <input id="m-none" value="${esc((e.tags_none || []).join(", "))}">
      <label>Minimum rating (optional)</label>
      <select id="m-minrating">
        <option value="">—</option>
        ${[1,2,3,4].map(n => `<option value="${n}" ${rule?.rule_json?.eligibility?.min_rating === n ? "selected" : ""}>${"★".repeat(n)}+</option>`).join("")}
      </select>
      <label>Max tracks (optional)</label>
      <input id="m-max" type="number" value="${rule?.max_tracks || ""}" placeholder="50">
      <div class="btnrow">
        <button onclick="this.closest('.modal-bg').remove()">Cancel</button>
        <button class="primary" id="m-save">Save</button>
      </div>
    </div>`;
  document.body.appendChild(bg);
  $("m-save").onclick = async () => {
    const split = (id) => $(id).value.split(",").map(s => s.trim().toLowerCase()).filter(Boolean);
    const eligibility = { tags_any: split("m-any"), tags_all: split("m-all"), tags_none: split("m-none") };
    const minR = $("m-minrating").value;
    if (minR) eligibility.min_rating = parseInt(minR);
    const body = {
      playlist_name: $("m-name").value.trim(),
      ranking_mode: $("m-mode").value,
      rule_json: { eligibility },
      max_tracks: $("m-max").value ? parseInt($("m-max").value) : null,
      enabled: true,
    };
    if (!body.playlist_name) return alert("Name required");
    await api(rule ? `/api/playlists/${rule.rule_id}` : "/api/playlists",
              { method: rule ? "PUT" : "POST", body: JSON.stringify(body) });
    bg.remove(); loadPlaylists(); toast("Saved");
  };
}

async function previewRule(ruleId, name) {
  const data = await api(`/api/playlists/${ruleId}/preview`);
  const bg = document.createElement("div");
  bg.className = "modal-bg";
  bg.onclick = (ev) => { if (ev.target === bg) bg.remove(); };
  bg.innerHTML = `<div class="modal"><h2>${esc(name)} — ${data.tracks.length} tracks</h2>
    ${data.tracks.length ? data.tracks.map((t, i) => `
      <div class="track">
        <div class="row1">
          <div class="meta" onclick="this.closest('.track').querySelector('.evidence').style.display = this.closest('.track').querySelector('.evidence').style.display==='none'?'block':'none'">
            <div class="title">${i + 1}. ${esc(t.canonical_title)}${t.personal_rating ? " " + "★".repeat(t.personal_rating) : ""}</div>
            <div class="artist">${esc(t.canonical_artist)} · score ${t.score} <span style="color:var(--accent)">— Why?</span></div>
          </div>
        </div>
        <div class="evidence" style="display:none">${evidenceHtml(t.evidence)}</div>
      </div>`).join("") : '<div class="empty">No tracks match.</div>'}
    <div class="btnrow"><button onclick="this.closest('.modal-bg').remove()">Close</button></div>
  </div>`;
  document.body.appendChild(bg);
}

function evidenceHtml(ev) {
  if (!ev) return "";
  const comps = ev.score_components || {};
  const max = Math.max(0.0001, ...Object.values(comps).map(Math.abs));
  const bars = Object.entries(comps).map(([k, v]) =>
    `<div>${esc(k)} <b>${(+v).toFixed(3)}</b></div><div class="bar"><span style="width:${Math.max(0, v / max * 100)}%"></span></div>`
  ).join("");
  const m = ev.matched || {};
  const matched = [
    m.tags_any && m.tags_any.length ? "tags: " + m.tags_any.join(", ") : "",
    m.tags_all && m.tags_all.length ? "all: " + m.tags_all.join(", ") : "",
    m.min_rating ? "min ★" + m.min_rating : "",
    "status: " + (m.status || "?"),
  ].filter(Boolean).join(" · ");
  return `<div><b>Score components</b></div>${bars}<div style="margin-top:6px">${esc(matched)}</div>`;
}

async function syncRule(ruleId) {
  toast("Syncing…");
  try { await api(`/api/playlists/${ruleId}/sync`, { method: "POST", body: "{}" }); toast("Synced to YTM ✓"); loadPlaylists(); }
  catch (err) { alert("Sync failed: " + err.message); }
}

async function deleteRule(ruleId) {
  if (!confirm("Delete this rule? (The YTM playlist itself is not deleted.)")) return;
  await api(`/api/playlists/${ruleId}`, { method: "DELETE" });
  loadPlaylists();
}

// ── Filters / tabs / boot ────────────────

async function loadTagChips() {
  const tags = await api("/api/tags");
  state.allTags = tags;
  // Selected tags float to the front so an active multi-selection stays visible.
  const sel = tags.filter(t => state.tags.includes(t.tag));
  const rest = tags.filter(t => !state.tags.includes(t.tag)).slice(0, 16);
  const show = sel.concat(rest);
  $("tagchips").innerHTML = show.map(t =>
    `<div class="chip ${state.tags.includes(t.tag) ? "active" : ""}" data-tag="${esc(t.tag)}">${esc(t.tag)} <span style="opacity:.55">${t.n}</span></div>`
  ).join("");
  document.querySelectorAll("#tagchips .chip").forEach(c => c.onclick = () => {
    const tg = c.dataset.tag;
    const i = state.tags.indexOf(tg);
    if (i >= 0) state.tags.splice(i, 1); else state.tags.push(tg);
    loadTagChips(); loadTracks();
  });
  const tm = $("tagmode");
  if (state.tags.length >= 2) { tm.style.display = ""; tm.textContent = state.tagMode.toUpperCase(); }
  else tm.style.display = "none";
}

async function loadSourcePlaylists() {
  let pls = [];
  try { pls = await api("/api/source-playlists"); } catch (e) {}
  state.sourcePlaylists = pls;
  const sel = $("srcplaylist");
  sel.innerHTML = `<option value="">All playlists</option>` + pls.map(p =>
    `<option value="${esc(p.playlist_id)}" ${state.sourcePlaylist === p.playlist_id ? "selected" : ""}>${esc(p.playlist_name)} (${p.n})</option>`
  ).join("");
}

async function loadStats() {
  try {
    const s = await api("/api/stats");
    const r = s.ratings;
    $("stats").textContent =
      `${s.total_tracks} tracks · ${s.tracks_with_tags} tagged · ratings: ${r.perfect}✦ ${r.love}♥ ${r.really_like + r.like} liked, ${r.unrated} unrated`;
  } catch (e) { /* fresh DB */ }
}

document.querySelectorAll("#ratingchips .chip").forEach(c => c.onclick = () => {
  document.querySelectorAll("#ratingchips .chip").forEach(x => x.classList.remove("active"));
  c.classList.add("active");
  state.rating = c.dataset.rating;
  loadTracks();
});

let searchTimer;
$("search").addEventListener("input", (e) => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => { state.q = e.target.value.trim(); loadTracks(); }, 300);
});

// ── Home: now-playing + recent listens (T7) ──
async function loadHome() {
  try {
    const np = await api("/api/now-playing");
    const el = $("npcard");
    if (np.playing) {
      const p = np.playing, t = p.track;
      el.innerHTML = `<div class="npcard">
        <div class="lbl">▶ Now playing</div>
        <div class="t">${esc(t ? t.canonical_title : p.track_name || "")}</div>
        <div class="a">${esc(t ? t.canonical_artist : p.artist_name || "")}</div>
        ${t ? `<div style="margin-top:10px">${starButtons(t)}</div>`
            : '<div class="unmatched">Not in your library yet — rate it from recent listens below once it lands.</div>'}
      </div>`;
      if (t) el.querySelector(".stars").dataset.pk = t.track_pk;
    } else {
      el.innerHTML = "";
    }
  } catch (e) { $("npcard").innerHTML = ""; }

  try {
    const data = await api("/api/recent-listens?limit=10");
    const list = data.listens || [];
    $("recentlbl").style.display = list.length ? "" : "none";
    $("recent").innerHTML = list.map(t => trackCard(t)).join("")
      || '<div class="empty">No recent listens yet.</div>';
  } catch (e) { $("recent").innerHTML = ""; }
}

let npTimer;
function startHomePolling() {
  stopHomePolling();
  npTimer = setInterval(() => { if (!document.hidden && state.view === "home") loadHome(); }, 15000);
}
function stopHomePolling() { if (npTimer) clearInterval(npTimer); npTimer = null; }
document.addEventListener("visibilitychange", () => {
  if (document.hidden) stopHomePolling();
  else if (state.view === "home") { loadHome(); startHomePolling(); }
});

// ── Inbox (T5) ──
async function loadInbox() {
  if (!state.sourcePlaylists.length) { try { state.sourcePlaylists = await api("/api/source-playlists"); } catch (e) {} }
  const p = new URLSearchParams({ limit: 200 });
  if (state.inboxPlaylist) p.set("source_playlist", state.inboxPlaylist);
  const data = await api(`/api/inbox?${p}`);
  state.inbox = data.tracks;
  const badge = $("inboxbadge");
  if (data.total) { badge.textContent = data.total; badge.style.display = ""; }
  else badge.style.display = "none";
  const filter = `<div class="filterbar inboxfilter"><select id="inboxplaylist">
      <option value="">All playlists</option>
      ${state.sourcePlaylists.map(pl =>
        `<option value="${esc(pl.playlist_id)}" ${state.inboxPlaylist === pl.playlist_id ? "selected" : ""}>${esc(pl.playlist_name)} (${pl.n})</option>`).join("")}
    </select></div>`;
  $("inbox").innerHTML = filter + (data.tracks.length
    ? data.tracks.map(t => trackCard(t, { dismiss: true })).join("")
    : '<div class="empty">Inbox zero ✓ — nothing to triage.</div>');
  $("inboxplaylist").onchange = (e) => { state.inboxPlaylist = e.target.value; loadInbox(); };
}

// ── Review: sub-tabs (Duplicates / Removed) ──
async function loadReview() {
  state.reviewPairs = await api("/api/dedup").catch(() => []);
  const badge = $("reviewbadge");
  if (state.reviewPairs.length) { badge.textContent = state.reviewPairs.length; badge.style.display = ""; }
  else badge.style.display = "none";
  const sub = state.reviewSub || "duplicates";
  $("review").innerHTML = `<nav class="subtabs">
      <button id="sub-dup" class="${sub === "duplicates" ? "active" : ""}">Duplicates${state.reviewPairs.length ? ` <span class="badge">${state.reviewPairs.length}</span>` : ""}</button>
      <button id="sub-rem" class="${sub === "removed" ? "active" : ""}">Removed</button>
    </nav><div id="subcontent"></div>`;
  $("sub-dup").onclick = () => { state.reviewSub = "duplicates"; loadReview(); };
  $("sub-rem").onclick = () => { state.reviewSub = "removed"; loadReview(); };
  if (sub === "duplicates") renderDuplicates();
  else loadRemoved();
}

function renderDuplicates() {
  const pairs = state.reviewPairs || [];
  $("subcontent").innerHTML = pairs.length ? pairs.map(p => {
    const side = (t) => t ? `<div style="flex:1;min-width:0">
        <div class="title">${esc(t.canonical_title)}</div>
        <div class="artist">${esc(t.canonical_artist)}${t.album_title ? " · " + esc(t.album_title) : ""}</div>
        <div class="health">${t.match_status} · ${t.duration_ms ? Math.round(t.duration_ms/1000)+"s" : "?"} · ${t.personal_rating ? "★".repeat(t.personal_rating) : "unrated"}</div>
      </div>` : "<div>(missing)</div>";
    return `<div class="pl">
      <div class="sub">Possible duplicate · ${esc(p.reason || "")}${p.duration_delta_ms != null ? " · Δ" + p.duration_delta_ms + "ms" : ""}</div>
      <div style="display:flex;gap:10px;margin-bottom:10px">${side(p.track_a)}${side(p.track_b)}</div>
      <div class="actions">
        <button class="primary" onclick="mergePair(${p.id})">Merge (keep older)</button>
        <button onclick="dismissPair(${p.id})">Not a duplicate</button>
      </div>
    </div>`;
  }).join("") : '<div class="empty">No pending duplicate pairs.</div>';
}

async function loadRemoved() {
  let removals = [];
  try { removals = await api("/api/removals?days=14"); } catch (e) {}
  $("subcontent").innerHTML = removals.length
    ? `<div class="stats">Removed from your YTM playlists in the last 14 days — tap Re-add to put one back.</div>`
      + removals.map(rm => `<div class="pl">
          <div class="name">${esc(rm.track_title || rm.track_pk)}</div>
          <div class="sub">${esc(rm.track_artist || "")} · removed from <b style="color:#6fb6d6">${esc(rm.playlist_name)}</b>${rm.kind === "all" ? " (remove-all)" : ""} · ${rm.removed_at.slice(0,16).replace("T"," ")}</div>
          <div class="actions"><button class="primary" onclick="undoRemoval(${rm.id})">Re-add</button></div>
        </div>`).join("")
    : '<div class="empty">Nothing removed in the last 14 days.</div>';
}

async function undoRemoval(id) {
  toast("Re-adding…");
  try { await api(`/api/removals/${id}/undo`, { method: "POST", body: "{}" }); toast("Re-added ✓"); loadRemoved(); }
  catch (e) { alert("Re-add failed: " + e.message); }
}

async function mergePair(id) {
  if (!confirm("Merge these two tracks? The newer one is folded into the older.")) return;
  await api(`/api/dedup/${id}/merge`, { method: "POST", body: "{}" });
  toast("Merged"); loadReview();
}
async function dismissPair(id) {
  await api(`/api/dedup/${id}/dismiss`, { method: "POST", body: "{}" });
  loadReview();
}

// ── Tags admin: global hide-list + alias ──
function vocabRowsHtml(rows) {
  return rows.length ? rows.map(v => `
    <div class="vocab ${v.hidden ? "hidden-tag" : ""}">
      <div class="vname">${esc(v.tag)} <span class="vn">${v.n}</span>${v.alias_to ? ` <span class="alias">→ ${esc(v.alias_to)}</span>` : ""}</div>
      <button class="vbtn ${v.hidden ? "on" : ""}" onclick="toggleHide('${esc(v.tag)}', ${v.hidden ? 0 : 1})">${v.hidden ? "Hidden" : "Hide"}</button>
      <button class="vbtn" onclick="aliasTag('${esc(v.tag)}')">${v.alias_to ? "Re-alias" : "Alias"}</button>
    </div>`).join("") : '<div class="empty">No tags match.</div>';
}

async function loadTags() {
  state.vocab = await api("/api/vocabulary");
  $("tags").innerHTML =
    `<div class="stats">${state.vocab.length} distinct tags · "Hide" removes a tag everywhere; "Alias" merges a spelling variant into another tag.</div>
     <input class="vocabsearch" id="vocabsearch" placeholder="Filter tags…" autocomplete="off" autocapitalize="none">
     <div id="vocablist">${vocabRowsHtml(state.vocab.slice(0, 250))}</div>`;
  $("vocabsearch").oninput = (e) => {
    const f = e.target.value.trim().toLowerCase();
    const rows = (f ? state.vocab.filter(v => v.tag.includes(f)) : state.vocab).slice(0, 250);
    $("vocablist").innerHTML = vocabRowsHtml(rows);
  };
}

async function toggleHide(tag, hidden) {
  await api(`/api/vocabulary/${encodeURIComponent(tag)}`, { method: "PUT", body: JSON.stringify({ hidden: !!hidden }) });
  toast(hidden ? `Hidden: ${tag}` : `Shown: ${tag}`);
  await loadTags(); loadTagChips();
}

async function aliasTag(tag) {
  const target = prompt(`Merge "${tag}" into which tag?\nType an existing tag name, or leave blank to clear.`, "");
  if (target === null) return;
  await api(`/api/vocabulary/${encodeURIComponent(tag)}`, { method: "PUT", body: JSON.stringify({ alias_to: target.trim() || null }) });
  toast(target.trim() ? `${tag} → ${target.trim().toLowerCase()}` : "Alias cleared");
  await loadTags(); loadTagChips();
}

// ── Tabs ──
$("tab-home").onclick = () => switchView("home");
$("tab-library").onclick = () => switchView("library");
$("tab-inbox").onclick = () => switchView("inbox");
$("tab-playlists").onclick = () => switchView("playlists");
$("tab-review").onclick = () => switchView("review");
$("tab-tags").onclick = () => switchView("tags");

// AND/OR toggle + source-playlist filter (bound once)
$("tagmode").onclick = () => { state.tagMode = state.tagMode === "and" ? "or" : "and"; loadTagChips(); loadTracks(); };
$("srcplaylist").onchange = (e) => { state.sourcePlaylist = e.target.value; loadTracks(); };

const VIEWS = ["home", "library", "inbox", "playlists", "review", "tags"];
function switchView(v) {
  state.view = v;
  VIEWS.forEach(name => {
    $(name).style.display = name === v ? "" : "none";
    const tab = $("tab-" + name);
    if (tab) tab.classList.toggle("active", name === v);
  });
  $("stats").style.display = v === "library" ? "" : "none";
  $("filterbar").style.display = v === "library" ? "" : "none";
  if (v === "home") { loadHome(); startHomePolling(); } else { stopHomePolling(); }
  if (v === "library") { loadTracks(); loadSourcePlaylists(); }
  if (v === "inbox") loadInbox();
  if (v === "playlists") loadPlaylists();
  if (v === "review") loadReview();
  if (v === "tags") loadTags();
}

document.querySelector('#ratingchips .chip[data-rating=""]').classList.add("active");
loadStats(); loadTracks(); loadTagChips(); loadHome(); startHomePolling();
loadInbox(); loadReview();   // populate tab badges on boot
</script>
</body>
</html>
