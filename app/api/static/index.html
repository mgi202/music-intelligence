<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0d0d11">
<title>Music Intelligence</title>
<!-- Outline icon set (silhouette style per the locked Home design). Degrades
     gracefully offline: icons vanish, labels remain. -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.31.0/dist/tabler-icons.min.css">
<style>
  :root {
    --bg: #0d0d11; --panel: #16161d; --panel2: #1e1e28;
    --text: #e8e8ee; --dim: #8a8a99; --accent: #c8ff00;
    --accent-dim: #87ab00; --danger: #ff5470; --radius: 10px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, "Segoe UI", Roboto, sans-serif; padding-bottom: 40px; }

  header { position: sticky; top: 0; z-index: 20; background: rgba(13,13,17,.96); backdrop-filter: blur(8px); padding: 12px 14px 8px; border-bottom: 1px solid #23232e; }
  header h1 { font-size: 15px; letter-spacing: 2px; text-transform: uppercase; color: var(--accent); margin-bottom: 8px; }
  header h1 span { color: var(--dim); font-weight: 400; }
  .searchrow { display: flex; gap: 8px; justify-content: flex-end; }
  .searchrow input { flex: 1; background: var(--panel2); border: 1px solid #2b2b38; color: var(--text); padding: 9px 12px; border-radius: var(--radius); font-size: 15px; outline: none; }
  .searchrow input:focus { border-color: var(--accent-dim); }
  .searchrow .refreshbtn { flex-shrink: 0; width: 42px; background: var(--panel2); border: 1px solid #2b2b38; color: var(--accent); border-radius: var(--radius); font-size: 18px; cursor: pointer; }
  .searchrow .refreshbtn:active { background: var(--panel); }

  .chips { display: flex; gap: 6px; overflow-x: auto; padding: 8px 0 2px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex-shrink: 0; background: var(--panel2); border: 1px solid #2b2b38; color: var(--dim); padding: 5px 12px; border-radius: 999px; font-size: 12.5px; cursor: pointer; user-select: none; }
  .chip.active { background: var(--accent); color: #111; border-color: var(--accent); font-weight: 600; }

  /* Library facet row — one row of dropdown filters (2026-07-03 redesign) */
  .facetrow { display: flex; gap: 6px; padding: 8px 0 2px; flex-wrap: wrap; align-items: center; }
  .facetwrap { position: relative; }
  .fbtn { background: var(--panel2); border: 1px solid #2b2b38; color: var(--text); border-radius: 8px; padding: 5px 10px; font-size: 12px; cursor: pointer; display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; max-width: 180px; overflow: hidden; text-overflow: ellipsis; }
  .fbtn.on { border-color: var(--accent-dim); color: var(--accent); }
  .fbtn .fcnt { background: var(--accent); color: #111; border-radius: 8px; font-size: 10px; padding: 0 5px; font-weight: 700; line-height: 15px; }
  .fdd { position: absolute; top: calc(100% + 4px); left: 0; z-index: 35; background: var(--panel); border: 1px solid #2b2b38; border-radius: 10px; width: 240px; max-width: calc(100vw - 28px); max-height: 320px; overflow-y: auto; padding: 6px; box-shadow: 0 8px 24px rgba(0,0,0,.5); }
  .facetwrap:nth-last-child(-n+2) .fdd { left: auto; right: 0; }
  .fdd input { width: 100%; background: var(--panel2); border: 1px solid #2b2b38; color: var(--text); padding: 5px 8px; border-radius: 6px; font-size: 12px; outline: none; margin-bottom: 6px; }
  .fddrow { display: flex; align-items: center; gap: 8px; padding: 6px; border-radius: 6px; font-size: 12.5px; cursor: pointer; user-select: none; }
  .fddrow:hover { background: var(--panel2); }
  .fddrow .bx { width: 14px; height: 14px; flex-shrink: 0; border: 1px solid #3a3a48; border-radius: 4px; font-size: 10px; line-height: 13px; text-align: center; color: #111; }
  .fddrow.sel .bx { background: var(--accent); border-color: var(--accent); }
  .fddrow .n { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .fddrow .c { color: var(--dim); font-size: 11px; }
  .fddempty { color: var(--dim); font-size: 12px; padding: 8px; text-align: center; }

  /* Live summary bar — replaces the boot-only stats line */
  .sumbar { display: flex; justify-content: space-between; align-items: center; gap: 8px; background: var(--panel); border: 1px solid #23232e; border-radius: 8px; padding: 6px 10px; margin-top: 8px; font-size: 12px; color: var(--dim); flex-wrap: wrap; }
  .sumbar .pills { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; flex: 1; min-width: 0; }
  .sumbar b { color: var(--text); font-weight: 600; }
  .spill { display: inline-flex; align-items: center; gap: 4px; background: #26261a; color: var(--accent); border: 1px solid #4a4a1e; border-radius: 999px; padding: 1px 8px; font-size: 11px; cursor: pointer; }
  .spill:hover { border-color: var(--accent); }
  .clearall { background: none; border: none; color: var(--accent); font-size: 12px; cursor: pointer; flex-shrink: 0; }
  .modebtn2 { background: var(--panel2); border: 1px solid var(--accent-dim); color: var(--accent); border-radius: 999px; padding: 1px 9px; font-size: 10.5px; font-weight: 700; cursor: pointer; letter-spacing: 1px; }

  nav.tabs { display: flex; gap: 14px; margin-top: 8px; align-items: center; }
  nav.tabs button { flex: 0 0 auto; background: none; border: none; color: var(--dim); padding: 8px 2px; font-size: 13px; cursor: pointer; border-bottom: 2px solid transparent; }
  nav.tabs button.active { color: var(--text); border-bottom-color: var(--accent); }
  #homesearch { margin-left: auto; background: var(--panel2); border: 1px solid #2b2b38; color: var(--text); padding: 7px 12px; border-radius: 8px; font-size: 12px; outline: none; width: 280px; flex: 0 0 auto; }
  #homesearch:focus { border-color: var(--accent-dim); }

  main { padding: 10px 14px; }
  .stats { font-size: 12px; color: var(--dim); padding: 4px 0 10px; }

  /* Track cards — single-row on desktop (title | chips | controls), the chip
     zone wraps to its own full-width row ≤760px. 2026-07-03 compact redesign. */
  .track { background: var(--panel); border-radius: var(--radius); padding: 8px 12px; margin-bottom: 8px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .track .meta { flex: 0 0 30%; min-width: 0; cursor: pointer; }
  .track .tmid { flex: 1; min-width: 0; display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
  .track .tctl { display: flex; align-items: center; gap: 2px; margin-left: auto; flex-shrink: 0; }
  .track .qadd { background: none; border: none; color: var(--dim); cursor: pointer; font-size: 18px; line-height: 1; padding: 2px 5px; }
  .track .qadd:hover { color: var(--accent); }
  @media (max-width: 760px) {
    .track .meta { flex: 1 1 auto; }
    .track .tmid { flex-basis: 100%; order: 5; }
  }
  .track .title { font-size: 14.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .track .artist { font-size: 12.5px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .playbtn { width: 38px; height: 38px; flex-shrink: 0; border-radius: 50%; border: 1px solid #2b2b38; background: var(--panel2); color: var(--accent); font-size: 15px; cursor: pointer; }
  .playbtn:disabled { opacity: .25; }

  .stars { display: flex; gap: 2px; flex-shrink: 0; }
  .stars button { background: none; border: none; font-size: 19px; color: #3a3a48; cursor: pointer; padding: 2px; line-height: 1; }
  .stars button.lit { color: var(--accent); }

  .tagrow { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 7px; }
  .tagrow .tag, .tmid .tag, #pb-tags .tag { font-size: 10.5px; padding: 2px 8px; border-radius: 999px; background: var(--panel2); color: var(--dim); }
  .tagrow .tag.manual, .tmid .tag.manual, #pb-tags .tag.manual { background: #2a2a14; color: var(--accent); }
  .tagrow .addtag, .tmid .addtag, #pb-tags .addtag { font-size: 10.5px; padding: 2px 8px; border-radius: 999px; background: none; border: 1px dashed #3a3a48; color: var(--dim); cursor: pointer; }

  .loadmore { width: 100%; padding: 12px; background: var(--panel); border: 1px solid #2b2b38; color: var(--dim); border-radius: var(--radius); cursor: pointer; margin: 6px 0 20px; }
  .empty { text-align: center; color: var(--dim); padding: 40px 0; font-size: 14px; }

  /* Playlists */
  .pl { background: var(--panel); border-radius: var(--radius); padding: 12px; margin-bottom: 10px; }
  .pl .name { font-weight: 600; font-size: 15px; }
  .pl .sub { font-size: 12px; color: var(--dim); margin: 3px 0 8px; }
  .pl .actions { display: flex; gap: 8px; }
  .pl .actions button { background: var(--panel2); border: 1px solid #2b2b38; color: var(--text); padding: 6px 12px; border-radius: 8px; font-size: 12.5px; cursor: pointer; }
  .pl .actions button.primary { background: var(--accent); color: #111; border-color: var(--accent); font-weight: 600; }
  .pl .actions button.danger { color: var(--danger); }
  .newpl { width: 100%; padding: 12px; border: 1px dashed #3a3a48; background: none; color: var(--dim); border-radius: var(--radius); cursor: pointer; font-size: 14px; margin-bottom: 10px; }

  /* App title strip — always the very first thing on the page. */
  #apptitle { padding: 12px 14px 0; display: flex; align-items: center; justify-content: space-between; }
  #apptitle h1 { font-size: 15px; letter-spacing: 2px; text-transform: uppercase; color: var(--accent); }
  #apptitle h1 span { color: var(--dim); font-weight: 400; }
  #apptitle .refreshbtn { width: 28px; height: 28px; font-size: 14px; line-height: 1; }

  /* Player hero — Home only. On every other tab the player is fully hidden
     but the YT iframe keeps playing (display toggling never reparents it,
     which would reload the video and stop audio). */
  #playerbar { display: none; background: var(--panel); border-bottom: 1px solid #23232e; padding: 12px 14px; }
  #playerbar.visible.hero-mode { display: block; }
  .pb-grid { display: flex; gap: 14px; align-items: center; }
  #pb-art { width: 88px; height: 88px; border-radius: 6px; object-fit: cover; background: #000; flex-shrink: 0; }
  .pb-lbl { font-size: 9px; letter-spacing: 1px; text-transform: uppercase; color: var(--dim); margin-bottom: 3px; }
  #playerbar .nowplaying { font-size: 12px; color: var(--dim); display: flex; justify-content: space-between; gap: 8px; }
  #playerbar .nowplaying b { color: var(--text); font-size: 13px; }
  #playerbar .closebtn { background: none; border: none; color: var(--dim); cursor: pointer; font-size: 14px; }
  #ytplayer-wrap { position: relative; width: 280px; height: 158px; flex-shrink: 0; border-radius: 6px; overflow: hidden; background: #000; }
  #ytplayer, #ytplayer-wrap iframe { width: 100%; height: 100%; border: 0; }
  #pb-expand { position: absolute; top: 4px; right: 4px; z-index: 2; background: rgba(0,0,0,.55); border: none; color: #fff; border-radius: 6px; cursor: pointer; font-size: 13px; padding: 2px 7px; }
  .pb-main { flex: 1; min-width: 0; }
  .pb-controls { display: flex; align-items: center; gap: 10px; margin-top: 6px; }
  .pb-controls button { background: none; border: none; color: var(--accent); font-size: 16px; cursor: pointer; padding: 2px 4px; line-height: 1; }
  .pb-controls button:hover { color: var(--text); }
  .pb-bottom { display: flex; margin-top: 8px; gap: 8px; flex-wrap: wrap; align-items: center; }
  .vidpref { background: none; border: 1px solid #2b2b38; color: var(--dim); border-radius: 10px; padding: 2px 9px; font-size: 11px; cursor: pointer; }
  .vidpref.on { color: var(--accent); border-color: var(--accent-dim); }
  #pb-stars .stars button { font-size: 15px; padding: 0 1px; }
  .pb-time { font-size: 11px; color: var(--dim); font-variant-numeric: tabular-nums; min-width: 34px; text-align: center; }
  .pb-track { flex: 1; height: 6px; background: var(--panel2); border-radius: 999px; cursor: pointer; overflow: hidden; }
  .pb-fill { height: 100%; width: 0; background: var(--accent); border-radius: 999px; }
  .track.playing { box-shadow: inset 3px 0 0 var(--accent); }

  /* Home hub: three panes. Both rails fixed at 180px — the track table is
     always the widest panel (locked v9 decision). */
  #home { display: grid; grid-template-columns: 180px minmax(0,1fr) 180px; gap: 12px; align-items: start; }
  #remotestrip { grid-column: 1 / -1; display: none; align-items: center; gap: 10px; background: var(--panel); border: 1px solid #23232e; border-radius: var(--radius); padding: 8px 12px; font-size: 12.5px; }
  #remotestrip.on { display: flex; }
  #remotestrip .stars button { font-size: 15px; padding: 0 1px; }
  .pane-mid { background: var(--panel); border: 1px solid #23232e; border-radius: var(--radius); padding: 8px; min-width: 0; }
  .treeitem { display: flex; align-items: center; gap: 6px; padding: 6px 8px; border-radius: 8px; font-size: 13px; cursor: pointer; }
  .treeitem:hover { background: var(--panel2); }
  .treeitem.active { background: #26261a; color: var(--accent); }
  .treeitem .tname { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .treeitem .cnt { color: var(--dim); font-size: 11px; }
  .treeitem .pinbtn { background: none; border: none; cursor: pointer; color: #3a3a48; font-size: 12px; padding: 0 2px; }
  .treeitem .pinbtn.pinned { color: var(--accent); }
  .treeitem.ghost { color: var(--dim); cursor: default; }
  .treemore { background: none; border: none; color: var(--dim); font-size: 12px; cursor: pointer; padding: 6px 8px; display: block; }
  .midhead { display: flex; justify-content: space-between; align-items: baseline; padding: 2px 6px 8px; gap: 8px; }
  .midhead .t { font-size: 14px; font-weight: 600; }
  .midhead .sub { color: var(--dim); font-size: 12px; font-weight: 400; }
  .playallbtn { background: none; border: 1px solid #2b2b38; color: var(--accent); border-radius: 8px; padding: 4px 10px; font-size: 12px; cursor: pointer; flex-shrink: 0; }
  #mid-rows { max-height: 62vh; overflow-y: auto; }
  .midrow { display: flex; align-items: center; gap: 8px; padding: 6px; border-bottom: 1px solid #1f1f28; font-size: 13px; }
  .midrow:last-child { border-bottom: none; }
  .midrow .m { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .midrow .a { color: var(--dim); }
  .midrow .dj { flex: 0 0 auto; color: var(--dim); font-size: 11px; font-variant-numeric: tabular-nums; white-space: nowrap; margin: 0 6px; }
  .midrow .dj.dim { opacity: .35; }
  @media (max-width: 760px) { .midrow .dj.dim { display: none; } }
  .midrow.playing { box-shadow: inset 3px 0 0 var(--accent); }
  .midrow .stars button { font-size: 14px; padding: 1px; }
  .midrow .mic { background: none; border: none; color: var(--dim); cursor: pointer; font-size: 15px; line-height: 1; padding: 2px; }
  .midrow .mic:hover { color: var(--accent); }
  .midrow .playbtn { background: none; border: none; color: var(--accent); cursor: pointer; font-size: 13px; line-height: 1; padding: 2px; }
  .midrow .playbtn:disabled { color: #3a3a48; cursor: default; }
  .treeitem .ti { font-size: 12px; }
  .qhead { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; }
  .qhead .lbl { font-size: 11px; letter-spacing: 1px; text-transform: uppercase; color: var(--dim); }
  .qhead button { background: none; border: none; color: var(--dim); font-size: 11px; cursor: pointer; }
  .qhead button:hover { color: var(--accent); }
  .qrow { background: var(--panel); border: 1px solid #23232e; border-radius: 8px; padding: 6px 8px; margin-bottom: 4px; font-size: 12px; cursor: pointer; display: flex; gap: 6px; align-items: center; }
  .qrow.current { border-color: var(--accent); }
  .qrow .qm { flex: 1; min-width: 0; }
  .qrow .qt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .qrow .qa { color: var(--dim); font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .qrow .qx { background: none; border: none; color: var(--dim); cursor: pointer; font-size: 13px; }
  .qdrop { border: 1px dashed #3a3a48; border-radius: 8px; padding: 12px 8px; text-align: center; font-size: 11px; color: var(--dim); }
  @media (max-width: 760px) {
    #home { grid-template-columns: 1fr; }
    #mid-rows { max-height: none; }
    #homesearch { width: 120px; }
    #playerbar.hero-mode #ytplayer-wrap { display: none; }
  }

  /* Modal */
  .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.7); z-index: 40; display: flex; align-items: flex-end; justify-content: center; }
  @media (min-width: 700px) { .modal-bg { align-items: center; } }
  .modal { background: var(--panel); border-radius: 14px 14px 0 0; width: 100%; max-width: 560px; max-height: 85vh; overflow-y: auto; padding: 18px; }
  @media (min-width: 700px) { .modal { border-radius: 14px; } }
  .modal h2 { font-size: 16px; margin-bottom: 14px; }
  .modal label { display: block; font-size: 12px; color: var(--dim); margin: 12px 0 4px; }
  .modal input, .modal select { width: 100%; background: var(--panel2); border: 1px solid #2b2b38; color: var(--text); padding: 9px 12px; border-radius: 8px; font-size: 14px; outline: none; }
  .modal .btnrow { display: flex; gap: 8px; margin-top: 18px; }
  .modal .btnrow button { flex: 1; padding: 11px; border-radius: 8px; border: 1px solid #2b2b38; background: var(--panel2); color: var(--text); font-size: 14px; cursor: pointer; }
  .modal .btnrow button.primary { background: var(--accent); color: #111; border-color: var(--accent); font-weight: 600; }
  .hint { font-size: 11px; color: var(--dim); margin-top: 3px; }

  .toast { position: fixed; bottom: 110px; left: 50%; transform: translateX(-50%); background: var(--accent); color: #111; padding: 9px 18px; border-radius: 999px; font-size: 13px; font-weight: 600; z-index: 50; opacity: 0; transition: opacity .25s; pointer-events: none; }
  .toast.show { opacity: 1; }

  /* Badges + section labels */
  .badge { display: inline-block; min-width: 16px; padding: 0 5px; border-radius: 999px; background: var(--accent); color: #111; font-size: 10px; font-weight: 700; line-height: 16px; text-align: center; }
  .sectionlbl { font-size: 11px; letter-spacing: 1px; text-transform: uppercase; color: var(--dim); margin: 14px 0 8px; }

  /* Now-playing card */
  /* (npcard styles removed 2026-07-03 — Home hub replaced the old card) */

  /* ⋯ menu */
  .track .more { width: 30px; height: 30px; flex-shrink: 0; border-radius: 8px; border: 1px solid #2b2b38; background: var(--panel2); color: var(--dim); font-size: 16px; cursor: pointer; line-height: 1; }
  .track .flagrow { display: flex; gap: 6px; margin-top: 6px; }
  .track .flag { font-size: 10px; padding: 2px 7px; border-radius: 999px; background: #2a1414; color: var(--danger); }
  .menu { position: fixed; inset: 0; z-index: 45; background: rgba(0,0,0,.5); display: flex; align-items: flex-end; }
  .menu .sheet { background: var(--panel); width: 100%; border-radius: 14px 14px 0 0; padding: 8px; }
  .menu .sheet button { display: block; width: 100%; text-align: left; background: none; border: none; color: var(--text); padding: 13px 14px; font-size: 14px; cursor: pointer; border-radius: 8px; }
  .menu .sheet button:hover { background: var(--panel2); }
  .menu .sheet button.danger { color: var(--danger); }
  .menu .sheet .menuhint { padding: 8px 14px 4px; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--dim); }
  .menu .sheet .menusep { height: 1px; background: #2b2b38; margin: 6px 8px; }
  /* Version-discovery dialog */
  .verdlg { max-height: 82vh; overflow-y: auto; }
  .verbtn { width: 100%; text-align: center !important; background: var(--panel2) !important; border: 1px solid var(--accent-dim) !important; color: var(--accent) !important; font-weight: 600; border-radius: 8px; margin: 4px 0; }
  .verresults { padding: 2px 6px; }
  .verhint { color: var(--dim); font-size: 12.5px; padding: 10px 8px; }
  .vrow { display: flex; gap: 8px; align-items: flex-start; padding: 8px 6px; border-bottom: 1px solid #23232e; }
  .vrow.isveto { opacity: .62; }
  .vrow .vmain { flex: 1; min-width: 0; }
  .vrow .vtitle { font-size: 13px; color: var(--text); }
  .vrow .vsub { font-size: 11.5px; color: var(--dim); margin-top: 2px; }
  .vrow .vev { font-size: 10.5px; color: #6f7080; margin-top: 3px; }
  .vrow .vact { display: flex; gap: 4px; flex-shrink: 0; }
  .vrow .vact button { background: var(--panel2); border: 1px solid #2b2b38; color: var(--text); border-radius: 7px; padding: 5px 9px; font-size: 12px; cursor: pointer; }
  .vrow .vact button.danger { color: var(--danger); }
  .vbad { display: inline-block; font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 999px; margin-left: 4px; vertical-align: middle; }
  .vbad.hi { background: #16351f; color: #57d97e; }
  .vbad.mid { background: #33300f; color: #d8c24a; }
  .vbad.lo { background: #2b2b38; color: var(--dim); }
  .vbad.veto { background: #3a1620; color: #e77; }
  .verpaste { display: flex; gap: 6px; padding: 4px 6px; }
  .verpaste input { flex: 1; min-width: 0; background: var(--panel2); border: 1px solid #2b2b38; color: var(--text); padding: 8px 10px; border-radius: 8px; font-size: 13px; outline: none; }
  .verpaste button { background: var(--accent); color: #111; border: none; border-radius: 8px; padding: 8px 14px; font-weight: 600; cursor: pointer; }
  .pendbadge { display: inline-block; font-size: 10px; font-weight: 700; color: var(--accent); background: rgba(120,200,255,.10); border: 1px solid var(--accent-dim); border-radius: 999px; padding: 0 6px; margin-left: 6px; cursor: pointer; }
  /* Training (reference-readiness) view */
  .trainhead { font-size: 13px; color: var(--dim); margin: 4px 2px 12px; }
  .trainhead b { color: var(--text); }
  .pcard { background: var(--panel); border: 1px solid #23232e; border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; }
  .pcard .ptop { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .pcard .pname { font-size: 14px; font-weight: 600; color: var(--text); }
  .pcard .pill { font-size: 11px; padding: 2px 9px; border-radius: 999px; white-space: nowrap; }
  .pill.ready { background: #16351f; color: #6ee7a0; border: 1px solid #1f5130; }
  .pill.wip { background: var(--panel2); color: var(--dim); border: 1px solid #2b2b38; }
  .pbar { margin-top: 9px; }
  .pbar .plabel { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--dim); margin-bottom: 3px; }
  .pbar .ptrack { height: 7px; background: var(--panel2); border-radius: 999px; overflow: hidden; }
  .pbar .pfill { height: 100%; background: var(--accent); border-radius: 999px; transition: width .3s; }
  .pbar .pfill.done { background: #3fae6a; }
  /* Tag tap-palette in the add-tag modal */
  .playlbl { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--dim); margin: 10px 2px 4px; }
  .palette-row { display: flex; flex-wrap: wrap; gap: 6px; }
  .palette-row .chip { flex-shrink: 1; }
  .palette-row .chip[disabled] { opacity: .5; }

  /* Evidence + health */
  .evidence { background: var(--panel2); border-radius: 8px; padding: 10px; margin-top: 8px; font-size: 12px; }
  .evidence .bar { height: 6px; background: #2b2b38; border-radius: 3px; overflow: hidden; margin: 3px 0 7px; }
  .evidence .bar > span { display: block; height: 100%; background: var(--accent); }
  .health { font-size: 11.5px; color: var(--dim); margin-top: 6px; line-height: 1.5; }
  .health.held { color: var(--amber, #ffc14d); }

  /* Filter bar: source-playlist select + AND/OR toggle */
  .filterbar { display: flex; gap: 8px; align-items: center; padding: 6px 0 2px; }
  .filterbar select { flex: 1; min-width: 0; background: var(--panel2); border: 1px solid #2b2b38; color: var(--text); padding: 6px 10px; border-radius: 999px; font-size: 12.5px; outline: none; }
  .filterbar select.sortsel { flex: 0 0 auto; }
  .modebtn { flex-shrink: 0; background: var(--panel2); border: 1px solid var(--accent-dim); color: var(--accent); padding: 5px 12px; border-radius: 999px; font-size: 12px; font-weight: 700; cursor: pointer; letter-spacing: 1px; }
  .modebtn.on { background: var(--accent); color: #111; border-color: var(--accent); }

  /* Source-playlist chips on a track card */
  .plrow { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
  .plrow .plchip, .tmid .plchip { display: inline-flex; align-items: center; font-size: 10px; border-radius: 6px; background: #14202a; color: #6fb6d6; border: 1px solid #1d3340; overflow: hidden; }
  .plrow .plname, .tmid .plname { padding: 2px 4px 2px 8px; cursor: pointer; }
  .plrow .plx, .tmid .plx { background: none; border: none; color: #6fb6d6; padding: 2px 7px; cursor: pointer; font-size: 12px; line-height: 1; opacity: .65; }
  .plrow .plx:hover, .tmid .plx:hover { opacity: 1; color: var(--danger); background: #2a1414; }
  #toast .undobtn { margin-left: 12px; background: #111; color: var(--accent); border: none; border-radius: 6px; padding: 3px 11px; font-weight: 700; cursor: pointer; pointer-events: auto; }

  /* Review sub-tabs */
  nav.subtabs { display: flex; gap: 4px; margin-bottom: 10px; border-bottom: 1px solid #23232e; }
  nav.subtabs button { background: none; border: none; color: var(--dim); padding: 8px 14px; font-size: 13px; cursor: pointer; border-bottom: 2px solid transparent; }
  nav.subtabs button.active { color: var(--text); border-bottom-color: var(--accent); }

  /* Auto-tag reject affordance: auto tags carry a faint × on the right */
  .tagrow .tag.auto, .tmid .tag.auto { cursor: pointer; }
  .tagrow .tag.auto::after, .tmid .tag.auto::after { content: " ×"; opacity: .4; }

  /* Tag entry modal datalist input reuses .modal styles */

  /* Tags admin screen */
  .vocab { background: var(--panel); border-radius: var(--radius); padding: 8px 12px; margin-bottom: 6px; display: flex; align-items: center; gap: 10px; }
  .vocab.hidden-tag { opacity: .5; }
  .vocab .vname { flex: 1; min-width: 0; font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .vocab .vname .vn { color: var(--dim); font-size: 11px; }
  .vocab .vname .alias { color: #6fb6d6; font-size: 11px; }
  .vocab .vbtn { flex-shrink: 0; background: var(--panel2); border: 1px solid #2b2b38; color: var(--text); padding: 5px 10px; border-radius: 8px; font-size: 12px; cursor: pointer; }
  .vocab .vbtn.on { background: var(--danger); color: #111; border-color: var(--danger); font-weight: 600; }
  .vocabsearch { width: 100%; background: var(--panel2); border: 1px solid #2b2b38; color: var(--text); padding: 9px 12px; border-radius: var(--radius); font-size: 14px; outline: none; margin-bottom: 10px; }
  .vocab .vlayer { flex-shrink: 0; font-size: 10px; padding: 1px 7px; border-radius: 999px; background: var(--panel2); color: var(--dim); border: 1px solid #2b2b38; text-transform: uppercase; letter-spacing: .5px; }
  .vocab .vlayer.manual { color: var(--accent); border-color: #3a3a20; }

  /* Vocabulary suggestions (dynamic subgenre expansion, 2026-07-05) */
  .sugg { background: var(--panel); border-radius: var(--radius); padding: 10px 12px; margin-bottom: 6px; display: flex; align-items: center; gap: 10px; border-left: 3px solid var(--accent); }
  .sugg .sname { flex: 1; min-width: 0; font-size: 13.5px; }
  .sugg .sname .sn { color: var(--dim); font-size: 11px; }
  .sugg .sname .sfam { color: #6fb6d6; font-size: 11px; }
  .sugg .sname .salias { color: var(--dim); font-size: 11px; font-style: italic; }
  .sugg .sbtn { flex-shrink: 0; background: var(--panel2); border: 1px solid #2b2b38; color: var(--text); padding: 6px 12px; border-radius: 8px; font-size: 12.5px; cursor: pointer; }
  .sugg .sbtn.ok { background: #1d2c1d; border-color: #2f4c2f; color: #8fd18f; }
  .vsec { margin: 18px 0 8px; font-size: 12px; text-transform: uppercase; letter-spacing: 1.5px; color: var(--dim); }
  .vsec:first-child { margin-top: 0; }
  .vprof { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 4px; }
  .vprof .vp { font-size: 11.5px; padding: 3px 10px; border-radius: 999px; background: var(--panel); border: 1px solid #2b2b38; color: var(--text); cursor: default; }
  .vprof .vp .vpn { color: var(--dim); font-size: 10px; }
  .vprof .vp.userok { border-color: #3a4c2f; }
  .scanbtn { background: none; border: 1px dashed #3a3a48; color: var(--dim); padding: 6px 12px; border-radius: 8px; font-size: 12px; cursor: pointer; }

  /* ── Verdict Queue ── */
  .vq-strip { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; font-size: 12px; color: var(--dim); margin: 2px 2px 12px; }
  .vq-strip b { color: var(--text); }
  .vq-strip .vq-adv { color: var(--accent); }
  .vq-card { background: var(--panel); border: 1px solid #23232e; border-radius: 14px; padding: 16px; }
  .vq-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
  .vq-title { font-size: 17px; font-weight: 700; color: var(--text); line-height: 1.25; }
  .vq-artist { font-size: 13px; color: var(--dim); margin-top: 2px; }
  .vq-album { font-size: 11.5px; color: var(--dim); margin-top: 1px; font-style: italic; }
  .vq-play { width: 44px; height: 44px; flex-shrink: 0; border-radius: 50%; border: 1px solid var(--accent-dim); background: var(--panel2); color: var(--accent); font-size: 17px; cursor: pointer; }
  .vq-play:active { background: var(--panel); }
  .vq-existing { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
  .vq-existing .tag { font-size: 10.5px; padding: 2px 8px; border-radius: 999px; background: var(--panel2); color: var(--dim); }
  .vq-existing .tag.manual { background: #2a2a14; color: var(--accent); }
  .vq-seclbl { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--dim); margin: 16px 2px 7px; display: flex; align-items: center; gap: 8px; }
  .vq-seclbl .vq-help { cursor: pointer; color: var(--accent); border: 1px solid var(--accent-dim); border-radius: 50%; width: 16px; height: 16px; line-height: 14px; text-align: center; font-size: 11px; font-weight: 700; }
  .vq-skiphint { margin-left: auto; font-size: 10.5px; color: var(--dim); text-transform: none; letter-spacing: 0; }
  .vq-sugg { display: flex; flex-direction: column; gap: 8px; }
  .vq-sugg.blurred { filter: blur(7px); opacity: .5; pointer-events: none; transition: filter .15s; }
  .vq-reveal { text-align: center; font-size: 12px; color: var(--accent); border: 1px dashed var(--accent-dim); border-radius: 8px; padding: 8px; cursor: pointer; margin-bottom: 8px; }
  .vq-scard { border: 1px solid #2b2b38; border-radius: 10px; padding: 10px 12px; background: var(--panel2); }
  .vq-scard.accepted { border-color: var(--accent); background: #1d2410; }
  .vq-scard.rejected { border-color: var(--danger); opacity: .6; }
  .vq-srow { display: flex; align-items: center; gap: 8px; }
  .vq-skey { font-size: 10px; color: var(--dim); border: 1px solid #2b2b38; border-radius: 5px; padding: 1px 5px; font-variant-numeric: tabular-nums; }
  .vq-sname { font-size: 14px; font-weight: 600; color: var(--text); flex: 1; }
  .vq-slayer { font-size: 10px; color: var(--dim); text-transform: uppercase; letter-spacing: .04em; }
  .vq-sbtn { border: 1px solid #2b2b38; background: var(--panel); color: var(--text); border-radius: 7px; padding: 5px 11px; font-size: 12px; cursor: pointer; }
  .vq-sbtn.yes { border-color: var(--accent-dim); color: var(--accent); }
  .vq-sbtn.no { border-color: #4a2530; color: var(--danger); }
  .vq-sbtn.on { background: var(--accent); color: #111; border-color: var(--accent); font-weight: 700; }
  .vq-sbtn.no.on { background: var(--danger); color: #111; border-color: var(--danger); }
  .vq-ev { margin-top: 6px; display: flex; flex-wrap: wrap; gap: 4px; }
  .vq-ev span { font-size: 10.5px; color: var(--dim); background: var(--panel); border: 1px solid #23232e; border-radius: 6px; padding: 1px 7px; }
  .vq-chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .vq-chip { background: var(--panel2); border: 1px solid #2b2b38; color: var(--dim); padding: 6px 13px; border-radius: 999px; font-size: 13px; cursor: pointer; user-select: none; }
  .vq-chip.on { background: var(--accent); color: #111; border-color: var(--accent); font-weight: 700; }
  .vq-foot { display: flex; gap: 8px; margin-top: 18px; }
  .vq-foot button { flex: 1; padding: 12px; border-radius: 9px; border: 1px solid #2b2b38; background: var(--panel2); color: var(--text); font-size: 14px; font-weight: 600; cursor: pointer; }
  .vq-foot button.commit { background: var(--accent); color: #111; border-color: var(--accent); }
  .vq-foot button.skip { flex: 0 0 auto; color: var(--dim); }
  .vq-toggle { display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--dim); cursor: pointer; }
  .vq-note { font-size: 11px; color: var(--dim); margin-top: 10px; text-align: center; }
  .vq-note a { color: var(--accent); cursor: pointer; }
  /* Merged Review surface: lens toggle + triage row + rating row */
  .vq-lens { display: flex; gap: 4px; }
  .vq-lens button { background: var(--panel2); border: 1px solid #2b2b38; color: var(--dim); padding: 3px 11px; border-radius: 999px; font-size: 11.5px; cursor: pointer; }
  .vq-lens button.on { background: var(--accent); color: #111; border-color: var(--accent); font-weight: 700; }
  .vq-triage { display: flex; gap: 8px; margin-top: 12px; }
  .vq-triage button { flex: 1; padding: 9px; border-radius: 9px; border: 1px solid #2b2b38; background: var(--panel2); color: var(--text); font-size: 13px; cursor: pointer; }
  .vq-triage button.notforme { color: var(--danger); border-color: #4a2530; }
  .vq-triage button.more { flex: 0 0 44px; color: var(--dim); font-size: 16px; }
  .vq-stars { display: flex; gap: 4px; }
  .vq-stars button { background: none; border: none; font-size: 26px; color: #3a3a48; cursor: pointer; padding: 2px 4px; line-height: 1; }
  .vq-stars button.lit { color: var(--accent); }

  /* ── Review refinement (2026-07-03): compact card + rail + session log ── */
  .vq-wrap { display: grid; grid-template-columns: 1fr 340px; gap: 16px; align-items: start; }
  @media (max-width: 900px) { .vq-wrap { grid-template-columns: 1fr; } .vq-railcol { display: none; } }
  .vq-railcol { display: flex; flex-direction: column; gap: 16px; }
  kbd.vqk { background: #26262f; border: 1px solid #3a3a46; border-bottom-width: 2px; border-radius: 4px;
            padding: 0 5px; font: 10.5px/1.6 ui-monospace, monospace; color: #cfcfda; margin-right: 6px; }
  .vq-chip kbd.vqk { margin-left: -4px; }
  .vq-chip.on kbd.vqk { background: rgba(0,0,0,.25); border-color: rgba(0,0,0,.35); color: #111; }
  .vq-htriage { display: flex; gap: 6px; justify-content: flex-end; margin-bottom: 8px; }
  .vq-htriage button { background: none; border: 1px solid #2b2b38; color: var(--dim); border-radius: 6px;
                       padding: 3px 9px; font-size: 12px; cursor: pointer; white-space: nowrap; }
  .vq-htriage button.nfm:hover { border-color: var(--danger); color: var(--danger); }
  .vq-htriage button:hover { border-color: #3a3a46; color: var(--text); }
  .vq-headright { margin-left: auto; text-align: right; flex-shrink: 0; }
  .vq-headright .plrow { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
  .vq-time { color: var(--dim); font-size: 12px; margin-top: 4px; font-variant-numeric: tabular-nums; }
  .vq-pbar { margin-top: 12px; }
  .vq-ptrack { height: 5px; background: #26262f; border-radius: 3px; cursor: pointer; }
  .vq-pfill { height: 100%; width: 0%; background: var(--accent); border-radius: 3px; }
  .vq-pquarters { display: flex; justify-content: space-between; font-size: 10.5px; color: #4a4a55; margin-top: 3px; }
  .vq-qgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 24px; }
  @media (max-width: 700px) { .vq-qgrid { grid-template-columns: 1fr; } }
  .vq-footer { display: flex; align-items: center; margin-top: 18px; }
  .vq-footer .commitbtn { margin-left: auto; background: var(--accent); color: #111; border: none;
                          border-radius: 8px; padding: 9px 22px; font-size: 14px; font-weight: 650; cursor: pointer; }
  .vq-panel { background: var(--panel); border: 1px solid #23232e; border-radius: 12px; padding: 12px; }
  .vq-panel h3 { font-size: 11px; letter-spacing: 1.4px; text-transform: uppercase; color: var(--dim); margin: 0 0 8px; }
  .vq-row { display: flex; align-items: center; gap: 8px; padding: 6px; border-radius: 7px; cursor: pointer; }
  .vq-row:hover { background: var(--panel2); }
  .vq-row .t { flex: 1; min-width: 0; }
  .vq-row .t .n { display: block; font-size: 13px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .vq-row .t .a { display: block; font-size: 12px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .vq-row .d { font-size: 11.5px; color: var(--dim); font-variant-numeric: tabular-nums; }
  .vq-row .x { background: none; border: none; color: #4a4a55; font-size: 14px; cursor: pointer; padding: 2px 4px; }
  .vq-row .x:hover { color: var(--danger); }
  .vq-pcard { padding: 8px 6px; border-top: 1px solid #23232e; }
  .vq-pcard:first-of-type { border-top: none; }
  .vq-ptop { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 5px; }
  .vq-pname { font-size: 13px; font-weight: 600; color: var(--text); }
  .vq-pneed { font-size: 11.5px; color: var(--dim); }
  .vq-pneed.done { color: var(--accent); }
  .vq-bar { display: flex; align-items: center; gap: 8px; margin: 3px 0; }
  .vq-bar .l { font-size: 10.5px; color: #5c5c66; width: 52px; flex: none; }
  .vq-bar .tr { flex: 1; height: 4px; background: #26262f; border-radius: 2px; overflow: hidden; }
  .vq-bar .fl { height: 100%; background: #5a6b2a; border-radius: 2px; transition: width .5s ease; }
  .vq-bar .fl.full { background: var(--accent); }
  .vq-bar .v { font-size: 10.5px; color: var(--dim); width: 44px; text-align: right; font-variant-numeric: tabular-nums; flex: none; }
  .vq-bar .v .bump { color: var(--accent); font-weight: 700; }
  .vq-slog { margin-top: 16px; }
  .vq-slog .scroll { max-height: 248px; overflow-y: auto; }
  .vq-slogrow { display: flex; align-items: center; gap: 12px; padding: 7px 6px; border-top: 1px solid #23232e; font-size: 13px; }
  .vq-slogrow:first-of-type { border-top: none; }
  .vq-slogrow .when { color: #5c5c66; font-size: 11.5px; width: 44px; flex: none; font-variant-numeric: tabular-nums; }
  .vq-slogrow .what { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--dim); }
  .vq-slogrow .what .tk { color: var(--text); }
  .vq-slogrow .what .ap { color: var(--accent); }
  .vq-slogrow .what .nf { color: var(--danger); }
  .vq-slogrow a { color: var(--accent); cursor: pointer; font-size: 12px; flex: none; }
  .vq-slogempty { color: #5c5c66; font-size: 12.5px; padding: 6px; }
  .vq-strip select { background: var(--panel2); color: var(--text); border: 1px solid #2b2b38;
                     border-radius: 6px; padding: 3px 8px; font-size: 12px; max-width: 180px; }
  .vq-strip .spacer { flex: 1; }
  .vq-strip .laterlink { color: var(--accent); cursor: pointer; }
</style>
</head>
<body>

<div id="apptitle"><h1>Music Intelligence <span id="trackcount"></span></h1>
  <button class="refreshbtn" id="refreshbtn" title="Reload — fetch the latest app + data" onclick="location.reload()">⟳</button></div>

<!-- Player hero: Home only (hidden but still audible on other tabs). One DOM
     node — never reparent it, the YT iframe would reload and stop playback. -->
<div id="playerbar" class="hero-mode">
  <div class="pb-grid">
    <img id="pb-art" alt="" />
    <div class="pb-main">
      <div class="pb-lbl">Currently playing</div>
      <div class="nowplaying">
        <span id="np"></span>
        <button class="closebtn" onclick="closePlayer()" title="Stop and close player">✕</button>
      </div>
      <div class="pb-controls">
        <button id="pb-prev" onclick="prevTrack()" title="Previous"><i class="ti ti-player-skip-back"></i></button>
        <button id="pb-play" onclick="togglePlay()" title="Play / pause"><i class="ti ti-player-play"></i></button>
        <button id="pb-next" onclick="nextTrack()" title="Next"><i class="ti ti-player-skip-forward"></i></button>
        <span id="pb-cur" class="pb-time">0:00</span>
        <div id="pb-track" class="pb-track"><div id="pb-fill" class="pb-fill"></div></div>
        <span id="pb-dur" class="pb-time">0:00</span>
      </div>
      <div class="pb-bottom">
        <span id="pb-stars"></span>
        <span id="pb-tags" style="display:contents"></span>
        <button id="pb-vidpref" class="vidpref" onclick="toggleVidPref()"
          title="Prefer official videos: when on, audio-only tracks play their official music video where YTM has one. Pinned extended versions always win. Video edits can differ from the album audio."><i class="ti ti-video"></i> videos</button>
        <a id="np-ytm" href="#" target="_blank" style="color:var(--accent);font-size:11px;text-decoration:none">open in YTM <i class="ti ti-external-link" style="font-size:10px"></i></a>
      </div>
    </div>
    <div id="ytplayer-wrap"><div id="ytplayer"></div><button id="pb-expand" onclick="expandVideo()" title="Full screen"><i class="ti ti-arrows-maximize"></i></button></div>
  </div>
</div>

<header>
  <div class="searchrow">
    <input id="search" type="search" placeholder="Search title, artist, album, tag…" autocomplete="off">
  </div>
  <div class="facetrow" id="facetrow" style="display:none"></div>
  <div class="sumbar" id="sumbar" style="display:none"></div>
  <nav class="tabs">
    <button id="tab-home" class="active">Home</button>
    <button id="tab-library">Library</button>
    <button id="tab-review">Review <span id="reviewbadge" class="badge" style="display:none"></span></button>
    <button id="tab-playlists">Rules</button>
    <button id="tab-matches">Matches <span id="matchesbadge" class="badge" style="display:none"></span></button>
    <button id="tab-tags">Tags</button>
    <button id="tab-training">Training</button>
    <input id="homesearch" type="search" placeholder="Search or ask…" autocomplete="off">
  </nav>
</header>

<main>
  <div id="home">
    <div id="remotestrip"></div>
    <div class="pane-left">
      <div class="sectionlbl" style="margin-top:0">Playlists</div>
      <div id="tree-playlists"></div>
      <button class="treemore" id="treemore" onclick="toggleTreeMore()">all playlists ▾</button>
      <div class="sectionlbl">Smart views</div>
      <div id="tree-smart"></div>
    </div>
    <div class="pane-mid">
      <div class="midhead">
        <span><span class="t" id="mid-title"></span> <span class="sub" id="mid-sub"></span></span>
        <button class="playallbtn" id="mid-playall" onclick="playAllMid()">▶ Play all</button>
      </div>
      <div id="mid-rows"></div>
    </div>
    <div class="pane-right">
      <div class="qhead"><span class="lbl">Queue <span id="q-meta"></span></span>
        <span><button onclick="clearQueue()">clear</button> <button onclick="queueSave()" title="Mirror the queue to a YTM playlist. Heads-up: YTM may swap extended versions to the audio version inside native playlists.">save <i class="ti ti-arrow-up-right"></i></button></span></div>
      <div id="q-rows"></div>
      <div class="qdrop"><i class="ti ti-circle-plus"></i> from any track lands here — persists as your set crate</div>
    </div>
  </div>
  <div id="library" style="display:none"></div>
  <div id="playlists" style="display:none"></div>
  <div id="review" style="display:none"></div>
  <div id="matches" style="display:none"></div>
  <div id="tags" style="display:none"></div>
  <div id="training" style="display:none"></div>
</main>

<div class="toast" id="toast"></div>

<script>
const state = {
  q: "", rating: "", untagged: false, tags: [], tagMode: "and", sourcePlaylist: "", playlistSort: "name_asc", pendingVersions: false,
  sort: "added_desc", grandTotal: 0,
  offset: 0, limit: 100, total: 0,
  tracks: [], allTags: [], vocab: [], sourcePlaylists: [],
  matchesSub: "duplicates", reviewPairs: [], view: "home",
  // Home hub state
  plTree: [], treeExpanded: false, homeNode: null, homeTracks: [],
  midTitle: "", midSub: "", pq: [], qMirror: null,
  preferVideos: localStorage.getItem("preferVideos") === "1", ovCache: {},
  isMobile: /Android|iPhone|iPad/i.test(navigator.userAgent),
  queue: [], qIndex: -1,
  // Review queue (merged Inbox + Verdict surface)
  vq: [], vqIndex: 0, vqSel: null, vqReadiness: null, vqLastAdv: "",
  vqGuessFirst: localStorage.getItem("vqGuessFirst") === "1", vqRevealed: false,
  reviewSort: localStorage.getItem("reviewSort") === "newest" ? "newest" : "training",
  // Review refinement (2026-07-03): playlist filter (persisted), this-session
  // verdict log, readiness-bar flash targets. Session state resets on reload.
  vqPlFilter: localStorage.getItem("reviewPlaylist") || "",
  vqSession: [], vqBumped: [],
  // Library facet: Dismissed ("Not for me") filter (R11)
  dismissed: false,
};

const $ = (id) => document.getElementById(id);
const esc = (s) => (s || "").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// One shared timer so a quick toast (e.g. "Removing…") can't auto-hide a later
// toast/undo that replaced it. Both toast() and undoToast() clear it first.
let toastTimer;
function toast(msg) {
  const t = $("toast"); clearTimeout(toastTimer);
  t.style.pointerEvents = "";   // plain toasts stay click-through
  t.textContent = msg; t.classList.add("show");
  toastTimer = setTimeout(() => t.classList.remove("show"), 1600);
}

async function api(path, opts) {
  const r = await fetch(path, opts ? { headers: {"Content-Type":"application/json"}, ...opts } : undefined);
  if (!r.ok) { const e = await r.json().catch(() => ({})); throw new Error(e.detail || r.statusText); }
  return r.json();
}

// ── Library ──────────────────────────────

async function loadTracks(append = false) {
  if (!append) state.offset = 0;
  const p = new URLSearchParams({ limit: state.limit, offset: state.offset, sort: state.sort });
  if (state.q) p.set("q", state.q);
  if (state.rating !== "") p.set("rating", state.rating);
  if (state.untagged) p.set("untagged", "true");
  if (state.dismissed) p.set("dismissed", "true");
  if (state.tags.length) { p.set("tags", state.tags.join(",")); p.set("tag_mode", state.tagMode); }
  if (state.sourcePlaylist) p.set("source_playlist", state.sourcePlaylist);
  if (state.pendingVersions) p.set("pending_versions", "true");
  const data = await api(`/api/tracks?${p}`);
  state.total = data.total;
  state.tracks = append ? state.tracks.concat(data.tracks) : data.tracks;
  renderLibrary();
  renderSumBar();
}

function starButtons(t) {
  const r = t.personal_rating || 0;
  let html = '<div class="stars">';
  for (let i = 1; i <= 4; i++) {
    html += `<button class="${i <= r ? "lit" : ""}" onclick="rate('${t.track_pk}', ${i})">★</button>`;
  }
  return html + "</div>";
}

function trackCard(t, opts = {}) {
  const flags = [];
  if (t.blocked_from_playlists) flags.push('<span class="flag">⛔ blocked</span>');
  if (t.do_not_recommend) flags.push('<span class="flag">🚫 no rec</span>');
  const tags = (t.tags || []).map(g => {
    const manual = g.tag_type === "private_manual";
    const click = manual
      ? `onclick="removeTag('${t.track_pk}','${esc(g.tag)}')" title="manual tag — tap to remove"`
      : `onclick="rejectTag('${t.track_pk}','${esc(g.tag)}')" title="auto tag — tap to reject for this track"`;
    return `<span class="tag ${manual ? "manual" : "auto"}" ${click}>${esc(g.tag)}</span>`;
  }).join("");
  const plchips = (t.playlists || []).map(p =>
    `<span class="plchip">
       <span class="plname" title="filter to this playlist" onclick="filterPlaylist('${esc(p.playlist_id)}')">${esc(p.playlist_name)}</span>
       <button class="plx" title="remove from this playlist on YTM" onclick="removeFromPlaylist('${t.track_pk}','${esc(p.playlist_id)}')">×</button>
     </span>`).join("");
  return `
    <div class="track" id="tr-${t.track_pk}">
      <button class="playbtn" ${(t.ytm_track_id || t.playback_video_id) ? "" : "disabled"} onclick="playFromList('${t.track_pk}')" title="Play from here">▶</button>
      <div class="meta">
        <div class="title">${esc(t.canonical_title)}${t.playback_video_id ? ' <span class="vbad hi" title="plays a set extended/video version">· ext</span>' : ""}${
          t.pending_version_count ? ` <span class="pendbadge" title="playback versions to review" onclick="versionDialog('${t.track_pk}')">⇱ ${t.pending_version_count}</span>` : ""}</div>
        <div class="artist">${esc(t.canonical_artist)}${t.album_title ? " · " + esc(t.album_title) : ""}</div>
      </div>
      <div class="tmid">
        ${flags.join("")}
        ${tags}
        <button class="addtag" onclick="addTag('${t.track_pk}')">+ tag</button>
        ${plchips}
      </div>
      <div class="tctl">
        ${starButtons(t)}
        ${t.inbox_dismissed_at ? `<button class="addtag" onclick="restoreDismissed('${t.track_pk}')" title="clear the 'not for me' verdict — the track re-enters Review">restore</button>` : ""}
        <button class="qadd" onclick="queueAdd('${t.track_pk}')" title="Add to queue">⊕</button>
        <button class="more" onclick="trackMenu('${t.track_pk}')" title="more">⋯</button>
      </div>
    </div>`;
}

// R11: clear a "Not for me" verdict from the Library's Dismissed filter.
async function restoreDismissed(pk) {
  try { await api(`/api/tracks/${pk}/undismiss`, { method: "POST", body: "{}" }); }
  catch (e) { toast("Failed — try again"); return; }
  toast("Restored — back in Review");
  loadTracks();
}

function renderLibrary() {
  $("trackcount").textContent = state.total ? `· ${state.total}` : "";
  const el = $("library");
  if (!state.tracks.length) { el.innerHTML = '<div class="empty">No tracks match.</div>'; return; }
  el.innerHTML = state.tracks.map(t => trackCard(t)).join("")
    + (state.tracks.length < state.total
        ? `<button class="loadmore" onclick="more()">Load more (${state.total - state.tracks.length} remaining)</button>` : "");
}

// Locate a track by pk across the pools that render cards. Review-queue tracks
// use short field names, so map them to the canonical track shape.
function findTrack(pk) {
  const t = (state.tracks || []).find(x => x.track_pk === pk);
  if (t) return t;
  const v = (state.vq || []).find(x => x.pk === pk);
  if (v) return {
    track_pk: v.pk, canonical_title: v.title, canonical_artist: v.artist,
    album_title: v.album, ytm_track_id: v.video_id, playback_video_id: v.playback_video_id,
    personal_rating: v.personal_rating, blocked_from_playlists: v.blocked_from_playlists,
    do_not_recommend: v.do_not_recommend, tags: v.tags || [],
    playlists: v.playlists || [], reference_profiles: [],
  };
  return {};
}

// ── ⋯ menu: block / don't-recommend / reference exemplars / wrong-match ──
async function trackMenu(pk) {
  const t = findTrack(pk);
  const bg = document.createElement("div");
  bg.className = "menu";
  bg.onclick = (ev) => { if (ev.target === bg) bg.remove(); };

  // Reference-exemplar rows: one per profile this track is (or was) an example
  // of. Tap to veto ("not a good example") or restore. Derived from your tags —
  // nothing to set up. Hidden entirely if the track maps to no profile.
  const refs = t.reference_profiles || [];
  const refRows = refs.map(r => r.vetoed
    ? `<button onclick="unvetoReference('${pk}','${esc(r.profile_id)}');this.closest('.menu').remove()">
         ↩︎ Restore as example of “${esc(r.tag_name)}”</button>`
    : `<button onclick="vetoReference('${pk}','${esc(r.profile_id)}');this.closest('.menu').remove()">
         ✗ Not a good example of “${esc(r.tag_name)}”</button>`
  ).join("");
  const refSection = refRows
    ? `<div class="menuhint">Reference examples (from your tags)</div>${refRows}<div class="menusep"></div>`
    : "";

  bg.innerHTML = `<div class="sheet">
    ${refSection}
    <button onclick="versionDialog('${pk}');this.closest('.menu').remove()">
      🔎 ${t.playback_video_id ? "Change playback version" : "Find extended / video version"}${
        t.pending_version_count ? ` <span class="vbad mid">${t.pending_version_count} to review</span>` : ""}</button>
    <div class="menusep"></div>
    <button onclick="setFlag('${pk}','blocked_from_playlists',${t.blocked_from_playlists ? 0 : 1});this.closest('.menu').remove()">
      ${t.blocked_from_playlists ? "Unblock" : "Block from playlists"}</button>
    <button onclick="setFlag('${pk}','do_not_recommend',${t.do_not_recommend ? 0 : 1});this.closest('.menu').remove()">
      ${t.do_not_recommend ? "Allow recommending" : "Don't recommend"}</button>
    ${(t.playlists || []).map(p =>
      `<button onclick="removeFromPlaylist('${pk}','${esc(p.playlist_id)}');this.closest('.menu').remove()">
         Remove from “${esc(p.playlist_name)}”</button>`).join("")}
    <button onclick="removeFromAllPlaylists('${pk}');this.closest('.menu').remove()">Remove from all my YTM playlists</button>
    <button class="danger" onclick="wrongMatch('${pk}');this.closest('.menu').remove()">Wrong match (quarantine)</button>
    <button onclick="this.closest('.menu').remove()">Cancel</button>
  </div>`;
  document.body.appendChild(bg);
}

// Reload whichever list is on screen (shared by the version flow).
function reloadCurrent() {
  if (state.view === "library") loadTracks();
  else if (state.view === "home") loadHome();
}
function fmtDurMs(ms) {
  const s = Math.round((ms || 0) / 1000);
  return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
}

// Two-part dialog: auto-search YTM for extended/club versions (scored, one-click
// apply/reject with the evidence shown), plus the manual paste-a-link fallback.
async function versionDialog(pk) {
  const t = findTrack(pk);
  const bg = document.createElement("div");
  bg.className = "menu";
  bg.onclick = (ev) => { if (ev.target === bg) bg.remove(); };
  bg.innerHTML = `<div class="sheet verdlg">
    <div class="menuhint">Playback version — ${esc(t.canonical_title || "")}</div>
    <button class="verbtn" id="ver-search">🔎 Search YTM for the extended version</button>
    <button class="verbtn" id="ver-vsearch">🎬 Search for the official video</button>
    <div id="ver-results" class="verresults"></div>
    <div class="menusep"></div>
    <div class="menuhint">Or paste a link / videoId</div>
    <div class="verpaste">
      <input id="ver-paste" type="text" placeholder="YTM link or videoId — leave blank to clear"
             value="${t.playback_video_id ? `https://music.youtube.com/watch?v=${t.playback_video_id}` : ""}">
      <button id="ver-save">Save</button>
    </div>
    <button onclick="this.closest('.menu').remove()" style="margin-top:6px">Close</button>
  </div>`;
  document.body.appendChild(bg);
  state.verCache = { pk, t, cands: [] };

  bg.querySelector("#ver-search").onclick = async () => {
    const res = bg.querySelector("#ver-results");
    res.innerHTML = '<div class="verhint">Searching YouTube Music…</div>';
    try {
      const data = await api(`/api/tracks/${pk}/version-candidates/search`, { method: "POST", body: "{}" });
      state.verCache = { pk, t, cands: data.candidates };
      renderVersionCandidates(res);
      reloadCurrent();  // an auto-apply may have set the version already
    } catch (e) { res.innerHTML = `<div class="verhint">Search failed: ${esc(e.message)}</div>`; }
  };
  // Official-video discovery: quality-checks YTM's audio↔video pairing and
  // finds videos living on remix/feat. variant tracks. Approving feeds the
  // prefer-videos toggle (official_video_id), not the pinned version.
  bg.querySelector("#ver-vsearch").onclick = async () => {
    const res = bg.querySelector("#ver-results");
    res.innerHTML = '<div class="verhint">Searching for the official video…</div>';
    try {
      const data = await api(`/api/tracks/${pk}/video-candidates/search`, { method: "POST", body: "{}" });
      state.verCache = { pk, t, cands: data.candidates };
      renderVersionCandidates(res);
      reloadCurrent();
    } catch (e) { res.innerHTML = `<div class="verhint">Search failed: ${esc(e.message)}</div>`; }
  };
  bg.querySelector("#ver-save").onclick = async () => {
    const v = bg.querySelector("#ver-paste").value.trim();
    try {
      const r = await api(`/api/tracks/${pk}/playback-version`, { method: "PUT", body: JSON.stringify({ video: v }) });
      toast(r.playback_video_id ? "Playback version set ✓" : "Reverted to normal version");
      bg.remove();
      reloadCurrent();
    } catch (e) { toast("Couldn't read that link — try the watch URL"); }
  };
}

function renderVersionCandidates(el) {
  const { t, cands } = state.verCache;
  if (!cands.length) { el.innerHTML = '<div class="verhint">No candidates found. Try the paste box below.</div>'; return; }
  const canon = t.duration_ms ? fmtDurMs(t.duration_ms) : "?";
  el.innerHTML = cands.map(c => {
    const cd = c.candidate_duration_ms ? fmtDurMs(c.candidate_duration_ms) : "?";
    const conf = Math.round((c.confidence || 0) * 100);
    const applied = (c.status === "auto_applied" || c.status === "approved");
    const badge = c.veto_reason
      ? `<span class="vbad veto" title="disqualified">⚠ ${esc(c.veto_reason)}</span>`
      : `<span class="vbad ${conf >= 92 ? "hi" : conf >= 60 ? "mid" : "lo"}">${conf}%</span>`;
    const ev = `title ${Math.round(c.title_similarity * 100)}% · artist ${Math.round(c.artist_similarity * 100)}%`
      + ` · dur ${Math.round(c.duration_score * 100)}% · uploader ${c.uploader_score}`
      + (c.keyword_score ? ` · keyword ${c.keyword_score}` : "");
    const label = `${(t.canonical_artist || "")} — ${(t.canonical_title || "")}`;
    return `<div class="vrow ${c.veto_reason ? "isveto" : ""}">
      <div class="vmain">
        <div class="vtitle">${c.kind === "video" ? '<span class="vbad mid" title="official-video candidate — approving sets the prefer-videos version">🎬</span> ' : ""}${esc(c.candidate_title || "?")} ${badge}${applied ? ' <span class="vbad hi">✓ in use</span>' : ""}${c.status === "superseded" ? ' <span class="vbad lo">superseded</span>' : ""}</div>
        <div class="vsub">${esc(c.candidate_channel || "")} · ${cd} vs ${canon}${c.result_type ? " · " + esc(c.result_type) : ""}</div>
        <div class="vev">${ev}</div>
      </div>
      <div class="vact">
        <button title="preview in player" onclick="previewVersion('${esc(c.video_id)}','${esc(label)}','${esc(t.track_pk)}')">▶</button>
        ${c.status === "pending" ? `<button title="use this version" onclick="approveVersion(${c.candidate_id})">Use</button>` : ""}
        ${c.status === "pending" ? `<button class="danger" title="reject — never suggest again" onclick="rejectVersion(${c.candidate_id})">✕</button>` : ""}
      </div>
    </div>`;
  }).join("");
}

function previewVersion(videoId, label, pk) {
  play(videoId, label, pk, true);  // reuse the IFrame player; ext=true → "· extended"
}

async function approveVersion(candidateId) {
  let applied;
  try {
    applied = await api(`/api/version-candidates/${candidateId}/approve`, { method: "POST", body: "{}" });
  } catch (e) { toast(e.message || "Couldn't apply"); return; }
  toast(applied.kind === "video" ? "Official video set ✓" : "Playback version set ✓");
  // Reflect locally: this one approved, the rest OF THE SAME KIND superseded.
  const c = state.verCache.cands.find(x => x.candidate_id === candidateId);
  if (c) {
    c.status = "approved";
    state.verCache.cands.forEach(x => { if (x.candidate_id !== candidateId && x.status === "pending" && x.kind === c.kind) x.status = "superseded"; });
  }
  const el = document.querySelector("#ver-results");
  if (el) renderVersionCandidates(el);
  reloadCurrent();
}

async function rejectVersion(candidateId) {
  try {
    await api(`/api/version-candidates/${candidateId}/reject`, { method: "POST", body: "{}" });
  } catch (e) { toast(e.message || "Couldn't reject"); return; }
  toast("Rejected — won't suggest again");
  const c = state.verCache.cands.find(x => x.candidate_id === candidateId);
  if (c) c.status = "rejected";
  const el = document.querySelector("#ver-results");
  if (el) renderVersionCandidates(el);
  reloadCurrent();
}

async function vetoReference(pk, profileId) {
  await api(`/api/tracks/${pk}/reference/${encodeURIComponent(profileId)}/veto`, { method: "POST", body: "{}" });
  toast("Won't use as an example");
  if (state.view === "library") loadTracks();
}

async function unvetoReference(pk, profileId) {
  await api(`/api/tracks/${pk}/reference/${encodeURIComponent(profileId)}/veto`, { method: "DELETE" });
  toast("Restored as an example");
  if (state.view === "library") loadTracks();
}

// Retire the current review card when an action just made it ineligible for
// both lenses (block, quarantine) — mirrors the old inbox's list reload.
function vqRetireIfCurrent(pk) {
  const t = vqCard();
  if (state.view === "review" && t && t.pk === pk) {
    if (state.vqMeta) state.vqMeta.eligible_total = Math.max(0, (state.vqMeta.eligible_total || 1) - 1);
    state.vqLastAdv = "";
    state.vqIndex++;
    renderVerdict();
  }
}

async function setFlag(pk, flag, value) {
  await api(`/api/tracks/${pk}/flags`, { method: "PUT", body: JSON.stringify({ [flag]: !!value }) });
  toast(flag === "blocked_from_playlists" ? (value ? "Blocked" : "Unblocked") : (value ? "Won't recommend" : "Recommending"));
  if (state.view === "library") loadTracks();
  if (value) vqRetireIfCurrent(pk);
}

async function wrongMatch(pk) {
  if (!confirm("Mark as wrong match? It will be quarantined and removed from playlists.")) return;
  await api(`/api/tracks/${pk}/wrong-match`, { method: "POST", body: "{}" });
  toast("Quarantined → Matches");
  if (state.view === "library") loadTracks();
  vqRetireIfCurrent(pk);
}

function more() { state.offset += state.limit; loadTracks(true); }

async function rate(pk, rating) {
  const t = (state.tracks || []).find(x => x.track_pk === pk);
  const cur = t ? (t.personal_rating || 0) : 0;
  const newRating = (cur === rating) ? null : rating;  // tap same star = clear
  await api(`/api/tracks/${pk}/rating`, { method: "PUT", body: JSON.stringify({ rating: newRating }) });
  if (t) t.personal_rating = newRating;
  const pq = (state.pq || []).find(x => x.track_pk === pk);
  if (pq) pq.personal_rating = newRating;
  toast(newRating ? ["", "Like", "Really like", "Love", "Perfect ✦"][newRating] : "Rating cleared");
  if (state.view === "library") renderLibrary();
  else if (state.view === "home") { renderMid(); pollRemote(); }
  if (currentPlayingPk() === pk) updateHeroMeta(pk);   // hero stars stay honest
  refreshBadges();   // rating retires a track from the Review "Newest" lens
}

// Layer display order + labels for the tap-palette.
const LAYER_ORDER = ["subgenre", "functional", "personal", "family", "era"];
const LAYER_LABEL = { subgenre: "Subgenre", functional: "Function (set role)", personal: "Personal", family: "Family", era: "Era (sounds like)" };

async function addTag(pk) {
  if (!state.allTags.length) { try { state.allTags = await api("/api/tags"); } catch (e) {} }
  // The profile vocabulary = your tap-palette. Recognition, not recall: tap a
  // chip to add/remove. No spelling drift, guaranteed to map to a profile.
  if (!state.profileList) {
    try { state.profileList = (await api("/api/reference/profiles")).profiles || []; }
    catch (e) { state.profileList = []; }
  }
  const t = findTrack(pk);
  const manual = new Set((t.tags || [])
    .filter(g => g.tag_type === "private_manual").map(g => g.tag.toLowerCase()));

  const opts = state.allTags.map(x => `<option value="${esc(x.tag)}">`).join("");
  const bg = document.createElement("div");
  bg.className = "modal-bg";
  let changed = false;
  const close = () => {
    bg.remove();
    if (changed) {
      refreshActiveView(); loadTagChips();
      if (currentPlayingPk() === pk) updateHeroMeta(pk);
    }
  };
  bg.onclick = (ev) => { if (ev.target === bg) close(); };

  bg.innerHTML = `<div class="modal">
    <h2>Tag track</h2>
    <div id="palette"></div>
    <div class="hint" style="margin-top:10px">Or type a free-text tag (descriptive only — won't teach a profile):</div>
    <input id="tag-input" list="tag-suggest" placeholder="e.g. raw, hardware-jam" autocomplete="off" autocapitalize="none">
    <datalist id="tag-suggest">${opts}</datalist>
    <div class="btnrow">
      <button class="primary" id="tag-done">Done</button>
    </div>
  </div>`;
  document.body.appendChild(bg);

  // ── Palette ──────────────────────────────────────────────────────────────
  const palette = bg.querySelector("#palette");
  const byLayer = {};
  state.profileList.forEach(p => { (byLayer[p.taxonomy_layer] ||= []).push(p); });
  const renderPalette = () => {
    palette.innerHTML = LAYER_ORDER.filter(l => byLayer[l]).map(layer => {
      const chips = byLayer[layer].map(p => {
        const on = manual.has(p.tag_name.toLowerCase());
        return `<button class="chip ${on ? "active" : ""}" data-tag="${esc(p.tag_name)}">${on ? "✓ " : ""}${esc(p.tag_name)}</button>`;
      }).join("");
      return `<div class="playlbl">${LAYER_LABEL[layer] || layer}</div><div class="palette-row">${chips}</div>`;
    }).join("") || '<div class="hint">No profiles seeded yet.</div>';
  };
  renderPalette();

  palette.onclick = async (ev) => {
    const btn = ev.target.closest(".chip"); if (!btn) return;
    const tag = btn.dataset.tag, key = tag.toLowerCase();
    btn.disabled = true;
    try {
      if (manual.has(key)) {
        await api(`/api/tracks/${pk}/tags/${encodeURIComponent(tag)}`, { method: "DELETE" });
        manual.delete(key); toast(`Removed: ${key}`);
      } else {
        await api(`/api/tracks/${pk}/tags`, { method: "POST", body: JSON.stringify({ tag }) });
        manual.add(key); toast(`Tagged: ${key}`);
      }
      changed = true; renderPalette();
    } catch (e) { toast("Failed — try again"); btn.disabled = false; }
  };

  // ── Free-text escape hatch ───────────────────────────────────────────────
  const input = bg.querySelector("#tag-input");
  const submitFree = async () => {
    const tag = input.value.trim(); if (!tag) return;
    await api(`/api/tracks/${pk}/tags`, { method: "POST", body: JSON.stringify({ tag }) });
    manual.add(tag.toLowerCase()); changed = true; input.value = "";
    renderPalette(); toast(`Tagged: ${tag.toLowerCase()}`);
  };
  input.addEventListener("keydown", (e) => { if (e.key === "Enter") submitFree(); });
  bg.querySelector("#tag-done").onclick = close;
}

async function removeTag(pk, tag) {
  if (!confirm(`Remove your manual tag "${tag}"?`)) return;
  await api(`/api/tracks/${pk}/tags/${encodeURIComponent(tag)}`, { method: "DELETE" });
  refreshActiveView(); loadTagChips();
  if (currentPlayingPk() === pk) updateHeroMeta(pk);
}

// Reject an auto-pulled tag for THIS track only. Survives re-enrichment.
async function rejectTag(pk, tag) {
  if (!confirm(`Reject "${tag}" on this track?\n\nIt won't show here or count toward playlists, and won't return on re-enrichment. To hide a tag across your whole library, use the Tags tab instead.`)) return;
  await api(`/api/tracks/${pk}/tags/${encodeURIComponent(tag)}/reject`, { method: "POST", body: "{}" });
  refreshActiveView(); loadTagChips();
  if (currentPlayingPk() === pk) updateHeroMeta(pk);
  toast(`Rejected: ${tag}`);
}

// ── Playback ─────────────────────────────
// Phone:   deep-link opens the YouTube Music app (audio engine).
// Desktop: official YouTube embed in the player bar.

// Desktop: a real queue player via the YouTube IFrame API (continuous play,
// auto-advance, transport controls, seek). Mobile: deep-link out (a web player
// can't background-play on Android — that wall is tracked separately).
let ytPlayer = null, ytReady = false, pendingPlay = null, pendingCue = null, progTimer = null, progTick = 0;

function onYouTubeIframeAPIReady() {
  ytPlayer = new YT.Player("ytplayer", {
    height: "158", width: "280",
    playerVars: { playsinline: 1, rel: 0 },
    events: {
      onReady: () => {
        ytReady = true;
        if (pendingPlay) { const p = pendingPlay; pendingPlay = null; loadQ(p.index); }
        else if (pendingCue) doCue();
      },
      onStateChange: onPlayerState,
    },
  });
}

function onPlayerState(e) {
  if (e.data === YT.PlayerState.ENDED) { nextTrack(); return; }
  const btn = $("pb-play");
  if (e.data === YT.PlayerState.PLAYING) { btn.innerHTML = '<i class="ti ti-player-pause"></i>'; startProg(); }
  else if (e.data === YT.PlayerState.PAUSED) { btn.innerHTML = '<i class="ti ti-player-play"></i>'; }
  else if (e.data === YT.PlayerState.CUED) {
    // Restored-after-refresh state: show the saved position, wait for a tap.
    btn.innerHTML = '<i class="ti ti-player-play"></i>';
    try {
      const d = ytPlayer.getDuration() || 0, c = ytPlayer.getCurrentTime() || 0;
      $("pb-cur").textContent = fmtTime(c); $("pb-dur").textContent = fmtTime(d);
      $("pb-fill").style.width = d ? `${(c / d) * 100}%` : "0";
    } catch (err) {}
  }
}

// ── Refresh persistence: the hero survives a page reload, paused at the
//    saved position (browsers block un-gestured audio autoplay). ──
function savePlayerState(pos) {
  try {
    if (!(state.queue || []).length || state.qIndex < 0) {
      localStorage.removeItem("playerState"); return;
    }
    localStorage.setItem("playerState", JSON.stringify({
      queue: state.queue, qIndex: state.qIndex, pos: pos || 0,
    }));
  } catch (e) {}
}

function restorePlayer() {
  if (state.isMobile) return;
  let s;
  try { s = JSON.parse(localStorage.getItem("playerState") || "null"); }
  catch (e) { return; }
  if (!s || !(s.queue || []).length) return;
  state.queue = s.queue;
  state.qIndex = Math.min(Math.max(s.qIndex, 0), s.queue.length - 1);
  const item = state.queue[state.qIndex];
  const vid = item.playingId || item.videoId;   // keep the video/audio choice made pre-refresh
  $("playerbar").classList.add("visible");
  $("np").innerHTML = `<b>${esc(item.label)}</b>` +
    (item.ext ? ' <span style="color:var(--accent);font-size:11px">· extended</span>'
     : vid !== item.videoId ? ' <span style="color:var(--accent);font-size:11px">· video</span>' : "");
  $("np-ytm").href = `https://music.youtube.com/watch?v=${vid}`;
  $("pb-art").src = `https://i.ytimg.com/vi/${vid}/mqdefault.jpg`;
  updateHeroMeta(item.pk);
  pendingCue = { videoId: vid, start: s.pos || 0 };
  if (ytReady) doCue();
}

function doCue() {
  if (!pendingCue || !ytReady) return;
  ytPlayer.cueVideoById({ videoId: pendingCue.videoId, startSeconds: pendingCue.start });
  pendingCue = null;
}

// Tracks visible in the current view, in display order — that's the queue.
function currentViewTracks() {
  return state.tracks || [];
}
// Prefer an explicitly-set playback id (e.g. an extended version), else the song.
function playableId(t) { return t.playback_video_id || t.ytm_track_id || null; }

// Track-row play button: start a continuous queue from this track through the
// rest of the visible list.
function playFromList(pk) {
  const list = currentViewTracks();
  const playable = list.filter(playableId);
  const idx = playable.findIndex(t => t.track_pk === pk);
  if (idx < 0) {
    const t = list.find(x => x.track_pk === pk);
    if (t) play(playableId(t), `${t.canonical_artist} — ${t.canonical_title}`, pk, !!t.playback_video_id);
    return;
  }
  // Playing a list REPLACES the persistent queue (queue = set crate, one
  // object). One-off single plays (the fallback above) leave the crate alone.
  state.pq = playable.slice();
  persistQueue(); renderQueue();
  _startQueue(playable.map(qItem), idx);
}

// Low-level single-item play (used by Home/now-playing/recent callers).
function play(videoId, label, pk, ext) {
  if (!videoId) return;
  _startQueue([{ videoId, label, pk: pk || null, ext: !!ext }], 0);
}

function _startQueue(queue, index) {
  if (state.isMobile) {
    window.location.href = `https://music.youtube.com/watch?v=${queue[index].videoId}`;
    return;
  }
  state.queue = queue; state.qIndex = index;
  $("playerbar").classList.add("visible");
  if (!ytReady) { pendingPlay = { index }; return; }
  loadQ(index);
}

// Prefer-videos toggle: play-time priority is pinned extended > official
// video (toggle on) > audio. Counterparts resolve lazily server-side, one
// YTM lookup per track ever; results cached here per session too.
function toggleVidPref() {
  state.preferVideos = !state.preferVideos;
  localStorage.setItem("preferVideos", state.preferVideos ? "1" : "0");
  $("pb-vidpref").classList.toggle("on", state.preferVideos);
  toast(state.preferVideos
    ? "Official videos on — applies from the next track"
    : "Back to pure audio from the next track");
}

async function resolveOfficial(pk) {
  if (!pk) return null;
  if (pk in state.ovCache) return state.ovCache[pk];
  try {
    const d = await api(`/api/tracks/${pk}/official-video`);
    state.ovCache[pk] = d.official_video_id || null;
  } catch (e) { return null; }   // transient — don't cache, retry next play
  return state.ovCache[pk];
}

async function loadQ(i) {
  if (i < 0 || i >= state.queue.length) return;
  state.qIndex = i;
  const item = state.queue[i];
  let vid = item.videoId;
  if (state.preferVideos && !item.ext) {
    const ov = await resolveOfficial(item.pk);
    if (state.queue[state.qIndex] !== item) return;   // user skipped mid-lookup
    if (ov) vid = ov;
  }
  item.playingId = vid;
  ytPlayer.loadVideoById(vid);
  $("np").innerHTML = `<b>${esc(item.label)}</b>` +
    (item.ext ? ' <span style="color:var(--accent);font-size:11px">· extended</span>'
     : vid !== item.videoId ? ' <span style="color:var(--accent);font-size:11px">· video</span>' : "");
  $("np-ytm").href = `https://music.youtube.com/watch?v=${vid}`;
  // Hero extras: art from the playing video's thumbnail (no storage needed),
  // stars + tag row fetched per track change.
  $("pb-art").src = `https://i.ytimg.com/vi/${vid}/mqdefault.jpg`;
  updateHeroMeta(item.pk);
  highlightPlaying(item.pk);
  renderQueue();
  savePlayerState(0);
  // Prefetch the next track's counterpart so auto-advance stays gapless.
  const nx = state.queue[i + 1];
  if (state.preferVideos && nx && !nx.ext) resolveOfficial(nx.pk);
}

async function updateHeroMeta(pk) {
  $("pb-stars").innerHTML = ""; $("pb-tags").innerHTML = "";
  if (!pk) return;
  try {
    const t = await api(`/api/tracks/${pk}`);
    if (currentPlayingPk() !== pk) return;   // user skipped while we fetched
    $("pb-stars").innerHTML = starButtons(t);
    const tags = (t.tags || []).map(g =>
      `<span class="tag ${g.tag_type === "private_manual" ? "manual" : "auto"}">${esc(g.tag)}</span>`).join("");
    $("pb-tags").innerHTML = tags + `<button class="addtag" onclick="addTag('${pk}')">+ tag</button>`;
  } catch (e) {}
}

function expandVideo() {
  const w = $("ytplayer-wrap");
  if (document.fullscreenElement) document.exitFullscreen();
  else if (w.requestFullscreen) w.requestFullscreen();
}

function nextTrack() {
  if (state.qIndex < (state.queue || []).length - 1) loadQ(state.qIndex + 1);
}
function prevTrack() {
  if (ytReady && ytPlayer.getCurrentTime && ytPlayer.getCurrentTime() > 3) { ytPlayer.seekTo(0, true); return; }
  if (state.qIndex > 0) loadQ(state.qIndex - 1);
}
function togglePlay() {
  if (!ytReady) return;
  const s = ytPlayer.getPlayerState();
  if (s === YT.PlayerState.PLAYING) ytPlayer.pauseVideo(); else ytPlayer.playVideo();
}

function startProg() {
  if (progTimer) return;
  progTimer = setInterval(() => {
    if (!ytReady || !ytPlayer.getDuration) return;
    const d = ytPlayer.getDuration() || 0, c = ytPlayer.getCurrentTime() || 0;
    $("pb-fill").style.width = d ? `${(c / d) * 100}%` : "0";
    $("pb-cur").textContent = fmtTime(c);
    $("pb-dur").textContent = fmtTime(d);
    if (++progTick % 10 === 0) savePlayerState(c);   // persist position ~every 5s
  }, 500);
}
function fmtTime(s) { s = Math.floor(s || 0); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; }

function highlightPlaying(pk) {
  document.querySelectorAll(".track.playing, .midrow.playing").forEach(el => el.classList.remove("playing"));
  if (pk) {
    const el = document.getElementById("tr-" + pk); if (el) el.classList.add("playing");
    const mr = document.getElementById("mr-" + pk); if (mr) mr.classList.add("playing");
  }
}

function closePlayer() {
  if (ytReady && ytPlayer.stopVideo) ytPlayer.stopVideo();
  if (progTimer) { clearInterval(progTimer); progTimer = null; }
  state.queue = []; state.qIndex = -1;
  $("playerbar").classList.remove("visible");
  $("pb-art").removeAttribute("src");
  $("pb-stars").innerHTML = ""; $("pb-tags").innerHTML = "";
  localStorage.removeItem("playerState");
  highlightPlaying(null);
  renderQueue();   // drop the 'current' ring; the crate itself persists
}

// ── Source-playlist editing: cull tracks from your own YTM playlists ──
function refreshActiveView() {
  if (state.view === "library") loadTracks();
  else if (state.view === "home") loadHome();
}

function undoToast(msg, onUndo, actionLabel = "Undo") {
  const t = $("toast");
  clearTimeout(toastTimer);   // cancel any pending auto-hide from an earlier toast
  t.innerHTML = `${esc(msg)} <button class="undobtn" id="undobtn">${esc(actionLabel)}</button>`;
  t.style.pointerEvents = "auto";   // the toast normally ignores taps — let this one catch them
  t.classList.add("show");
  const hide = () => { t.classList.remove("show"); t.style.pointerEvents = ""; clearTimeout(toastTimer); };
  $("undobtn").onclick = async () => {
    hide();
    try { await onUndo(); } catch (e) { alert("Undo failed: " + e.message); }
  };
  toastTimer = setTimeout(hide, 6000);
}

// Tap a playlist chip's name → filter the Library to that playlist.
function filterPlaylist(playlistId) {
  state.sourcePlaylist = playlistId;
  if (state.view !== "library") switchView("library");   // switchView reloads + syncs dropdown
  else { loadSourcePlaylists(); loadTracks(); }
}

// Tap a chip's × → remove the track from that YTM playlist, with one-tap Undo.
async function removeFromPlaylist(pk, playlistId) {
  toast("Removing…");
  try {
    const r = await api(`/api/tracks/${pk}/playlists/${encodeURIComponent(playlistId)}/remove`,
                        { method: "POST", body: "{}" });
    refreshActiveView();
    undoToast(`Removed from ${r.playlist_name}`, async () => {
      await api(`/api/removals/${r.removal_id}/undo`, { method: "POST", body: "{}" });
      refreshActiveView(); toast("Re-added");
    });
  } catch (e) { alert("Remove failed: " + e.message); }
}

async function removeFromAllPlaylists(pk) {
  if (!confirm("Remove this track from ALL your YTM playlists?\n\nIt's also blocked from auto-generated playlists so your rules won't re-add it.")) return;
  toast("Removing from all…");
  try {
    const r = await api(`/api/tracks/${pk}/playlists/remove-all`, { method: "POST", body: "{}" });
    refreshActiveView();
    const n = (r.removed || []).length, f = (r.failed || []).length;
    toast(`Removed from ${n} playlist${n !== 1 ? "s" : ""}${f ? ` · ${f} read-only skipped` : ""}`);
  } catch (e) { alert("Failed: " + e.message); }
}

// ── Playlists ────────────────────────────

async function loadPlaylists() {
  const rules = await api("/api/playlists");
  $("playlists").innerHTML =
    `<button class="newpl" onclick="editRule(null)">+ New playlist rule</button>` +
    (rules.length ? rules.map(r => {
      const e = r.rule_json.eligibility || {};
      const desc = [
        e.tags_any?.length ? "any of: " + e.tags_any.join(", ") : "",
