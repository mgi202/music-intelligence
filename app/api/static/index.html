        e.tags_all?.length ? "all of: " + e.tags_all.join(", ") : "",
        e.tags_none?.length ? "none of: " + e.tags_none.join(", ") : "",
      ].filter(Boolean).join(" · ") || "all tracks";
      return `
      <div class="pl">
        <div class="name">${esc(r.playlist_name)} ${r.enabled ? "" : "· <span style='color:var(--dim)'>disabled</span>"}</div>
        <div class="sub">${r.ranking_mode} · ${desc}${r.max_tracks ? " · max " + r.max_tracks : ""}
          ${r.last_synced_at ? "<br>last synced " + r.last_synced_at.slice(0, 16).replace("T", " ") : "<br>never synced"}</div>
        <div class="health" id="health-${r.rule_id}">…</div>
        <div class="actions">
          <button onclick="previewRule('${r.rule_id}', '${esc(r.playlist_name)}')">Preview · Why?</button>
          <button class="primary" onclick="syncRule('${r.rule_id}')">Sync to YTM</button>
          <button onclick="showSnapshots('${r.rule_id}', '${esc(r.playlist_name)}')">Undo…</button>
          <button onclick='editRule(${JSON.stringify(r).replace(/'/g, "&#39;")})'>Edit</button>
          <button class="danger" onclick="deleteRule('${r.rule_id}')">Delete</button>
        </div>
      </div>`;
    }).join("") : '<div class="empty">No playlist rules yet.</div>');
  rules.forEach(r => loadHealth(r.rule_id));
}

async function loadHealth(ruleId) {
  const el = $(`health-${ruleId}`);
  if (!el) return;
  try {
    const h = await api(`/api/playlists/${ruleId}/health`);
    const bits = [`${h.compiled_count} tracks`];
    if (h.average_rating != null) bits.push(`avg ★${h.average_rating}`);
    if (h.unrated_count) bits.push(`${h.unrated_count} unrated`);
    if (h.weak_metadata_count) bits.push(`${h.weak_metadata_count} weak meta`);
    if (h.missing_from_ytm_count) bits.push(`${h.missing_from_ytm_count} missing`);
    if (h.pending_dedup_count) bits.push(`${h.pending_dedup_count} dup?`);
    if (h.held) { el.classList.add("held"); el.textContent = "⚠ HELD — " + h.sync_held_reason + " · " + bits.join(" · "); }
    else el.textContent = bits.join(" · ");
  } catch (e) { el.textContent = ""; }
}

async function showSnapshots(ruleId, name) {
  const snaps = await api(`/api/playlists/${ruleId}/snapshots`);
  const bg = document.createElement("div");
  bg.className = "modal-bg";
  bg.onclick = (ev) => { if (ev.target === bg) bg.remove(); };
  bg.innerHTML = `<div class="modal"><h2>${esc(name)} — snapshots</h2>
    ${snaps.length ? snaps.map(s => `<div class="pl">
        <div class="sub">${s.taken_at.slice(0,16).replace("T"," ")} · ${s.reason} · ${s.track_count} tracks</div>
        <div class="actions"><button class="primary" onclick="restoreSnap(${s.snapshot_id})">Restore this</button></div>
      </div>`).join("") : '<div class="empty">No snapshots yet.</div>'}
    <div class="btnrow"><button onclick="this.closest('.modal-bg').remove()">Close</button></div>
  </div>`;
  document.body.appendChild(bg);
}
async function restoreSnap(id) {
  if (!confirm("Restore this snapshot? Current state is snapshotted first so this is undoable.")) return;
  try { await api(`/api/snapshots/${id}/restore`, { method: "POST", body: "{}" }); toast("Restored ✓"); document.querySelector(".modal-bg")?.remove(); loadPlaylists(); }
  catch (e) { alert("Restore failed: " + e.message); }
}

function editRule(rule) {
  const e = rule?.rule_json?.eligibility || {};
  const bg = document.createElement("div");
  bg.className = "modal-bg";
  bg.onclick = (ev) => { if (ev.target === bg) bg.remove(); };
  bg.innerHTML = `
    <div class="modal">
      <h2>${rule ? "Edit" : "New"} playlist rule</h2>
      <label>Playlist name</label>
      <input id="m-name" value="${esc(rule?.playlist_name || "")}" placeholder="Late Night Drive">
      <label>Ranking mode</label>
      <select id="m-mode">
        ${["mood","dj_mix","discovery","utility"].map(m =>
          `<option ${rule?.ranking_mode === m ? "selected" : ""}>${m}</option>`).join("")}
      </select>
      <label>Must have ANY of these tags</label>
      <input id="m-any" value="${esc((e.tags_any || []).join(", "))}" placeholder="dub-techno, deep-techno">
      <div class="hint">comma-separated</div>
      <label>Must have ALL of these tags</label>
      <input id="m-all" value="${esc((e.tags_all || []).join(", "))}">
      <label>Must have NONE of these tags</label>
      <input id="m-none" value="${esc((e.tags_none || []).join(", "))}">
      <label>Minimum rating (optional)</label>
      <select id="m-minrating">
        <option value="">—</option>
        ${[1,2,3,4].map(n => `<option value="${n}" ${rule?.rule_json?.eligibility?.min_rating === n ? "selected" : ""}>${"★".repeat(n)}+</option>`).join("")}
      </select>
      <label>Max tracks (optional)</label>
      <input id="m-max" type="number" value="${rule?.max_tracks || ""}" placeholder="50">
      <div class="btnrow">
        <button onclick="this.closest('.modal-bg').remove()">Cancel</button>
        <button class="primary" id="m-save">Save</button>
      </div>
    </div>`;
  document.body.appendChild(bg);
  $("m-save").onclick = async () => {
    const split = (id) => $(id).value.split(",").map(s => s.trim().toLowerCase()).filter(Boolean);
    const eligibility = { tags_any: split("m-any"), tags_all: split("m-all"), tags_none: split("m-none") };
    const minR = $("m-minrating").value;
    if (minR) eligibility.min_rating = parseInt(minR);
    const body = {
      playlist_name: $("m-name").value.trim(),
      ranking_mode: $("m-mode").value,
      rule_json: { eligibility },
      max_tracks: $("m-max").value ? parseInt($("m-max").value) : null,
      enabled: true,
    };
    if (!body.playlist_name) return alert("Name required");
    await api(rule ? `/api/playlists/${rule.rule_id}` : "/api/playlists",
              { method: rule ? "PUT" : "POST", body: JSON.stringify(body) });
    bg.remove(); loadPlaylists(); toast("Saved");
  };
}

async function previewRule(ruleId, name) {
  const data = await api(`/api/playlists/${ruleId}/preview`);
  const bg = document.createElement("div");
  bg.className = "modal-bg";
  bg.onclick = (ev) => { if (ev.target === bg) bg.remove(); };
  bg.innerHTML = `<div class="modal"><h2>${esc(name)} — ${data.tracks.length} tracks</h2>
    ${data.tracks.length ? data.tracks.map((t, i) => `
      <div class="track">
        <div class="row1">
          <div class="meta" onclick="this.closest('.track').querySelector('.evidence').style.display = this.closest('.track').querySelector('.evidence').style.display==='none'?'block':'none'">
            <div class="title">${i + 1}. ${esc(t.canonical_title)}${t.personal_rating ? " " + "★".repeat(t.personal_rating) : ""}</div>
            <div class="artist">${esc(t.canonical_artist)} · score ${t.score} <span style="color:var(--accent)">— Why?</span></div>
          </div>
        </div>
        <div class="evidence" style="display:none">${evidenceHtml(t.evidence)}</div>
      </div>`).join("") : '<div class="empty">No tracks match.</div>'}
    <div class="btnrow"><button onclick="this.closest('.modal-bg').remove()">Close</button></div>
  </div>`;
  document.body.appendChild(bg);
}

function evidenceHtml(ev) {
  if (!ev) return "";
  const comps = ev.score_components || {};
  const max = Math.max(0.0001, ...Object.values(comps).map(Math.abs));
  const bars = Object.entries(comps).map(([k, v]) =>
    `<div>${esc(k)} <b>${(+v).toFixed(3)}</b></div><div class="bar"><span style="width:${Math.max(0, v / max * 100)}%"></span></div>`
  ).join("");
  const m = ev.matched || {};
  const matched = [
    m.tags_any && m.tags_any.length ? "tags: " + m.tags_any.join(", ") : "",
    m.tags_all && m.tags_all.length ? "all: " + m.tags_all.join(", ") : "",
    m.min_rating ? "min ★" + m.min_rating : "",
    "status: " + (m.status || "?"),
  ].filter(Boolean).join(" · ");
  return `<div><b>Score components</b></div>${bars}<div style="margin-top:6px">${esc(matched)}</div>`;
}

async function syncRule(ruleId) {
  toast("Syncing…");
  try { await api(`/api/playlists/${ruleId}/sync`, { method: "POST", body: "{}" }); toast("Synced to YTM ✓"); loadPlaylists(); }
  catch (err) { alert("Sync failed: " + err.message); }
}

async function deleteRule(ruleId) {
  if (!confirm("Delete this rule? (The YTM playlist itself is not deleted.)")) return;
  await api(`/api/playlists/${ruleId}`, { method: "DELETE" });
  loadPlaylists();
}

// ── Filters / tabs / boot ────────────────

// ── Library facets (2026-07-03): one row of tick-box dropdown filters replaces
//    the rating-chip row, flat tag-chip row and filterbar. Selected values live
//    as removable pills in the summary bar below. ──

const LIB_SORTS = [
  ["added_desc", "Added ↓"], ["added_asc", "Added ↑"], ["title", "Title"],
  ["artist", "Artist"], ["rating_desc", "Rating ↓"], ["duration_desc", "Duration ↓"],
];
const RATING_OPTS = [
  ["", "All"], ["4", "★★★★ Perfect"], ["3", "★★★ Love"],
  ["2", "★★ Really like"], ["1", "★ Like"], ["0", "Unrated"],
];
const FACET_LAYERS = [
  ["family", "Family"], ["subgenre", "Subgenre"], ["functional", "Functional"],
  ["personal", "Personal"], ["era", "Era"], ["other", "Other"],
];

// Name kept from the chip era — every tag-mutation path already calls this.
async function loadTagChips() {
  try { state.allTags = await api("/api/tags"); } catch (e) { state.allTags = []; }
  renderFacetRow(); renderSumBar();
}

async function loadSourcePlaylists() {
  try { state.sourcePlaylists = await api("/api/source-playlists"); } catch (e) {}
  renderFacetRow();
}

// Grand total for "showing X of Y" (changes only on ingest — fetched per visit).
async function loadGrandTotal() {
  try { state.grandTotal = (await api("/api/stats")).total_tracks; } catch (e) {}
  renderSumBar();
}

// Playlist dropdown ordering (client-side, kept from the old filterbar).
function sortedSourcePlaylists() {
  const s = state.playlistSort;
  const byName = (a, b) => a.playlist_name.localeCompare(b.playlist_name, undefined, { sensitivity: "base" });
  return state.sourcePlaylists.slice().sort((a, b) => {
    if (s === "name_desc") return byName(b, a);
    if (s === "tracks_asc") return (a.n - b.n) || byName(a, b);
    if (s === "tracks_desc") return (b.n - a.n) || byName(a, b);
    return byName(a, b);   // name_asc (default)
  });
}

function tagsByLayer() {
  const by = {};
  (state.allTags || []).forEach(t => {
    const l = t.layer || "other";
    (by[l] = by[l] || []).push(t);
  });
  return by;
}

function facetBtnHtml(id, label, on, badge) {
  return `<span class="facetwrap" data-facet="${esc(id)}">
    <button class="fbtn ${on ? "on" : ""}" onclick="toggleFacet('${esc(id)}')">${label}${
      badge ? ` <span class="fcnt">${badge}</span>` : ""} ▾</button></span>`;
}

function renderFacetRow() {
  const el = $("facetrow");
  const by = tagsByLayer();
  const ratingOn = state.untagged || state.dismissed || state.rating !== "";
  const ratingLabel = state.dismissed ? "Dismissed"
    : state.untagged ? "Untagged"
    : state.rating === "" ? "★ Rating"
    : (RATING_OPTS.find(o => o[0] === state.rating) || ["", "★ Rating"])[1];
  const pl = (state.sourcePlaylists || []).find(p => p.playlist_id === state.sourcePlaylist);
  let html = facetBtnHtml("rating", ratingLabel, ratingOn);
  for (const [layer, label] of FACET_LAYERS) {
    const items = by[layer] || [];
    if (!items.length) continue;   // e.g. no free-text tags → no "Other" button
    const nSel = items.filter(t => state.tags.includes(t.tag)).length;
    html += facetBtnHtml("layer:" + layer, label, nSel > 0, nSel || "");
  }
  html += facetBtnHtml("playlist", pl ? esc(pl.playlist_name) : "All playlists", !!state.sourcePlaylist);
  html += facetBtnHtml("sort", "Sort: " + (LIB_SORTS.find(s => s[0] === state.sort) || LIB_SORTS[0])[1],
                       state.sort !== "added_desc");
  html += `<button class="fbtn ${state.pendingVersions ? "on" : ""}"
    title="Only tracks with a playback-version awaiting review"
    onclick="state.pendingVersions=!state.pendingVersions;loadTracks();renderFacetRow()">⇱ Versions</button>`;
  el.innerHTML = html;
}

// One dropdown open at a time. Rebuilding the row on open/close keeps button
// labels + count badges honest without fighting the open panel.
function closeFacetDd(rerender = true) {
  document.querySelectorAll(".fdd").forEach(d => d.remove());
  if (rerender) renderFacetRow();
}
document.addEventListener("click", (e) => {
  if (!e.target.closest(".facetwrap") && document.querySelector(".fdd")) closeFacetDd();
});

function toggleFacet(id) {
  const wrap = document.querySelector(`.facetwrap[data-facet="${CSS.escape(id)}"]`);
  const wasOpen = wrap && wrap.querySelector(".fdd");
  closeFacetDd();
  if (wasOpen) return;
  const nw = document.querySelector(`.facetwrap[data-facet="${CSS.escape(id)}"]`);
  if (!nw) return;
  const dd = document.createElement("div");
  dd.className = "fdd";
  nw.appendChild(dd);
  renderFacetDd(dd, id);
}

function fddRow(dd, { sel, label, count, onPick }) {
  const r = document.createElement("div");
  r.className = "fddrow" + (sel ? " sel" : "");
  r.innerHTML = `<span class="bx">${sel ? "✓" : ""}</span><span class="n"></span>${
    count !== undefined ? `<span class="c">${count}</span>` : ""}`;
  r.querySelector(".n").textContent = label;
  r.onclick = (e) => { e.stopPropagation(); onPick(r); };
  dd.appendChild(r);
  return r;
}

function renderFacetDd(dd, id) {
  dd.innerHTML = "";
  if (id === "rating") {
    RATING_OPTS.forEach(([v, l]) => fddRow(dd, {
      sel: !state.untagged && !state.dismissed && state.rating === v, label: l,
      onPick: () => { state.rating = v; state.untagged = false; state.dismissed = false; loadTracks(); closeFacetDd(); },
    }));
    fddRow(dd, {
      sel: state.untagged, label: "Untagged — no tags yet",
      onPick: () => { state.untagged = !state.untagged; state.rating = ""; state.dismissed = false; loadTracks(); closeFacetDd(); },
    });
    // R11: "Not for me" verdicts are visible, not gone — each row restorable.
    fddRow(dd, {
      sel: state.dismissed, label: "Dismissed — 'not for me' verdicts",
      onPick: () => { state.dismissed = !state.dismissed; state.rating = ""; state.untagged = false; loadTracks(); closeFacetDd(); },
    });
    return;
  }
  if (id === "sort") {
    LIB_SORTS.forEach(([v, l]) => fddRow(dd, {
      sel: state.sort === v, label: l,
      onPick: () => { state.sort = v; loadTracks(); closeFacetDd(); },
    }));
    return;
  }
  if (id === "playlist") {
    const input = document.createElement("input");
    input.placeholder = "Filter playlists…";
    input.onclick = (e) => e.stopPropagation();
    dd.appendChild(input);
    const list = document.createElement("div");
    dd.appendChild(list);
    const renderList = () => {
      list.innerHTML = "";
      const q = input.value.trim().toLowerCase();
      fddRow(list, {
        sel: !state.sourcePlaylist, label: "All playlists",
        onPick: () => { state.sourcePlaylist = ""; loadTracks(); closeFacetDd(); },
      });
      const items = sortedSourcePlaylists().filter(p => !q || p.playlist_name.toLowerCase().includes(q));
      items.forEach(p => fddRow(list, {
        sel: state.sourcePlaylist === p.playlist_id, label: p.playlist_name, count: p.n,
        onPick: () => { state.sourcePlaylist = p.playlist_id; loadTracks(); closeFacetDd(); },
      }));
      if (!items.length) list.innerHTML = '<div class="fddempty">No playlists match.</div>';
    };
    input.oninput = renderList;
    renderList();
    setTimeout(() => input.focus(), 0);
    return;
  }
  if (id.startsWith("layer:")) {
    const layer = id.slice(6);
    const items = (tagsByLayer()[layer] || []);
    let input = null;
    if (items.length > 8) {
      input = document.createElement("input");
      input.placeholder = "Filter tags…";
      input.onclick = (e) => e.stopPropagation();
      dd.appendChild(input);
    }
    const list = document.createElement("div");
    dd.appendChild(list);
    const renderList = () => {
      list.innerHTML = "";
      const q = input ? input.value.trim().toLowerCase() : "";
      const shown = items.filter(t => !q || t.tag.includes(q));
      shown.forEach(t => fddRow(list, {
        sel: state.tags.includes(t.tag), label: t.tag, count: t.n,
        // Multi-select: toggle in place, keep the panel open for more ticks.
        onPick: (row) => {
          const i = state.tags.indexOf(t.tag);
          if (i >= 0) state.tags.splice(i, 1); else state.tags.push(t.tag);
          row.classList.toggle("sel");
          row.querySelector(".bx").textContent = row.classList.contains("sel") ? "✓" : "";
          loadTracks();
        },
      }));
      if (!shown.length) list.innerHTML = '<div class="fddempty">No tags match.</div>';
    };
    if (input) input.oninput = renderList;
    renderList();
    if (input) setTimeout(() => input.focus(), 0);
  }
}

function toggleTagMode() {
  state.tagMode = state.tagMode === "and" ? "or" : "and";
  loadTracks();
}

function removeTagFilter(tg) {
  const i = state.tags.indexOf(tg);
  if (i >= 0) state.tags.splice(i, 1);
  loadTracks(); renderFacetRow();
}

function libHasFilters() {
  return !!(state.q || state.tags.length || state.rating !== "" || state.untagged
            || state.sourcePlaylist || state.pendingVersions);
}

function clearAllFilters() {
  state.q = ""; $("search").value = "";
  state.rating = ""; state.untagged = false; state.tags = [];
  state.sourcePlaylist = ""; state.pendingVersions = false;
  loadTracks(); renderFacetRow();
}

function renderSumBar() {
  const el = $("sumbar");
  if (!el) return;
  const pills = [];
  const pill = (label, js) =>
    `<span class="spill" onclick="${js}" title="remove this filter">${label} ×</span>`;
  state.tags.forEach(tg => pills.push(pill(esc(tg), `removeTagFilter('${esc(tg)}')`)));
  if (state.tags.length >= 2)
    pills.push(`<button class="modebtn2" title="match all vs any of the selected tags" onclick="toggleTagMode()">${state.tagMode.toUpperCase()}</button>`);
  if (state.untagged)
    pills.push(pill("untagged", "state.untagged=false;loadTracks();renderFacetRow()"));
  else if (state.rating !== "")
    pills.push(pill(esc((RATING_OPTS.find(o => o[0] === state.rating) || [])[1] || ""), "state.rating='';loadTracks();renderFacetRow()"));
  const pl = (state.sourcePlaylists || []).find(p => p.playlist_id === state.sourcePlaylist);
  if (pl) pills.push(pill(esc(pl.playlist_name), "state.sourcePlaylist='';loadTracks();renderFacetRow()"));
  if (state.pendingVersions)
    pills.push(pill("⇱ versions", "state.pendingVersions=false;loadTracks();renderFacetRow()"));
  const grand = state.grandTotal || state.total;
  const count = libHasFilters()
    ? `Showing <b>${state.total}</b> of ${grand}`
    : `<b>${state.total || grand}</b> tracks`;
  el.innerHTML = `<span class="pills">${count}${pills.length ? " · " : ""}${pills.join(" ")}</span>${
    libHasFilters() ? '<button class="clearall" onclick="clearAllFilters()">× Clear all</button>' : ""}`;
}

let searchTimer;
$("search").addEventListener("input", (e) => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => { state.q = e.target.value.trim(); loadTracks(); }, 300);
});

// ── Home hub: playlist tree + node table + persistent queue (2026-07-03) ──
// Left: pinned-first playlist tree + smart views. Middle: the selected node's
// tracks, one compact row each. Right: THE queue — up-next and set-crate are
// one merged, server-persisted object.

async function loadHome() {
  loadTree();
  loadServerQueue();
  pollRemote();
  const saved = state.homeNode
    || JSON.parse(localStorage.getItem("homeNode") || "null")
    || { type: "recent" };
  selectNode(saved, false);
}

async function loadTree() {
  try { state.plTree = await api("/api/source-playlists"); }
  catch (e) { state.plTree = []; }
  renderTree();
}

const SMART_NODES = [
  { type: "recent", name: "Recent listens", icon: "ti-history" },
  { type: "gems",   name: "Forgotten gems", icon: "ti-diamond" },
];

function renderTree() {
  const pls = state.plTree || [];
  const pinnedCount = pls.filter(p => p.pinned).length;
  const cap = Math.max(8, pinnedCount);
  const shown = state.treeExpanded ? pls : pls.slice(0, cap);
  $("tree-playlists").innerHTML = shown.map((p, i) => {
    const active = state.homeNode && state.homeNode.type === "playlist"
      && state.homeNode.id === p.playlist_id;
    return `<div class="treeitem ${active ? "active" : ""}" onclick="selectPlaylistByIdx(${i})">
      <button class="pinbtn ${p.pinned ? "pinned" : ""}" onclick="event.stopPropagation();togglePinByIdx(${i})"
        title="${p.pinned ? "unpin from top" : "pin to top"}"><i class="ti ti-pin"></i></button>
      <span class="tname">${esc(p.playlist_name)}</span><span class="cnt">${p.n}</span>
    </div>`;
  }).join("") || '<div class="empty">No playlists ingested yet.</div>';
  const more = $("treemore");
  more.style.display = pls.length > cap ? "" : "none";
  more.textContent = state.treeExpanded ? "fewer playlists ▴" : `all playlists (${pls.length}) ▾`;
  $("tree-smart").innerHTML = SMART_NODES.map(s => {
    const active = state.homeNode && state.homeNode.type === s.type;
    return `<div class="treeitem ${active ? "active" : ""}" onclick="selectNode({type:'${s.type}'})">
      <i class="ti ${s.icon}"></i> <span class="tname">${s.name}</span></div>`;
  }).join("")
  + '<div class="treeitem ghost" title="New releases from watched labels, scored against your profiles — arrives with Stage 1 audio enrichment"><i class="ti ti-radar-2"></i> Discovery · stage 1</div>';
}

function toggleTreeMore() { state.treeExpanded = !state.treeExpanded; renderTree(); }
function selectPlaylistByIdx(i) {
  const p = (state.plTree || [])[i];
  if (p) selectNode({ type: "playlist", id: p.playlist_id, name: p.playlist_name });
}
async function togglePinByIdx(i) {
  const p = (state.plTree || [])[i];
  if (!p) return;
  await api(`/api/source-playlists/${encodeURIComponent(p.playlist_id)}/pin`,
    { method: p.pinned ? "DELETE" : "PUT" });
  await loadTree();
}

async function selectNode(node, save = true) {
  state.homeNode = node;
  if (save && node.type !== "search") localStorage.setItem("homeNode", JSON.stringify(node));
  renderTree();
  let tracks = [], title = "", sub = "";
  try {
    if (node.type === "playlist") {
      const d = await api(`/api/tracks?source_playlist=${encodeURIComponent(node.id)}&limit=500`);
      tracks = d.tracks; title = node.name || "Playlist";
    } else if (node.type === "recent") {
      const d = await api("/api/recent-listens?limit=40");
      tracks = d.listens || []; title = "Recent listens"; sub = "last 40 · newest first";
    } else if (node.type === "gems") {
      const d = await api("/api/forgotten-gems");
      tracks = d.tracks || []; title = "Forgotten gems"; sub = "loved, not heard in 6+ months";
    } else if (node.type === "search") {
      const d = await api(`/api/tracks?q=${encodeURIComponent(node.q)}&limit=200`);
      tracks = d.tracks; title = "Search";
      sub = `“${node.q}” · ${d.total} match${d.total === 1 ? "" : "es"}`;
    }
  } catch (e) { tracks = []; }
  state.homeTracks = tracks;
  state.tracks = tracks;   // playFromList/star toggles read the visible list
  state.midTitle = title; state.midSub = sub;
  renderMid();
}

function fmtDur(ms) {
  const m = Math.round(ms / 60000);
  return m >= 60 ? `${Math.floor(m / 60)} h ${m % 60} m` : `${m} m`;
}

function renderMid() {
  const tracks = state.homeTracks || [];
  $("mid-title").textContent = state.midTitle || "";
  const durMs = tracks.reduce((s, t) => s + (t.duration_ms || 0), 0);
  $("mid-sub").textContent = state.midSub
    || (tracks.length ? `${tracks.length} tracks${durMs ? " · " + fmtDur(durMs) : ""}` : "");
  $("mid-playall").style.display = tracks.some(playableId) ? "" : "none";
  $("mid-rows").innerHTML = tracks.map(midRow).join("")
    || '<div class="empty">Nothing here yet.</div>';
  highlightPlaying(currentPlayingPk());
}

// DJ readout: BPM · Camelot key · energy (E0–E10). Data arrives with Stage 1
// audio enrichment — until then the slot renders as a dim placeholder, so the
// mix-relevant column exists from day one and simply fills in.
function djReadout(t) {
  const has = t.bpm != null || t.camelot_key || t.energy != null;
  if (!has) return '<span class="dj dim" title="BPM · Camelot key · energy — fills in when Stage 1 audio analysis runs">– · – · –</span>';
  const e = t.energy != null ? "E" + Math.round(t.energy * 10) : "–";
  return `<span class="dj" title="BPM · Camelot key · energy">${
    t.bpm != null ? Math.round(t.bpm) : "–"} · ${esc(t.camelot_key || "–")} · ${e}</span>`;
}

function midRow(t) {
  const ext = t.playback_video_id
    ? ' <span style="color:var(--accent);font-size:10px" title="plays a set extended/video version">ext</span>' : "";
  return `<div class="midrow" id="mr-${t.track_pk}">
    <button class="playbtn" ${playableId(t) ? "" : "disabled"} onclick="playFromList('${t.track_pk}')" title="Play from here"><i class="ti ti-player-play"></i></button>
    <span class="m">${esc(t.canonical_title)}${ext} <span class="a">· ${esc(t.canonical_artist)}</span></span>
    ${djReadout(t)}
    ${starButtons(t)}
    <button class="mic" onclick="queueAdd('${t.track_pk}')" title="Add to queue"><i class="ti ti-circle-plus"></i></button>
    <button class="mic" onclick="trackMenu('${t.track_pk}')" title="more"><i class="ti ti-dots"></i></button>
  </div>`;
}

function playAllMid() {
  const first = (state.homeTracks || []).find(playableId);
  if (first) playFromList(first.track_pk);
}

// ── The queue (= set crate). Server-persisted; survives sessions. ──
async function loadServerQueue() {
  try {
    const d = await api("/api/queue");
    state.pq = d.queue || [];
    state.qMirror = d.mirror || null;
  } catch (e) { state.pq = []; }
  renderQueue();
}

function renderQueue() {
  const pq = state.pq || [];
  const durMs = pq.reduce((s, t) => s + (t.duration_ms || 0), 0);
  $("q-meta").textContent = pq.length ? `· ${pq.length}${durMs ? " · " + fmtDur(durMs) : ""}` : "";
  const cur = currentPlayingPk();
  $("q-rows").innerHTML = pq.map((t, i) => `
    <div class="qrow ${t.track_pk === cur ? "current" : ""}" onclick="playQueueFrom(${i})" title="Play from here">
      <div class="qm"><div class="qt">${esc(t.canonical_title)}</div>
        <div class="qa">${esc(t.canonical_artist)}${t.duration_ms ? " · " + fmtTime(t.duration_ms / 1000) : ""}</div></div>
      <button class="qx" onclick="event.stopPropagation();queueRemove(${i})" title="Remove from queue"><i class="ti ti-x"></i></button>
    </div>`).join("");
}

async function queueSave() {
  if (!(state.pq || []).length) { toast("Queue is empty"); return; }
  const def = (state.qMirror && state.qMirror.playlist_name) || "Set Crate";
  const name = prompt(
    "Save queue to a YTM playlist (re-saving updates the same playlist):\n\n" +
    "Heads-up: YTM may swap extended versions to the audio version inside " +
    "native playlists. In-app playback keeps your pinned versions.", def);
  if (name === null) return;
  toast("Saving to YTM…");
  try {
    const r = await api("/api/queue/save", { method: "POST", body: JSON.stringify({ name }) });
    state.qMirror = { playlist_id: r.playlist_id, playlist_name: r.playlist_name };
    toast(`Saved ${r.count} tracks → "${r.playlist_name}"`);
  } catch (e) { toast(`Save failed: ${e.message}`); }
}

function persistQueue() {
  api("/api/queue", {
    method: "PUT",
    body: JSON.stringify({ track_pks: (state.pq || []).map(t => t.track_pk) }),
  }).catch(() => {});
}

async function queueAdd(pk) {
  if ((state.pq || []).some(x => x.track_pk === pk)) { toast("Already in queue"); return; }
  let t = (state.homeTracks || []).find(x => x.track_pk === pk)
       || (state.tracks || []).find(x => x.track_pk === pk);
  if (!t) { try { t = await api(`/api/tracks/${pk}`); } catch (e) { return; } }
  state.pq.push(t); persistQueue(); renderQueue();
  toast("Added to queue");
}
function queueRemove(i) { state.pq.splice(i, 1); persistQueue(); renderQueue(); }
function clearQueue() {
  if (!(state.pq || []).length) return;
  state.pq = []; persistQueue(); renderQueue();
}
function qItem(t) {
  return { videoId: playableId(t), label: `${t.canonical_artist} — ${t.canonical_title}`,
           pk: t.track_pk, ext: !!t.playback_video_id };
}
function playQueueFrom(i) {
  const pq = state.pq || [];
  if (!pq[i]) return;
  const playable = pq.filter(playableId);
  const idx = playable.findIndex(t => t.track_pk === pq[i].track_pk);
  if (idx < 0) { toast("No playable version for this track"); return; }
  _startQueue(playable.map(qItem), idx);
}
function currentPlayingPk() {
  return (state.queue && state.qIndex >= 0 && state.queue[state.qIndex])
    ? state.queue[state.qIndex].pk : null;
}

// ── Remote-listening strip: what the phone (ListenBrainz) is playing, shown
//    only while the local player is idle. Zero height otherwise. ──
async function pollRemote() {
  const el = $("remotestrip");
  try {
    const np = await api("/api/now-playing");
    const localActive = typeof YT !== "undefined" && ytReady && ytPlayer.getPlayerState
      && [YT.PlayerState.PLAYING, YT.PlayerState.PAUSED, YT.PlayerState.BUFFERING]
          .includes(ytPlayer.getPlayerState());
    if (np.playing && !localActive) {
      const p = np.playing, t = p.track;
      el.innerHTML = `<span>📱</span><span style="color:var(--dim)">Listening on phone:</span>
        <b style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(t ? t.canonical_title : p.track_name || "")}
          <span style="color:var(--dim);font-weight:400">· ${esc(t ? t.canonical_artist : p.artist_name || "")}</span></b>
        ${t ? starButtons(t) : '<span style="color:var(--dim);font-size:11px">not in library yet</span>'}`;
      el.classList.add("on");
    } else { el.classList.remove("on"); el.innerHTML = ""; }
  } catch (e) { el.classList.remove("on"); el.innerHTML = ""; }
}

let npTimer;
function startHomePolling() {
  stopHomePolling();
  npTimer = setInterval(() => { if (!document.hidden && state.view === "home") pollRemote(); }, 15000);
}
function stopHomePolling() { if (npTimer) clearInterval(npTimer); npTimer = null; }
document.addEventListener("visibilitychange", () => {
  if (document.hidden) stopHomePolling();
  else if (state.view === "home") { pollRemote(); startHomePolling(); }
});

let homeSearchTimer;
$("homesearch").addEventListener("input", (e) => {
  clearTimeout(homeSearchTimer);
  homeSearchTimer = setTimeout(() => {
    const q = e.target.value.trim();
    if (q) selectNode({ type: "search", q }, false);
    else selectNode(JSON.parse(localStorage.getItem("homeNode") || "null") || { type: "recent" }, false);
  }, 300);
});

// ── Badges: Review remaining count + Matches pending-pairs count ──
async function refreshBadges() {
  try {
    const q = await api("/api/verdict/queue?limit=1&sort=newest");
    const badge = $("reviewbadge"), n = (q.meta || {}).eligible_total || 0;
    if (n) { badge.textContent = n; badge.style.display = ""; }
    else badge.style.display = "none";
  } catch (e) {}
  try {
    const pairs = await api("/api/dedup");
    const badge = $("matchesbadge");
    if (pairs.length) { badge.textContent = pairs.length; badge.style.display = ""; }
    else badge.style.display = "none";
  } catch (e) {}
}

// ── Matches: sub-tabs (Duplicates / Removed) — the dedup/match review queue ──
async function loadMatches() {
  state.reviewPairs = await api("/api/dedup").catch(() => []);
  const badge = $("matchesbadge");
  if (state.reviewPairs.length) { badge.textContent = state.reviewPairs.length; badge.style.display = ""; }
  else badge.style.display = "none";
  const sub = state.matchesSub || "duplicates";
  $("matches").innerHTML = `<nav class="subtabs">
      <button id="sub-dup" class="${sub === "duplicates" ? "active" : ""}">Duplicates${state.reviewPairs.length ? ` <span class="badge">${state.reviewPairs.length}</span>` : ""}</button>
      <button id="sub-rem" class="${sub === "removed" ? "active" : ""}">Removed</button>
    </nav><div id="subcontent"></div>`;
  $("sub-dup").onclick = () => { state.matchesSub = "duplicates"; loadMatches(); };
  $("sub-rem").onclick = () => { state.matchesSub = "removed"; loadMatches(); };
  if (sub === "duplicates") renderDuplicates();
  else loadRemoved();
}

function renderDuplicates() {
  const pairs = state.reviewPairs || [];
  $("subcontent").innerHTML = pairs.length ? pairs.map(p => {
    const side = (t) => t ? `<div style="flex:1;min-width:0">
        <div class="title">${esc(t.canonical_title)}</div>
        <div class="artist">${esc(t.canonical_artist)}${t.album_title ? " · " + esc(t.album_title) : ""}</div>
        <div class="health">${t.match_status} · ${t.duration_ms ? Math.round(t.duration_ms/1000)+"s" : "?"} · ${t.personal_rating ? "★".repeat(t.personal_rating) : "unrated"}</div>
      </div>` : "<div>(missing)</div>";
    return `<div class="pl">
      <div class="sub">Possible duplicate · ${esc(p.reason || "")}${p.duration_delta_ms != null ? " · Δ" + p.duration_delta_ms + "ms" : ""}</div>
      <div style="display:flex;gap:10px;margin-bottom:10px">${side(p.track_a)}${side(p.track_b)}</div>
      <div class="actions">
        <button class="primary" onclick="mergePair(${p.id})">Merge (keep older)</button>
        <button onclick="dismissPair(${p.id})">Not a duplicate</button>
      </div>
    </div>`;
  }).join("") : '<div class="empty">No pending duplicate pairs.</div>';
}

async function loadRemoved() {
  let removals = [];
  try { removals = await api("/api/removals?days=14"); } catch (e) {}
  $("subcontent").innerHTML = removals.length
    ? `<div class="stats">Removed from your YTM playlists in the last 14 days — tap Re-add to put one back.</div>`
      + removals.map(rm => `<div class="pl">
          <div class="name">${esc(rm.track_title || rm.track_pk)}</div>
          <div class="sub">${esc(rm.track_artist || "")} · removed from <b style="color:#6fb6d6">${esc(rm.playlist_name)}</b>${rm.kind === "all" ? " (remove-all)" : ""} · ${rm.removed_at.slice(0,16).replace("T"," ")}</div>
          <div class="actions"><button class="primary" onclick="undoRemoval(${rm.id})">Re-add</button></div>
        </div>`).join("")
    : '<div class="empty">Nothing removed in the last 14 days.</div>';
}

async function undoRemoval(id) {
  toast("Re-adding…");
  try { await api(`/api/removals/${id}/undo`, { method: "POST", body: "{}" }); toast("Re-added ✓"); loadRemoved(); }
  catch (e) { alert("Re-add failed: " + e.message); }
}

async function mergePair(id) {
  if (!confirm("Merge these two tracks? The newer one is folded into the older.")) return;
  await api(`/api/dedup/${id}/merge`, { method: "POST", body: "{}" });
  toast("Merged"); loadMatches();
}
async function dismissPair(id) {
  await api(`/api/dedup/${id}/dismiss`, { method: "POST", body: "{}" });
  loadMatches();
}

// ── Tags admin: suggestions queue + read-only vocabulary + hide/alias list ──
function vocabRowsHtml(rows) {
  return rows.length ? rows.map(v => `
    <div class="vocab ${v.hidden ? "hidden-tag" : ""}">
      <div class="vname">${esc(v.tag)} <span class="vn">${v.n}</span>${v.alias_to ? ` <span class="alias">→ ${esc(v.alias_to)}</span>` : ""}</div>
      ${v.layer ? `<span class="vlayer" title="this tag is a vocabulary profile">${esc(v.layer)}</span>` : ""}
      ${v.manual ? '<span class="vlayer manual" title="applied by hand on ≥1 track">manual</span>' : ""}
      <button class="vbtn ${v.hidden ? "on" : ""}" onclick="toggleHide('${esc(v.tag)}', ${v.hidden ? 0 : 1})">${v.hidden ? "Hidden" : "Hide"}</button>
      <button class="vbtn" onclick="aliasTag('${esc(v.tag)}')">${v.alias_to ? "Re-alias" : "Alias"}</button>
    </div>`).join("") : '<div class="empty">No tags match.</div>';
}

// New-subgenre suggestions the nightly extraction proposed (per-family tier
// quota). Approve = becomes a real subgenre profile (survives deploys);
// reject = never suggested again.
function suggRowsHtml(rows) {
  return rows.map(s => `
    <div class="sugg" id="sugg-${s.suggestion_id}">
      <div class="sname">${esc(s.tag)} <span class="sn">${s.track_count} tracks</span>
        ${s.family ? ` <span class="sfam">${esc(s.family)}</span>` : ""}
        ${s.was_alias_to ? ` <span class="salias" title="the vocab lock folds this tag into ‘${esc(s.was_alias_to)}’ — approving removes that fold">currently folded → ${esc(s.was_alias_to)}</span>` : ""}</div>
      <button class="sbtn ok" onclick="decideSuggestion(${s.suggestion_id}, 'approve')">✓ Add</button>
      <button class="sbtn" onclick="decideSuggestion(${s.suggestion_id}, 'reject')">✕</button>
    </div>`).join("");
}

// Display order for the read-only vocabulary section (differs from the
// tap-palette's LAYER_ORDER: browsing reads set-arc → moments → genres).
const VOCAB_LAYER_ORDER = ["functional", "personal", "family", "subgenre", "era"];
function vocabProfilesHtml(profiles) {
  return VOCAB_LAYER_ORDER.map(layer => {
    const ps = profiles.filter(p => p.taxonomy_layer === layer);
    if (!ps.length) return "";
    return `<div class="vsec">${layer} · ${ps.length}</div>
      <div class="vprof">${ps.map(p =>
        `<span class="vp ${p.origin === "user_approved" ? "userok" : ""}"
               title="${esc(p.description || "")}${p.origin === "user_approved" ? " (added by you via suggestions)" : ""}">${esc(p.tag_name)} <span class="vpn">${p.n}</span></span>`).join("")}</div>`;
  }).join("");
}

async function loadTags() {
  const [sugg, profiles, vocab] = await Promise.all([
    api("/api/vocab-suggestions"), api("/api/vocabulary/profiles"), api("/api/vocabulary"),
  ]);
  state.vocab = vocab;
  $("tags").innerHTML =
    `${sugg.suggestions.length ? `<div class="vsec">Suggested subgenres · ${sugg.suggestions.length}</div>
        <div class="stats">Your library's coverage earned these candidate slots. ✓ Add makes it a real subgenre; ✕ hides it forever.</div>
        <div id="sugglist">${suggRowsHtml(sugg.suggestions)}</div>`
      : '<div class="vsec">Suggested subgenres</div><div class="stats" id="sugglist-empty">None pending. New candidates appear as your library and tagging grow.</div>'}
     <button class="scanbtn" onclick="rescanVocab(this)">⟳ Scan library for candidates now</button>
     <div class="vsec">Vocabulary</div>
     <div class="stats">The tagging vocabulary, grouped by layer. Additions arrive via suggestions above; renames stay locked.</div>
     ${vocabProfilesHtml(profiles)}
     <div class="vsec">All raw tags</div>
     <div class="stats">${state.vocab.length} distinct tags · "Hide" removes a tag everywhere; "Alias" merges a spelling variant into another tag.</div>
     <input class="vocabsearch" id="vocabsearch" placeholder="Filter tags…" autocomplete="off" autocapitalize="none">
     <div id="vocablist">${vocabRowsHtml(state.vocab.slice(0, 250))}</div>`;
  $("vocabsearch").oninput = (e) => {
    const f = e.target.value.trim().toLowerCase();
    const rows = (f ? state.vocab.filter(v => v.tag.includes(f)) : state.vocab).slice(0, 250);
    $("vocablist").innerHTML = vocabRowsHtml(rows);
  };
}

async function decideSuggestion(id, action) {
  try {
    const r = await api(`/api/vocab-suggestions/${id}/${action}`, { method: "POST", body: "{}" });
    toast(action === "approve" ? `Added “${r.tag}” to the vocabulary ✓` : `Rejected — won't suggest again`);
  } catch (e) { toast(e.message || "Couldn't save"); }
  await loadTags(); loadTagChips();
}

async function rescanVocab(btn) {
  btn.disabled = true; btn.textContent = "Scanning…";
  try {
    const r = await api("/api/vocab-suggestions/recompute", { method: "POST", body: "{}" });
    toast(r.new.length ? `${r.new.length} new suggestion${r.new.length > 1 ? "s" : ""}` : "No new candidates right now");
  } catch (e) { toast(e.message || "Scan failed"); }
  await loadTags();
}

async function toggleHide(tag, hidden) {
  await api(`/api/vocabulary/${encodeURIComponent(tag)}`, { method: "PUT", body: JSON.stringify({ hidden: !!hidden }) });
  toast(hidden ? `Hidden: ${tag}` : `Shown: ${tag}`);
  await loadTags(); loadTagChips();
}

async function aliasTag(tag) {
  const target = prompt(`Merge "${tag}" into which tag?\nType an existing tag name, or leave blank to clear.`, "");
  if (target === null) return;
  await api(`/api/vocabulary/${encodeURIComponent(tag)}`, { method: "PUT", body: JSON.stringify({ alias_to: target.trim() || null }) });
  toast(target.trim() ? `${tag} → ${target.trim().toLowerCase()}` : "Alias cleared");
  await loadTags(); loadTagChips();
}

$("tab-library").onclick = () => switchView("library");
$("tab-review").onclick = () => switchView("review");
$("tab-playlists").onclick = () => switchView("playlists");

  const r = e.currentTarget.getBoundingClientRect();
  ytPlayer.seekTo(((e.clientX - r.left) / r.width) * (ytPlayer.getDuration() || 0), true);

const VIEWS = ["home", "library", "review", "playlists", "matches", "tags", "training"];
function switchView(v) {
  state.view = v;
  VIEWS.forEach(name => {
    $(name).style.display = name === v ? "" : "none";
    const tab = $("tab-" + name);
    if (tab) tab.classList.toggle("active", name === v);
  });
  // Library-only header controls: search, facet row, summary bar.
  // The ⟳ reload button stays visible on every tab.
  const lib = v === "library";
  $("search").style.display = lib ? "" : "none";
  $("facetrow").style.display = lib ? "" : "none";
  $("sumbar").style.display = lib ? "" : "none";
  // Home-only compact search. The player hero renders only on Home — on
  // other tabs it's hidden but audio keeps playing (locked decision).
  $("homesearch").style.display = v === "home" ? "" : "none";
  $("playerbar").classList.toggle("hero-mode", v === "home");
  if (v === "home") { loadHome(); startHomePolling(); } else { stopHomePolling(); }
  if (v === "library") { loadTracks(); loadSourcePlaylists(); loadGrandTotal(); renderFacetRow(); }
  if (v === "review") loadVerdict();
  if (v === "playlists") loadPlaylists();
  if (v === "matches") loadMatches();
  if (v === "tags") loadTags();
  if (v === "training") loadTraining();
}

// ── Training view: per-profile progress toward the kNN auto-apply gate ──
// Each profile needs 15 positives, 15 negatives-or-near-misses, and 3 distinct
// artists among its positives before it can auto-classify. All derived from
// your tags — this is just the read-out.
async function loadTraining() {
  const el = $("training");
  el.innerHTML = '<div class="trainhead">Loading…</div>';
  let data;
  try { data = await api("/api/reference/readiness"); }
  catch (e) { el.innerHTML = '<div class="empty">Couldn\'t load training status.</div>'; return; }
  const profiles = data.profiles || [];
  const ready = profiles.filter(p => p.ready).length;
  const anyData = profiles.some(p => p.positive || p.negative_plus_near_miss);

  const bar = (label, have, need) => {
    const pct = Math.min(100, Math.round((have / need) * 100));
    const done = have >= need;
    return `<div class="pbar">
      <div class="plabel"><span>${label}</span><span>${have} / ${need}</span></div>
      <div class="ptrack"><div class="pfill ${done ? "done" : ""}" style="width:${pct}%"></div></div>
    </div>`;
  };

  const cards = profiles.map(p => {
    const pill = p.ready
      ? '<span class="pill ready">✓ ready</span>'
      : `<span class="pill wip">in progress</span>`;
    return `<div class="pcard">
      <div class="ptop"><span class="pname">${esc(p.profile_id)}</span>${pill}</div>
      ${bar("Positives", p.positive, 15)}
      ${bar("Negatives + near-miss", p.negative_plus_near_miss, 15)}
      ${bar("Distinct artists", p.distinct_positive_artists, 3)}
    </div>`;
  }).join("");

  const intro = anyData
    ? `<b>${ready}</b> of ${profiles.length} profiles ready to auto-classify.`
    : `No examples yet. Open a track, hit <b>+ tag</b>, and tap a profile chip — these bars fill in as you go. Each profile needs 15 positives, 15 negatives/near-misses, and 3 different artists.`;
  el.innerHTML = `<div class="trainhead">${intro}</div>${cards}`;
}

// ── Review: one queue, two sort lenses. One listen → rating + tags + cull. ──
// Refined 2026-07-03 (CLAUDE-CODE-HANDOFF-review-refinement.md / REVIEW-MOCKUP.html):
// compact card with triage demoted to the header, set-order chips with hotkeys,
// skim controls, playlist filter + up-next rail, Later counter with 14-day
// auto-return, empty-commit guard, undo for every verdict, a closest-to-ready
// panel and a this-session log. A card retires on commit, dismiss, or skip —
// never on rating alone.

const VQ_FKEYS = ["q", "w", "e", "r", "t", "y", "u", "i"];   // functional chips, set order
const VQ_PKEYS = ["a", "s", "d", "f", "g", "h", "j"];        // personal chips, display order
const VQ_EKEYS = ["7", "8", "9", "0", "-"];                  // era chips — number row, decade order

async function loadVerdict() {
  const el = $("review");
  if (!state.vqProfiles) {
    try {
      const d = await api("/api/reference/profiles");
      state.vqProfiles = d.profiles || []; state.vqTiebreakers = d.tiebreakers || [];
    } catch (e) { state.vqProfiles = []; state.vqTiebreakers = []; }
  }
  if (!state.sourcePlaylists.length) {
    try { state.sourcePlaylists = await api("/api/source-playlists"); } catch (e) {}
  }
  el.innerHTML = '<div class="vq-strip">Loading queue…</div>';
  try {
    const p = new URLSearchParams({ limit: 20, sort: state.reviewSort });
    if (state.vqPlFilter) p.set("source_playlist", state.vqPlFilter);
    const [q, r] = await Promise.all([
      api(`/api/verdict/queue?${p}`),
      api("/api/reference/readiness"),
    ]);
    state.vq = q.tracks || []; state.vqMeta = q.meta || {}; state.vqIndex = 0;
    state.vqReadiness = r.profiles || [];
  } catch (e) { el.innerHTML = '<div class="empty">Couldn\'t load the queue.</div>'; return; }
  renderVerdict();
  vqStartClock();
}

function setReviewSort(s) {
  if (s === state.reviewSort) return;
  state.reviewSort = s; localStorage.setItem("reviewSort", s);
  loadVerdict();
}

function vqSetPlaylist(v) {
  state.vqPlFilter = v; localStorage.setItem("reviewPlaylist", v);
  loadVerdict();
}

function vqStrip() {
  const lens = `<span class="vq-lens">
    <button class="${state.reviewSort === "newest" ? "on" : ""}" onclick="setReviewSort('newest')" title="unrated tracks, newest first — drain to zero">Newest</button>
    <button class="${state.reviewSort === "training" ? "on" : ""}" onclick="setReviewSort('training')" title="tracks whose verdict most advances a profile">Training</button></span>`;
  const plOpts = ['<option value="">All playlists</option>']
    .concat(sortedSourcePlaylists().map(p =>
      `<option value="${esc(p.playlist_id)}" ${state.vqPlFilter === p.playlist_id ? "selected" : ""}>${esc(p.playlist_name)}</option>`))
    .join("");
  const plSel = `<select onchange="vqSetPlaylist(this.value)" title="judge only tracks in this YTM playlist — counts follow the filter">${plOpts}</select>`;
  const prof = state.vqReadiness || [];
  const ready = `<span title="profiles with enough training data to auto-classify">ready <b>${prof.filter(x => x.ready).length}</b>/${prof.length}</span>`;
  const sess = `<span title="verdicts this sitting — resets on reload">session: <b>${state.vqSession.length}</b> judged</span>`;
  const skipped = (state.vqMeta || {}).skipped_total || 0;
  const later = skipped ? `<span title="tracks deferred with Later — they auto-return after 14 days">Later: <b>${skipped}</b> · <a class="laterlink" onclick="vqUnskipAll()">re-serve</a></span>` : "";
  const left = state.vqMeta ? (state.vqMeta.eligible_total || 0) : 0;
  const count = state.reviewSort === "newest"
    ? `<span title="tracks with no rating yet under the current filter — the inbox denominator"><b>${left}</b> unrated</span>`
    : `<span title="tracks eligible for judging under the current filter — excludes dismissed, deferred and already-answered tracks"><b>${left}</b> judgeable</span>`;
  return `<div class="vq-strip">${lens}${plSel}${ready}${sess}<span class="spacer"></span>${later}${count}</div>`;
}

function vqProfilesByLayer(layer) {
  // API order = tag_profiles.sort_order — functional arrives in SET order.
  return (state.vqProfiles || []).filter(p => p.taxonomy_layer === layer);
}

function renderVerdict() {
  const el = $("review");
  if (state.vqIndex >= state.vq.length) {
    if (state.vq.length && state.vqMeta && state.vqMeta.eligible_total > state.vq.length) {
      loadVerdict(); return;   // fetch a fresh batch (judged tracks won't return)
    }
    el.innerHTML = vqStrip()
      + `<div class="empty">${state.reviewSort === "newest"
            ? "Review zero ✓ — nothing needs a first listen."
            : "Nothing left to judge here. 🎉"}<br>`
      + '<span class="vq-note"><a onclick="vqUnskipAll()">Re-serve tracks marked Later</a></span></div>'
      + vqSessionLogHtml();
    return;
  }
  const t = state.vq[state.vqIndex];
  // Era arrives PREFILLED from the release decade (CARD-WEIGHT RULE:
  // confirm-or-correct, never choose-from-five). Committing the card confirms
  // it; clearing the chip = no era claim.
  if (!t._sel) t._sel = { func: null, personal: new Set(), era: t.era_prefill || null, accepted: new Set(), rejected: new Set() };
  state.vqRevealed = false;

  const existing = (t.tags || []).map(g =>
    `<span class="tag ${g.tag_type === "private_manual" ? "manual" : ""}">${esc(g.tag)}</span>`).join("");
  // R10: playlist chips are actionable — same removal + undo path as Library.
  const plchips = (t.playlists || []).map(p =>
    `<span class="plchip"><span class="plname">${esc(p.playlist_name)}</span>
       <button class="plx" title="remove from this playlist on YTM" onclick="vqRemovePl('${t.pk}','${esc(p.playlist_id)}')">×</button></span>`).join("");

  // Suggestions — the section collapses entirely when empty (R1); it returns
  // by itself as enrichment data arrives.
  const sugg = (t.suggestions || []);
  let suggBlock = "";
  if (sugg.length) {
    const suggHtml = sugg.map((s, i) => {
      const acc = t._sel.accepted.has(s.profile_id);
      const rej = t._sel.rejected.has(s.profile_id);
      const ev = (s.evidence || []).map(e => `<span>${esc(e)}</span>`).join("");
      return `<div class="vq-scard ${acc ? "accepted" : ""} ${rej ? "rejected" : ""}">
        <div class="vq-srow">
          <span class="vq-skey">${i + 1}</span>
          <span class="vq-sname">${esc(s.tag_name)}</span>
          <span class="vq-slayer">${esc(s.taxonomy_layer)}</span>
          <button class="vq-sbtn yes ${acc ? "on" : ""}" onclick="vqAccept(${i})">✓ yes</button>
          <button class="vq-sbtn no ${rej ? "on" : ""}" onclick="vqReject(${i})">✕ no</button>
        </div>
        ${ev ? `<div class="vq-ev">${ev}</div>` : ""}
      </div>`;
    }).join("");
    const blur = state.vqGuessFirst ? "blurred" : "";
    const revealBtn = state.vqGuessFirst
      ? '<div class="vq-reveal" onclick="vqReveal()">👂 Guess first — tap or press <b>b</b> to reveal suggestions</div>' : "";
    suggBlock = `<div class="vq-seclbl">Suggestions <span class="vq-skiphint">1/2/3 = yes · ⇧1/2/3 = no</span></div>
      ${revealBtn}<div class="vq-sugg ${blur}">${suggHtml}</div>`;
  }

  const funcChips = vqProfilesByLayer("functional").map((p, i) =>
    `<span class="vq-chip ${t._sel.func === p.tag_name ? "on" : ""}" title="${esc(p.description || "")}" onclick="vqPickFunc('${esc(p.tag_name)}')"><kbd class="vqk">${VQ_FKEYS[i] || ""}</kbd>${esc(p.tag_name)}</span>`).join("");
  const persChips = vqProfilesByLayer("personal").map((p, i) =>
    `<span class="vq-chip ${t._sel.personal.has(p.tag_name) ? "on" : ""}" title="${esc(p.description || "")}" onclick="vqTogglePersonal('${esc(p.tag_name)}')"><kbd class="vqk">${VQ_PKEYS[i] || ""}</kbd>${esc(p.tag_name)}</span>`).join("");
  const eraChips = vqProfilesByLayer("era").map((p, i) =>
    `<span class="vq-chip ${t._sel.era === p.tag_name ? "on" : ""}" title="${esc(p.description || "")}" onclick="vqPickEra('${esc(p.tag_name)}')"><kbd class="vqk">${VQ_EKEYS[i] || ""}</kbd>${esc(p.tag_name)}</span>`).join("");
  const eraHint = t.era_prefill
    ? (t.release_year ? `prefilled from ${t.release_year} — correct if vibe ≠ date, tap again to clear`
                      : "prefilled from weak evidence — correct or tap again to clear")
    : "single · sounds-like, not release date · optional";

  const r = t.personal_rating || 0;
  const ratingStars = [1, 2, 3, 4].map(i =>
    `<button class="${i <= r ? "lit" : ""}" onclick="vqRate(${i})" title="${i}★ (${"zxcv"[i - 1]})">★</button>`).join("");

  el.innerHTML = vqStrip() + `<div class="vq-wrap"><div><div class="vq-card">
    <div class="vq-head">
      <button class="vq-play" onclick="vqPlay()" title="Play (space)">▶</button>
      <div style="min-width:0">
        <div class="vq-title">${esc(t.title || "Untitled")}</div>
        <div class="vq-artist">${esc(t.artist || "")}</div>
        ${t.album ? `<div class="vq-album">${esc(t.album)}</div>` : ""}
        <div class="vq-time" id="vq-time">${t.duration_ms ? "0:00 / " + fmtDurMs(t.duration_ms) : ""}</div>
      </div>
      <div class="vq-headright">
        <div class="vq-htriage">
          <button class="nfm" onclick="vqDismiss()" title="stop showing me this — recoverable under Library → Dismissed (n)"><kbd class="vqk">n</kbd>✗ Not for me</button>
          <button onclick="vqSkip()" title="defer — auto-returns after 14 days (m)"><kbd class="vqk">m</kbd>→ Later</button>
          <button onclick="trackMenu('${t.pk}')" title="more (block, don't recommend, cull, versions…)">⋯</button>
        </div>
        <div class="plrow">${plchips}</div>
      </div>
    </div>
    ${existing ? `<div class="vq-existing">${existing}</div>` : ""}

    <div class="vq-pbar">
      <div class="vq-ptrack" onclick="vqSeekClick(event)" title="click to seek"><div class="vq-pfill" id="vq-pfill"></div></div>
      <div class="vq-pquarters" title="↑/↓ jump between quarters · ←/→ seek ±30s"><span>intro</span><span>25%</span><span>50%</span><span>75%</span><span>outro</span></div>
    </div>

    <div class="vq-seclbl">Rating <span class="vq-skiphint">z/x/c/v = 1–4★ · same again clears</span></div>
    <div class="vq-stars">${ratingStars}</div>

    <div class="vq-qgrid">
      <div>
        <div class="vq-seclbl">Where in a set? <span class="vq-help" onclick="vqShowTiebreakers()" title="tie-breaker rules">?</span><span class="vq-skiphint">single · set order</span></div>
        <div class="vq-chips">${funcChips}</div>
      </div>
      <div>
        <div class="vq-seclbl">Life context?<span class="vq-skiphint">multi</span></div>
        <div class="vq-chips">${persChips}</div>
      </div>
    </div>

    ${eraChips ? `<div class="vq-seclbl">Era? <span class="vq-skiphint">${esc(eraHint)}</span></div>
    <div class="vq-chips">${eraChips}</div>` : ""}

    ${suggBlock}

    <div class="vq-footer">
      <label class="vq-toggle"><input type="checkbox" ${state.vqGuessFirst ? "checked" : ""} onchange="vqToggleGuess(this.checked)"> Guess-first (hide suggestions until revealed)</label>
      <button class="commitbtn" onclick="vqCommit()" title="apply rating + chips and move on (⏎)">Commit &amp; next ⏎</button>
    </div>
  </div>${vqSessionLogHtml()}</div>
  <div class="vq-railcol">${vqRailHtml()}${vqReadyPanelHtml()}</div></div>`;

  // Auto-play so you can judge by ear immediately — but only when the CARD
  // changed. Re-renders from rating/chip taps must not restart the track.
  if (!state.isMobile && state.vqPlayedPk !== t.pk) {
    state.vqPlayedPk = t.pk;
    vqPlay();
  }
}

// ── Up-next rail (R5): peek + jump + dismiss-without-listening ──
function vqRailHtml() {
  const next = state.vq.slice(state.vqIndex + 1, state.vqIndex + 11);
  const rows = next.map((t, i) => {
    const abs = state.vqIndex + 1 + i;
    return `<div class="vq-row" onclick="vqJump(${abs})" title="jump the card to this track">
      <div class="t"><span class="n">${esc(t.title)}</span><span class="a">${esc(t.artist)}</span></div>
      <span class="d">${t.duration_ms ? fmtDurMs(t.duration_ms) : ""}</span>
      <button class="x" title="not for me — dismiss without listening" onclick="event.stopPropagation();vqRailDismiss(${abs})">✗</button>
    </div>`;
  }).join("");
  return `<div class="vq-panel"><h3>Up next</h3>${rows || '<div class="vq-slogempty">End of the fetched batch — committing on loads more.</div>'}</div>`;
}

function vqJump(i) {
  if (!state.vq[i]) return;
  state.vqIndex = i;
  renderVerdict();
}

async function vqRailDismiss(i) {
  const t = state.vq[i]; if (!t) return;
  try { await api(`/api/tracks/${t.pk}/dismiss`, { method: "POST", body: "{}" }); }
  catch (e) { toast("Failed — try again"); return; }
  state.vq.splice(i, 1);
  if (state.vqMeta) state.vqMeta.eligible_total = Math.max(0, (state.vqMeta.eligible_total || 1) - 1);
  vqLogAdd(t, "nfm", []);
  renderVerdict();
  undoToast(`Dismissed: ${t.title}`, async () => {
    await api(`/api/tracks/${t.pk}/undismiss`, { method: "POST", body: "{}" });
    state.vq.splice(Math.min(i, state.vq.length), 0, t);
    if (state.vqMeta) state.vqMeta.eligible_total = (state.vqMeta.eligible_total || 0) + 1;
    vqLogRemoveByPk(t.pk);
    renderVerdict();
  });
}

// ── Closest-to-ready panel (R9): the write-side readout of the Training tab ──
function vqReadyPanelHtml() {
  const list = (state.vqReadiness || []).map(p => ({
    ...p,
    deficit: (p.needs_positive || 0) + (p.needs_negative_or_near_miss || 0) + (p.needs_artists || 0) * 3,
  })).sort((a, b) => (a.ready ? 1 : 0) - (b.ready ? 1 : 0) || a.deficit - b.deficit).slice(0, 5);
  const bar = (pid, l, have, max) => {
    const pct = Math.min(100, (have / max) * 100);
    const bumped = l === "yes" && state.vqBumped.includes(pid);
    return `<div class="vq-bar"><span class="l">${l}</span><div class="tr"><div class="fl ${have >= max ? "full" : ""}" style="width:${pct}%"></div></div><span class="v">${bumped ? '<span class="bump">+1 </span>' : ""}${have}/${max}</span></div>`;
  };
  const cards = list.map(p => {
    const need = p.ready ? "✓ ready" : [
      p.needs_positive ? `${p.needs_positive} more yes` : null,
      p.needs_negative_or_near_miss ? `${p.needs_negative_or_near_miss} more no` : null,
      p.needs_artists ? `${p.needs_artists} more artist${p.needs_artists > 1 ? "s" : ""}` : null,
    ].filter(Boolean).join(" · ");
    return `<div class="vq-pcard">
      <div class="vq-ptop"><span class="vq-pname">${esc(p.profile_id)}</span><span class="vq-pneed ${p.ready ? "done" : ""}">${need}</span></div>
      ${bar(p.profile_id, "yes", p.positive, 15)}
      ${bar(p.profile_id, "no", p.negative_plus_near_miss, 15)}
      ${bar(p.profile_id, "artists", p.distinct_positive_artists, 3)}
    </div>`;
  }).join("");
  return `<div class="vq-panel"><h3>Closest to ready <span style="float:right;letter-spacing:0;text-transform:none" title="a profile auto-classifies once it has 15 yes + 15 no examples from 3+ distinct artists">needs 15 yes · 15 no · 3 artists</span></h3>${cards || '<div class="vq-slogempty">—</div>'}</div>`;
}

// ── This-session verdict log (R13). FE state only — the permanent record is
// the tags themselves; row-level undo reverses the verdict via the same
// endpoints as the toast undo. ──
function vqSessionLogHtml() {
  const rows = state.vqSession.map((e, i) => `
    <div class="vq-slogrow"><span class="when">${e.hh}</span>
      <span class="what"><span class="tk">${esc(e.track)}</span> &nbsp;${
        e.kind === "nfm" ? '<span class="nf">✗ not for me</span>' : `<span class="ap">${esc(e.text)}</span>`}</span>
      <a onclick="vqLogUndo(${i})" title="reverse this verdict — removes applied tags / restores rating / undismisses">undo</a></div>`).join("");
  return `<div class="vq-panel vq-slog"><h3>This session · ${state.vqSession.length}</h3>
    <div class="scroll">${rows || '<div class="vq-slogempty">Your verdicts appear here as you go — with one-tap undo for each.</div>'}</div></div>`;
}

function vqLogAdd(t, kind, appliedTags) {
  const before = t._ratedThisCard ? (t._ratingBefore ?? null) : (t.personal_rating ?? null);
  const after = t.personal_rating ?? null;
  const ratedChanged = !!t._ratedThisCard && after !== before;
  const parts = (appliedTags || []).slice();
  if (ratedChanged) parts.push(after ? `${after}★` : "rating cleared");
  const d = new Date();
  state.vqSession.unshift({
    hh: `${d.getHours()}:${String(d.getMinutes()).padStart(2, "0")}`,
    pk: t.pk, track: `${t.title} — ${t.artist}`, kind,
    tags: (appliedTags || []).slice(), ratingBefore: before, ratingAfter: after,
    ratedChanged, text: parts.join(", ") || "committed",
  });
}

function vqLogRemoveByPk(pk) {
  const i = state.vqSession.findIndex(e => e.pk === pk);
  if (i >= 0) state.vqSession.splice(i, 1);
}

async function vqUndoVerdict(e) {
  if (e.kind === "nfm") {
    await api(`/api/tracks/${e.pk}/undismiss`, { method: "POST", body: "{}" });
  } else {
    for (const tag of e.tags) {
      try { await api(`/api/tracks/${e.pk}/tags/${encodeURIComponent(tag)}`, { method: "DELETE" }); }
      catch (err) {}   // tag may already be gone — undo stays best-effort per tag
    }
    if (e.ratedChanged) {
      await api(`/api/tracks/${e.pk}/rating`, { method: "PUT", body: JSON.stringify({ rating: e.ratingBefore }) });
    }
  }
  if (state.vqMeta) state.vqMeta.eligible_total = (state.vqMeta.eligible_total || 0) + 1;
  try { const r = await api("/api/reference/readiness"); state.vqReadiness = r.profiles || []; } catch (err) {}
}

async function vqLogUndo(i) {
  const e = state.vqSession[i]; if (!e) return;
  try { await vqUndoVerdict(e); } catch (err) { toast("Undo failed — try again"); return; }
  state.vqSession.splice(i, 1);
  toast("Undone — verdict reversed");
  renderVerdict();
}

function vqCard() { return state.vq[state.vqIndex]; }

function vqPlay() {
  const t = vqCard(); if (!t || !t.video_id) return;
  play(t.video_id, `${t.artist} — ${t.title}`, t.pk, !!t.playback_video_id);
}

async function vqAccept(i) {
  const t = vqCard(); const s = (t.suggestions || [])[i]; if (!s) return;
  try {
    await api(`/api/tracks/${t.pk}/tags`, { method: "POST", body: JSON.stringify({ tag: s.tag_name }) });
    t._sel.accepted.add(s.profile_id); t._sel.rejected.delete(s.profile_id);
    toast(`✓ ${s.tag_name}`); renderVerdict();
  } catch (e) { toast("Failed — try again"); }
}

async function vqReject(i) {
  const t = vqCard(); const s = (t.suggestions || [])[i]; if (!s) return;
  try {
    await api(`/api/tracks/${t.pk}/verdict/reject/${encodeURIComponent(s.profile_id)}`, { method: "POST", body: "{}" });
    t._sel.rejected.add(s.profile_id); t._sel.accepted.delete(s.profile_id);
    toast(`✕ not ${s.tag_name}`); renderVerdict();
  } catch (e) { toast("Failed — try again"); }
}

function vqPickFunc(tag) {
  const t = vqCard(); t._sel.func = (t._sel.func === tag) ? null : tag; renderVerdict();
}
function vqTogglePersonal(tag) {
  const t = vqCard();
  if (t._sel.personal.has(tag)) t._sel.personal.delete(tag); else t._sel.personal.add(tag);
  renderVerdict();
}
function vqPickEra(tag) {
  // Single-select toggle. _eraTouched marks a deliberate era verdict — an
  // UNTOUCHED prefill never counts as input (no free ride past the empty-
  // commit trap), but it IS committed alongside real input (confirm-or-correct).
  const t = vqCard();
  t._sel.era = (t._sel.era === tag) ? null : tag;
  t._eraTouched = true;
  renderVerdict();
}

// Anything counts as input — a rating alone is a valid commit (R7).
function vqInputMade(t) {
  return !!(t._sel.func || t._sel.personal.size || t._sel.accepted.size
            || t._sel.rejected.size || t._ratedThisCard || t._eraTouched);
}

async function vqCommit() {
  const t = vqCard(); if (!t) return;
  if (!vqInputMade(t)) {   // R7: an empty commit is a no-op trap, not a Later
    toast("Nothing to commit — n = not for me, m = later");
    return;
  }
  const tags = [];
  if (t._sel.func) tags.push(t._sel.func);
  t._sel.personal.forEach(x => tags.push(x));
  if (t._sel.era) tags.push(t._sel.era);   // prefill-or-corrected — commit confirms it
  try {
    for (const tag of tags) {
      await api(`/api/tracks/${t.pk}/tags`, { method: "POST", body: JSON.stringify({ tag }) });
    }
  } catch (e) { toast("Some tags failed — moving on"); }
  const acceptedNames = [...t._sel.accepted].map(pid => {
    const s = (t.suggestions || []).find(x => x.profile_id === pid); return s ? s.tag_name : pid;
  });
  const applied = tags.concat(acceptedNames);
  vqLogAdd(t, "commit", applied);
  const logText = state.vqSession[0].text;

  const prevReady = new Set((state.vqReadiness || []).filter(p => p.ready).map(p => p.profile_id));
  state.vqBumped = applied.slice();   // locked vocab: profile_id == tag_name
  state.vqLastAdv = applied.join(", ");
  state.vqIndex++;
  if (state.vqMeta) state.vqMeta.eligible_total = Math.max(0, (state.vqMeta.eligible_total || 1) - 1);
  try { const r = await api("/api/reference/readiness"); state.vqReadiness = r.profiles || []; } catch (e) {}
  renderVerdict();

  const newlyReady = (state.vqReadiness || []).filter(p => p.ready && !prevReady.has(p.profile_id));
  if (newlyReady.length) {
    // The celebration outranks the undo toast (single slot) — the session log
    // keeps per-row undo available either way.
    toast(`🎉 ${newlyReady.map(p => p.profile_id).join(", ")} is ready to auto-classify`);
  } else {
    undoToast(`Committed: ${logText}`, vqUndoLastCommit);
  }
  setTimeout(() => {
    state.vqBumped = [];
    if (state.view === "review") renderVerdict();
  }, 2500);
}

async function vqUndoLastCommit() {
  const e = state.vqSession[0];
  if (!e || e.kind !== "commit") return;
  try { await vqUndoVerdict(e); } catch (err) { toast("Undo failed — try again"); return; }
  state.vqSession.shift();
  const prev = state.vq[state.vqIndex - 1];
  if (prev && prev.pk === e.pk) {
    state.vqIndex--;
    prev.personal_rating = e.ratingBefore;
    prev._ratedThisCard = false; delete prev._ratingBefore;
  }
  renderVerdict();
}

// Later — a deferral, not a judgement. Auto-returns after 14 days (R6).
async function vqSkip() {
  const t = vqCard(); if (!t) return;
  try { await api(`/api/tracks/${t.pk}/verdict/skip`, { method: "POST", body: "{}" }); } catch (e) {}
  state.vqLastAdv = "";
  state.vqIndex++;
  if (state.vqMeta) {
    state.vqMeta.eligible_total = Math.max(0, (state.vqMeta.eligible_total || 1) - 1);
    state.vqMeta.skipped_total = (state.vqMeta.skipped_total || 0) + 1;
  }
  toast("Later — returns automatically in 14 days");
  renderVerdict();
}

// Not for me — a judgement ("stop showing me this"). Leaves BOTH lenses,
// recoverable via the undo toast, the session log, or Library → Dismissed.
async function vqDismiss() {
  const t = vqCard(); if (!t) return;
  try { await api(`/api/tracks/${t.pk}/dismiss`, { method: "POST", body: "{}" }); }
  catch (e) { toast("Failed — try again"); return; }
  vqLogAdd(t, "nfm", []);
  state.vqLastAdv = "";
  state.vqIndex++;
  if (state.vqMeta) state.vqMeta.eligible_total = Math.max(0, (state.vqMeta.eligible_total || 1) - 1);
  renderVerdict();
  undoToast("Not for me — won't show again", async () => {
    await api(`/api/tracks/${t.pk}/undismiss`, { method: "POST", body: "{}" });
    vqLogRemoveByPk(t.pk);
    if (state.vq[state.vqIndex - 1] && state.vq[state.vqIndex - 1].pk === t.pk) state.vqIndex--;
    if (state.vqMeta) state.vqMeta.eligible_total = (state.vqMeta.eligible_total || 0) + 1;
    renderVerdict();
  });
}

// One-tap rating on the card. Does NOT retire the card — retirement is
// commit/dismiss/skip only — but a newly-rated track leaves the Newest lens,
// so the drain count drops by one there.
async function vqRate(rating) {
  const t = vqCard(); if (!t) return;
  const cur = t.personal_rating || 0;
  const newRating = (cur === rating) ? null : rating;  // tap same star = clear
  try {
    await api(`/api/tracks/${t.pk}/rating`, { method: "PUT", body: JSON.stringify({ rating: newRating }) });
  } catch (e) { toast("Failed — try again"); return; }
  if (!t._ratedThisCard) { t._ratedThisCard = true; t._ratingBefore = cur || null; }
  t.personal_rating = newRating;
  toast(newRating ? ["", "Like", "Really like", "Love", "Perfect ✦"][newRating] : "Rating cleared");
  if (state.reviewSort === "newest" && state.vqMeta) {
    if (newRating && !cur) state.vqMeta.eligible_total = Math.max(0, (state.vqMeta.eligible_total || 1) - 1);
    else if (!newRating && cur) state.vqMeta.eligible_total = (state.vqMeta.eligible_total || 0) + 1;
  }
  renderVerdict();
}

// R10 + R14: playlist-chip removal on the Review card. When the chip was the
// track's ONLY playlist the toast offers a one-tap "Not for me" — the two
// intents often coincide but stay independent (no forced coupling).
async function vqRemovePl(pk, playlistId) {
  const t = vqCard();
  toast("Removing…");
  try {
    const r = await api(`/api/tracks/${pk}/playlists/${encodeURIComponent(playlistId)}/remove`,
                        { method: "POST", body: "{}" });
    const mine = t && t.pk === pk;
    const wasLast = mine && (t.playlists || []).length === 1;
    if (mine) {
      t.playlists = (t.playlists || []).filter(p => p.playlist_id !== playlistId);
      renderVerdict();
    }
    if (wasLast) {
      undoToast(`Removed from ${r.playlist_name} — its only playlist. Also not for me?`,
                () => vqDismiss(), "✗ Not for me");
    } else {
      undoToast(`Removed from ${r.playlist_name}`, async () => {
        await api(`/api/removals/${r.removal_id}/undo`, { method: "POST", body: "{}" });
        if (mine) { t.playlists.push({ playlist_id: playlistId, playlist_name: r.playlist_name }); renderVerdict(); }
        toast("Re-added");
      });
    }
  } catch (e) { alert("Remove failed: " + e.message); }
}

async function vqUnskipAll() {
  try { const r = await api("/api/verdict/unskip-all", { method: "POST", body: "{}" }); toast(`Re-served ${r.restored}`); }
  catch (e) {}
  loadVerdict();
}

function vqReveal() { state.vqGuessFirst = false; renderVerdict(); state.vqGuessFirst = localStorage.getItem("vqGuessFirst") === "1"; }
function vqToggleGuess(on) {
  state.vqGuessFirst = on; localStorage.setItem("vqGuessFirst", on ? "1" : "0"); renderVerdict();
}

function vqShowTiebreakers() {
  const rules = (state.vqTiebreakers || []).map(t =>
    `<p style="margin:8px 0"><b>${esc(t.pair)}</b><br><span class="hint" style="font-size:12.5px">${esc(t.rule)}</span></p>`).join("");
  const bg = document.createElement("div");
  bg.className = "modal-bg";
  bg.onclick = (ev) => { if (ev.target === bg) bg.remove(); };
  bg.innerHTML = `<div class="modal"><h2>Tie-breaker rules</h2>${rules || '<p class="hint">—</p>'}
    <div class="btnrow"><button class="primary" onclick="this.closest('.modal-bg').remove()">Got it</button></div></div>`;
  document.body.appendChild(bg);
}

// ── Skim controls (R4): judging "where in a set" needs intro/drop/outro, not
// real-time playback. Player-time readout lives on the card (eyes are there).
function vqSeek(d) {
  if (!ytReady || !ytPlayer.getDuration) return;
  ytPlayer.seekTo(Math.max(0, (ytPlayer.getCurrentTime() || 0) + d), true);
  vqTickClock();
}
function vqQuarter(dir) {
  if (!ytReady || !ytPlayer.getDuration) return;
  const dur = ytPlayer.getDuration() || 0; if (!dur) return;
  let q = Math.round(((ytPlayer.getCurrentTime() || 0) / dur) * 4) / 4 + dir * 0.25;
  q = Math.max(0, Math.min(0.75, q));
  ytPlayer.seekTo(q * dur, true);
  vqTickClock();
}
function vqSeekClick(e) {
  if (!ytReady || !ytPlayer.getDuration) return;
  const r = e.currentTarget.getBoundingClientRect();
  ytPlayer.seekTo(((e.clientX - r.left) / r.width) * (ytPlayer.getDuration() || 0), true);
  vqTickClock();
}
let vqClockTimer = null;
function vqStartClock() {
  if (!vqClockTimer) vqClockTimer = setInterval(vqTickClock, 500);
}
function vqTickClock() {
  if (state.view !== "review") return;
  const timeEl = $("vq-time"), fill = $("vq-pfill");
  const t = vqCard();
  if (!timeEl || !t || !ytReady || !ytPlayer.getDuration) return;
  if (state.vqPlayedPk !== t.pk) return;   // player is on some other track
  const dur = ytPlayer.getDuration() || (t.duration_ms || 0) / 1000;
  if (!dur) return;
  const cur = ytPlayer.getCurrentTime() || 0;
  timeEl.textContent = `${fmtTime(cur)} / ${fmtTime(dur)}`;
  if (fill) fill.style.width = `${Math.min(100, (cur / dur) * 100)}%`;
}

// Keyboard (R3): full coverage — chips included. Review view only; never while
// typing or with a modal open.
//   q w e r t y u i = functional chips (set order) · a s d f g h j = personal
//   7 8 9 0 - = era chips (70s/80s/90s/00s/modern — the number-row run)
//   z/x/c/v = 1–4★ · 1/2/3 accept · ⇧1/2/3 reject · n = not for me · m = later
//   b = reveal (guess-first) · space = play/pause · ⏎ = commit
//   ←/→ = ±30s · ↑/↓ = quarter jumps
document.addEventListener("keydown", (e) => {
  if (state.view !== "review") return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const tag = (e.target.tagName || "").toLowerCase();
  if (tag === "input" || tag === "textarea" || tag === "select" || document.querySelector(".modal-bg")) return;
  const t = vqCard(); if (!t) return;
  if (e.code === "Space") { e.preventDefault(); togglePlay(); return; }
  if (e.code === "Enter") { e.preventDefault(); vqCommit(); return; }
  if (e.code === "ArrowLeft") { e.preventDefault(); vqSeek(-30); return; }
  if (e.code === "ArrowRight") { e.preventDefault(); vqSeek(30); return; }
  if (e.code === "ArrowUp") { e.preventDefault(); vqQuarter(1); return; }
  if (e.code === "ArrowDown") { e.preventDefault(); vqQuarter(-1); return; }
  const digit = { Digit1: 0, Digit2: 1, Digit3: 2 }[e.code];
  if (digit !== undefined) {
    e.preventDefault();
    if (e.shiftKey) vqReject(digit); else vqAccept(digit);
    return;
  }
  const eraIdx = { Digit7: 0, Digit8: 1, Digit9: 2, Digit0: 3, Minus: 4 }[e.code];
  if (eraIdx !== undefined && !e.shiftKey) {
    const p = vqProfilesByLayer("era")[eraIdx];
    if (p) { e.preventDefault(); vqPickEra(p.tag_name); }
    return;
  }
  if (e.shiftKey) return;
  const k = e.key.toLowerCase();
  if (k === "n") { e.preventDefault(); vqDismiss(); return; }
  if (k === "m") { e.preventDefault(); vqSkip(); return; }
  if (k === "b") { if (state.vqGuessFirst) vqReveal(); return; }
  const star = { z: 1, x: 2, c: 3, v: 4 }[k];
  if (star) { e.preventDefault(); vqRate(star); return; }
  const fi = VQ_FKEYS.indexOf(k);
  if (fi > -1) {
    const p = vqProfilesByLayer("functional")[fi];
    if (p) { e.preventDefault(); vqPickFunc(p.tag_name); }
    return;
  }
  const pi = VQ_PKEYS.indexOf(k);
  if (pi > -1) {
    const p = vqProfilesByLayer("personal")[pi];
    if (p) { e.preventDefault(); vqTogglePersonal(p.tag_name); }
    return;
  }
});


loadGrandTotal(); loadTagChips();
$("pb-vidpref").classList.toggle("on", state.preferVideos);
switchView("home");   // sets state.view, hides Library-only header controls, starts polling
restorePlayer();      // hero survives a refresh: same queue + position, paused
refreshBadges();   // populate the Review + Matches tab badges on boot
</script>
