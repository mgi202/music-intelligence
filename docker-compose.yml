# Music Intelligence System — cloud VPS deployment (see DEPLOY.md)
#
# Usage:
#   1. cp .env.example .env  and fill in API keys
#   2. Generate oauth.json locally (setup_ytm_oauth.py), copy it next to this file
#   3. docker compose up -d --build
#   4. tailscale serve --bg http://localhost:8080
#
# The API binds to localhost only — it is reachable exclusively through
# Tailscale (HTTPS, tailnet-only). Never expose port 8080 publicly: no auth.
#
# Services:
#   api    — FastAPI backend + web frontend
#   worker — ingest → enrich → playlist sync loop (default every 6h)

services:
  api:
    build: .
    container_name: mis-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    env_file: .env
    environment:
      - SQLITE_PATH=/data/library.db
      - YTM_OAUTH_FILE=/config/oauth.json
      # Compose-internal hostname of the vector store (Phase 3).
      - QDRANT_URL=http://qdrant:6333
    volumes:
      - mis-data:/data
      - ./oauth.json:/config/oauth.json

  worker:
    build: .
    container_name: mis-worker
    restart: unless-stopped
    command: ["python", "scripts/run_worker.py"]
    env_file: .env
    environment:
      - SQLITE_PATH=/data/library.db
      - YTM_OAUTH_FILE=/config/oauth.json
      # Interpolated from .env at compose time (falls back to 360). A literal
      # value here would override env_file and make .env edits silently no-ops.
      - WORKER_INTERVAL_MINUTES=${WORKER_INTERVAL_MINUTES:-360}
      # Compose-internal hostname of the vector store (Phase 3).
      - QDRANT_URL=http://qdrant:6333
    volumes:
      - mis-data:/data
      - ./oauth.json:/config/oauth.json

  # Phase 3 (Ears) — Qdrant vector store for 512-dim CLAP track embeddings.
  # No published ports: reachable only on the compose-internal network as
  # http://qdrant:6333 (api/worker). Treated as REBUILDABLE — the raw vectors
  # live in SQLite (audio_features.clap_vector_json, Litestream-backed);
  # scripts/reindex_qdrant.py repopulates the collection from them. The
  # qdrant volume is deliberately NOT in any backup path.
  qdrant:
    image: qdrant/qdrant:v1.15.1
    container_name: mis-qdrant
    restart: unless-stopped
    volumes:
      - mis-qdrant:/qdrant/storage

  # Off-site DB replication to Backblaze B2 (RC1 §S11). ACTIVE — deployed to
  # music-intel-prod 2026-06-25, verified replicating to bucket
  # mis-litestream-backups-de (eu-central-003).
  # Reads /etc/litestream.yml (mounted from ./litestream.yml, gitignored —
  # contains B2 keys; the host file must be chmod 644 so the container can read
  # it). user "0:0" is required so litestream can manage the shadow WAL on the
  # root-owned /data/library.db (the image has no /etc/passwd, so use numeric uid).
  litestream:
    image: litestream/litestream
    container_name: mis-litestream
    restart: unless-stopped
    user: "0:0"
    command: ["replicate"]
    volumes:
      - mis-data:/data
      - ./litestream.yml:/etc/litestream.yml

volumes:
  mis-data:
  mis-qdrant:
